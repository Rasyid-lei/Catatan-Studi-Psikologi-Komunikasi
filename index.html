mat:`
<div class="sec"><h2>📘 KB 1: Konsep Diri (Self-Concept)</h2>
<p>Berpikir tentang diri sendiri tak bisa dihindari. <i>Self</i> adalah pusat dunia sosial setiap orang (Baron &amp; Byrne, 2005). Saat mempersepsi diri, kita menjadi <b>subjek sekaligus objek</b> persepsi. Menurut <b>Charles Horton Cooley</b>, caranya dengan membayangkan diri sebagai orang lain: <b><i>looking-glass self</i> (diri cermin)</b>, seakan menaruh cermin di depan kita. Tiga langkah: (1) membayangkan bagaimana kita tampak pada orang lain, (2) membayangkan bagaimana mereka menilai penampilan kita, (3) timbul perasaan tertentu tentang diri (bangga, kecewa, malu, sedih).</p>
<h3>A. Pengertian konsep diri</h3>
<ul><li>Konsep diri = <b>pikiran dan keyakinan seseorang mengenai dirinya sendiri</b> (“Saya 8 tahun”, “Saya penari terbaik di kelas”).</li>
<li><b>William D. Brooks</b>: persepsi yang bersifat <b>fisik, sosial, dan psikologis</b> mengenai diri kita, didapat dari pengalaman dan interaksi dengan orang lain. Rakhmat (2003): pandangan dan perasaan tentang diri, bersifat psikologis, sosial, dan fisis.</li>
<li><b>Baron &amp; Byrne</b>: kumpulan keyakinan dan persepsi diri yang terorganisir, bekerja sebagai <b>skema dasar</b> yang menentukan cara mengolah informasi tentang diri (motivasi, emosi, evaluasi diri, kemampuan).</li>
<li><b>Deaux, Dane, &amp; Wrightsman (1993)</b>: sekumpulan keyakinan dan perasaan tentang diri (bakat, minat, kemampuan, penampilan fisik), lalu perasaan positif atau negatif terhadapnya.</li>
<li>Penting dipelajari karena memengaruhi perilaku, terutama dalam menanggapi dunia dan pengalaman (Markus, 1977). Tak ada yang lahir dengan konsep diri; ia berkembang dari dorongan dalam diri dan pengaruh luar.</li>
<li><b>Harry Stack Sullivan</b>: bila diterima, dihormati, disenangi orang lain, kita cenderung menghormati dan menerima diri. Bila diremehkan, disalahkan, ditolak, kita cenderung tidak menyenangi diri.</li></ul>
${T(`<tr><th>Persepsi tentang diri</th><th>Contoh pertanyaan</th></tr>
<tr><td>Psikologis</td><td>Bagaimana watak saya? Apa yang membuat saya bahagia/sedih? Apa yang mencemaskan saya?</td></tr>
<tr><td>Sosial</td><td>Bagaimana orang lain memandang saya? Menghargai atau merendahkan? Membenci atau menyukai?</td></tr>
<tr><td>Fisis</td><td>Bagaimana pandangan saya tentang penampilan? Menarik atau jelek? Tubuh kuat atau lemah?</td></tr>`)}
${I('Konsep diri = gambaran + <b>penilaian</b>. Tiga persepsi: <b>P-S-F</b> (Psikologis, Sosial, Fisis). Cooley = cermin: “aku tampak, dinilai, lalu merasa”.')}
<h3>B. Sumber-sumber konsep diri</h3>
<p>Dua sumber: <b><i>self-esteem</i> (harga diri)</b> dan <b><i>social evaluation</i> (penilaian sosial)</b>.</p>
<h3>1. Self-esteem</h3>
<ul><li>Penilaian positif atau negatif individu terhadap diri sendiri. <b>Tinggi</b>: estimasi tinggi atas nilai, kemampuan, kepercayaan; sikap positif, puas, lebih lentur menghadapi situasi sulit, menerima diri apa adanya. <b>Rendah</b>: penilaian buruk atas pengalaman lalu dan pengharapan rendah bagi masa depan.</li>
<li>Konsep diri punya <b>dua komponen</b> (Rakhmat): <b>kognitif = <i>self-image</i> (citra diri)</b> (“Saya bodoh”) dan <b>afektif = harga diri</b> (“Saya malu sekali karena bodoh” atau “Saya senang saya bodoh”).</li>
<li>Mengapa ingin harga diri positif (Vaughan &amp; Hogg, 2002)? (a) membuat nyaman di tengah kepastian kematian; (b) mengatasi kecemasan, kesepian, penolakan sosial, sehingga menjadi <b>alat ukur sosial (<i>sociometer</i>)</b> seberapa diterima kita.</li>
<li><b><i>Above-average effect</i></b>: menilai diri di atas rata-rata pada aspek yang positif secara sosial (Baron, Byrne, Branscombe, 2006).</li>
<li><b><i>Self-serving bias</i></b>: hasil positif dianggap karena faktor internal (trait), hasil negatif karena faktor eksternal (orang lain atau situasi).</li>
<li>Dulu harga diri rendah dianggap akar penyakit sosial (narkoba, prestasi buruk, depresi, kekerasan, terorisme). Penelitian: harga diri tinggi tak selalu positif; <b>bullying, narsisme, eksibisionisme</b> bisa dilakukan orang berharga diri tinggi, karena superioritas yang terancam dipertahankan dengan agresi.</li></ul>
<h3>2. Social evaluation</h3>
<p>Kebanyakan informasi tentang diri datang dari orang lain, bukan refleksi diri. Prosesnya: <b>reflected appraisal</b> dan <b>direct feedback</b>.</p>
${T(`<tr><th>Proses</th><th>Isi</th></tr>
<tr><td>Reflected appraisal (pantulan penilaian)</td><td>Pendapat kita tentang diri adalah cermin penilaian nyata orang lain. “Orang bilang saya bukan pendengar baik” menjadi “Saya bukan pendengar baik”. Lebih sering terjadi.</td></tr>
<tr><td>Direct feedback (umpan balik langsung)</td><td>Orang lain, terutama <b>significant others</b> (orang tua, teman dekat), menyatakan penilaian langsung. Lebih jarang, tetapi sumber penting. Cinta bersyarat (“kami bangga jika kamu terbaik di sekolah”) mengembangkan konsep diri rendah. Menurut teori kepribadian humanistis, penghargaan positif <b>tanpa syarat</b> membuat dewasa bahagia dan sehat.</td></tr>`)}
<h3>C. Teori-teori konsep diri</h3>
<h3>1. Pembandingan sosial (<i>social comparison</i>) – Leon Festinger</h3>
<p>Karena tak ada patokan objektif, orang membandingkan diri dengan orang lain. Motifnya lebih karena ingin gambaran <b>positif</b>, bukan gambaran akurat (Baumeister, 1998). Menjelaskan keyakinan sosial, perubahan sikap, komunikasi kelompok.</p>
<p><b>Empat prinsip dasar:</b> (a) setiap orang punya keyakinan tertentu; (b) penting bagi keyakinan kita untuk benar; (c) beberapa keyakinan lebih sulit dibuktikan, yang subjektif dibuktikan lewat pembuktian bersama (membuat orang lain setuju), ini prinsip kunci; (d) bila anggota <b>kelompok rujukan (<i>reference group</i>)</b> tidak setuju, mereka berkomunikasi sampai konflik selesai.</p>
${T(`<tr><th>Kecenderungan</th><th>Isi</th></tr>
<tr><td>Similarity hypothesis</td><td>Membandingkan diri dengan orang yang <b>mirip</b>; terutama untuk penampilan (untuk opini tidak harus)</td></tr>
<tr><td>Related attributes hypothesis</td><td>Dengan orang yang atributnya <b>berhubungan</b>, yang semestinya sama. Ibu bekerja membandingkan dengan ibu bekerja seusia bagi evaluasi seimbang (bukan dengan ibu rumah tangga atau pekerja tanpa anak).</td></tr>
<tr><td>Downward comparison</td><td>Membandingkan dengan yang lebih rendah saat kecewa atau gagal (“Saya lega saya bukan...”), membuat lebih baik, perbaikan diri dengan merendahkan orang lain</td></tr>
<tr><td>Consequences</td><td>Sering otomatis dan terbatas pada hal relevan (nilai komunikasi dibanding peserta kuliah sama). Murid piano baru yang dibandingkan dengan pianis terkenal jadi putus asa; dibandingkan murid seusia atau dirinya dulu jadi semangat.</td></tr>`)}
<h3>2. Persepsi diri (<i>self-perception</i>) – Daryl Benn (ejaan di modul)</h3>
<p>Kita tak lebih ahli tentang maksud dan tindakan sendiri daripada orang lain. Menilai pendapat sendiri, kita memakai <b>perilaku sebagai petunjuk (<i>clues</i>)</b> (warna favorit biru karena paling sering dipakai). Dua cara:</p>
<ul><li><b>Self-attribution</b>: mencari penjelasan pola kehadiran dan perilaku yang diingat. “Memalsukan” emosi (menampakkan wajah bahagia atau marah) bisa membuatnya terasa nyata: “Saya tadi tersenyum, jadi saya senang.”</li>
<li><b>Overjustification</b>: dibayar mahal untuk kerja sulit → kesimpulan motivasi utamanya uang (ekstrinsik). Bekerja keras tanpa bayaran → motivasi intrinsik. Dibayar untuk pekerjaan yang disenangi → merasa overjustified, motivasi intrinsik berkurang. Anak yang senang matematika diberi uang jadi kurang menyukai dan hanya mau mengerjakan bila ada bonus.</li></ul>
${I('Social comparison = “<b>aku lihat orang</b>” (Festinger). Self-perception = “<b>aku lihat perilakuku</b>”. Overjustification = bayaran membunuh rasa suka.')}
<h3>D. Hubungan konsep diri dan komunikasi</h3>
<p>Konsep diri sangat menentukan komunikasi interpersonal karena setiap orang bertingkah laku sedapat mungkin sesuai konsep dirinya (Rakhmat). Mahasiswa yang menganggap diri rajin akan hadir teratur dan mencatat; yang rendah diri sulit menyampaikan gagasan, tak mampu bicara di depan umum. Kecenderungan ini disebut <b>“nubuat yang dipenuhi sendiri”</b> (<i>self-fulfilling prophecy</i>): berperilaku sesuai label yang kita lekatkan pada diri. Dua kualitas konsep diri: positif dan negatif.</p>
${T(`<tr><th>Brook dan Emmert: 5 ciri konsep diri positif</th></tr>
<tr><td>1. Yakin mampu mengatasi masalah</td></tr><tr><td>2. Merasa setara dengan orang lain</td></tr><tr><td>3. Menerima pujian tanpa rasa malu</td></tr><tr><td>4. Sadar setiap orang punya perasaan, keinginan, dan perilaku yang tak seluruhnya disetujui masyarakat</td></tr><tr><td>5. Mampu memperbaiki diri karena sanggup mengungkapkan kepribadian yang tak disenangi dan berusaha mengubahnya</td></tr>`)}
${T(`<tr><th>Hamachek: 11 karakteristik konsep diri positif</th></tr>
<tr><td>1. Yakin pada nilai dan prinsip serta mau mempertahankannya walau kelompok kuat menentang, tetapi tangguh mengubahnya bila bukti baru menunjukkan ia salah</td></tr>
<tr><td>2. Bertindak berdasarkan penilaian baik tanpa rasa bersalah berlebihan atau menyesal bila orang lain tak setuju</td></tr>
<tr><td>3. Tak menghabiskan waktu mencemaskan hari esok, masa lalu, dan masa kini</td></tr>
<tr><td>4. Yakin mampu mengatasi persoalan, bahkan saat gagal atau mundur</td></tr>
<tr><td>5. Merasa sama dengan orang lain, tidak tinggi atau rendah, walau beda kemampuan, latar keluarga, atau sikap orang</td></tr>
<tr><td>6. Sanggup menerima diri sebagai orang penting dan bernilai bagi orang lain (minimal sahabat pilihannya)</td></tr>
<tr><td>7. Menerima pujian tanpa berpura-pura rendah hati dan penghargaan tanpa rasa bersalah</td></tr>
<tr><td>8. Cenderung menolak usaha orang lain mendominasinya</td></tr>
<tr><td>9. Sanggup mengaku merasakan berbagai dorongan dan keinginan (marah sampai cinta, sedih sampai bahagia, kecewa sampai puas)</td></tr>
<tr><td>10. Mampu menikmati diri dalam berbagai kegiatan (kerja, main, ungkapan kreatif, persahabatan, mengisi waktu)</td></tr>
<tr><td>11. Peka pada kebutuhan orang lain, kebiasaan sosial, dan sadar tak bisa bersenang-senang dengan mengorbankan orang lain</td></tr>`)}
${T(`<tr><th>Ciri konsep diri negatif</th><th>Artinya</th></tr>
<tr><td>1. Peka terhadap kritik</td><td>Tak tahan kritik, mudah marah; koreksi dianggap menjatuhkan harga diri</td></tr>
<tr><td>2. Responsif dan antusias terhadap pujian</td><td>Segala yang menunjang harga diri jadi pusat perhatian</td></tr>
<tr><td>3. Hiperkritis terhadap orang lain</td><td>Ingin dipuji tapi tak sanggup memuji; mengeluh, mencela, meremehkan</td></tr>
<tr><td>4. Cenderung merasa tak disenangi</td><td>Tak menyalahkan diri, merasa korban sistem sosial, orang lain dianggap musuh, tak bisa hangat</td></tr>`)}
<p>Konsep diri positif melahirkan pola komunikasi interpersonal positif: persepsi lebih cermat dan mengungkapkan petunjuk agar orang menafsirkan kita lebih cermat. Menurut <b>Sidney M. Jourard</b>, orang itu “<b>tembus pandang</b>” (<i>transparent</i>), terbuka kepada orang lain.</p>
${I('Brook-Emmert = <b>5</b> ciri positif; Hamachek = <b>11</b> ciri positif; negatif = <b>4</b> ciri. Negatif = “<b>P</b>eka kritik, <b>P</b>engen pujian, <b>H</b>iperkritis, <b>M</b>erasa dimusuhi”.')}
</div>
<div class="sec"><h2>📗 KB 2: Kognisi Sosial tentang Diri</h2>
<p>Diri sosial dipaparkan dalam tiga hal: konsep diri (KB1), <b>kognisi sosial tentang diri</b>, dan <b>motivasi diri</b>.</p>
<h3>A. Kognisi sosial tentang diri dan pengembangan diri</h3>
<p><b>Kognisi sosial</b> = cara kita menginterpretasi, menganalisis, mengingat, dan memakai informasi tentang dunia sosial (Baron &amp; Byrne, 2004). William James: seseorang bisa menjadi <b>objek pikirannya sendiri</b>. Gordon Allport menyebut proses mengembangkan, memodifikasi, menyaring identitas personal dan konsep diri sebagai <b><i>becoming</i></b>, yaitu <b>self-development</b>.</p>
${T(`<tr><th>Istilah</th><th>Tokoh</th><th>Arti</th></tr>
<tr><td>Role models</td><td>-</td><td>Panutan dalam bertindak, berpikir, merasa</td></tr>
<tr><td>Significant others</td><td>George Herbert Mead</td><td>Orang lain yang sangat penting bagi diri seseorang (mula-mula orang tua, pengasuh, kakak, kerabat di rumah); dalam perkembangan: semua orang yang memengaruhi perilaku, pikiran, perasaan</td></tr>
<tr><td>Affective others</td><td>Richard Dewey dan W.J. Humber</td><td>Orang lain yang punya ikatan emosional dengan kita</td></tr>
<tr><td>Generalized others</td><td>Mead</td><td>Pandangan diri kita tentang keseluruhan pandangan orang lain terhadap kita</td></tr>
<tr><td>Role taking</td><td>Mead</td><td>Proses mengambil peran sebagai generalized others; amat penting bagi pembentukan konsep diri</td></tr>`)}
<p>Pengaruh meluas: keluarga → teman, kelompok, organisasi, masyarakat. <b>Media massa dan media baru</b> juga memberi informasi baru (maskulinitas-feminitas, pekerjaan, ras, kekerasan, kriminalitas, konsumsi, gaya hidup, hubungan interpersonal). Contoh: gaya tulis SMS remaja “alay” dipengaruhi teman sebaya (<i>peer group</i>). Sajak Dorothy Law Nolte <i>Children Learn What They Live</i> menggambarkan pentingnya pembentukan diri masa kecil. Kognisi diri terlihat dari <b>self-awareness</b> dan <b>self-schemata</b>.</p>
<h3>1. Self-awareness (kesadaran diri)</h3>
<p>Perhatian yang terfokus pada diri sendiri, perasaan, nilai, maksud, dan/atau evaluasi orang lain. Menunjukkan derajat kita mengenal diri; membantu tahu kelebihan dan kekurangan serta bahwa tingkah laku dikendalikan pikiran. Model <b><i>Johari Window</i></b> (Joseph Luft dan Harry Ingham, 1984; “Johari” = singkatan nama Joseph + Harry). Diri terbagi empat sel dari irisan dua dimensi: diketahui diri sendiri (privat) dan diketahui orang lain (publik). Pembesaran satu jendela mengecilkan jendela lain.</p>
${T(`<tr><th></th><th>Diketahui diri sendiri</th><th>Tidak diketahui diri sendiri</th></tr>
<tr><td><b>Diketahui orang lain</b></td><td><b>Open self</b> (daerah terbuka): informasi, perilaku, sifat, perasaan, motif, ide yang diketahui kita dan orang lain (agama, jenis kelamin, ras, nama, hobi, status sosial)</td><td><b>Blind self</b> (daerah buta): diketahui orang lain tapi tidak oleh kita, atau yang kita abaikan/tolak (dikenal bermulut tajam, suka menyombong). Dikurangi → open meluas, self-awareness dan komunikasi naik</td></tr>
<tr><td><b>Tidak diketahui orang lain</b></td><td><b>Hidden self</b> (daerah tersembunyi): kita tahu, orang tidak; rahasia (keuangan, rahasia sukses, perasaan sebenarnya, masalah keluarga, kehidupan seks, kecemasan, ketakutan)</td><td><b>Unknown self</b> (tak diketahui): tidak diketahui kita maupun orang lain, sulit diketahui tapi ada</td></tr>`)}
<p>Makin tinggi kesadaran diri, makin tahu cara berkomunikasi; komunikasi juga meningkatkan pengetahuan tentang diri. <b>DeVito: lima cara meningkatkan self-awareness</b>: (1) bertanya tentang diri kepada diri sendiri (<i>self-talk</i>); (2) mendengarkan orang lain (feedback → <i>self-knowledge</i>); (3) aktif mencari informasi tentang diri (memperkecil blind self); (4) melihat diri dari sisi lain; (5) meningkatkan open self, mengurangi hidden self lewat membuka diri (<i>self-disclosure</i>).</p>
<p><b>Deindividuation</b> = menurunnya self-awareness sehingga bertindak tanpa mengindahkan standar atau nilai diri, merasa bebas melakukan hal yang tak disetujui orang. Dipicu kelompok anonim dengan aktivitas “heboh” (konser, pertandingan olahraga). Membantu menjelaskan perilaku kerumunan dan aktivitas kriminal.</p>
${I('Johari: baris = <b>orang lain tahu?</b>, kolom = <b>aku tahu?</b>. Terbuka (sama-sama tahu), Buta (hanya mereka), Tersembunyi (hanya aku), Tak dikenal (tak ada yang tahu). DeVito = 5 cara.')}
<h3>2. Self-schemata (skema diri)</h3>
<p>Skemata = kategorisasi gagasan tentang stimuli yang dikembangkan sendiri. <b>Self-schemata</b> = seperangkat <i>self-generalizations</i> dari diri, didapat dari penilaian sendiri atau orang lain; memengaruhi apa yang diperhatikan dan diingat tentang diri (“fisik tidak kuat” membuat ragu masuk klub olahraga). Membatasi, tetapi <b>dinamis</b>.</p>
${T(`<tr><th>Istilah</th><th>Arti dan contoh</th></tr>
<tr><td>Schematic trait</td><td>Sifat yang relevan dan penting bagi pikiran seseorang tentang dirinya (kecerdasan bagi murid ranking teratas)</td></tr>
<tr><td>Aschematic trait</td><td>Sifat yang tak penting bagi konsep diri (kecerdasan bagi murid yang cukup puas nilai C)</td></tr>
<tr><td>Self-reference</td><td>Informasi yang relevan bagi diri</td></tr>
<tr><td>Self-reference effect</td><td>Informasi relevan diikuti lebih baik dan diingat lebih akurat (calon guru musik memperhatikan berita konser dan pendapatan guru)</td></tr>
<tr><td>Self-discrepancies (ketidaksesuaian diri)</td><td>Pengalaman bertentangan dengan skema (ingin ayah yang baik tetapi kerja sampai malam). <b>Actual self + ideal self</b> → depresi, kekecewaan, kesedihan. <b>Actual self + ought self</b> (diri yang bertanggung jawab) → kecemasan, rasa bersalah, ketidaknyamanan.</td></tr>
<tr><td>Possible selves</td><td>Perluasan self-concept: membayangkan menjadi orang berbeda bila memilih jalan lain. Memberi dorongan perbaikan (yang gemuk membayangkan kurus lebih giat berlatih). Bisa menimbulkan pertentangan estimasi diri dengan penilaian orang (anak ingin jadi musisi, orang tua menilai konyol). Konflik antarpossible selves memengaruhi emosi, depresi atau kecemasan.</td></tr>`)}
<p>Self-schemata orang depresi banyak berisi informasi negatif, sehingga interpretasi baru jadi bukti rendahnya nilai diri; self-schemata negatif “abadi dengan sendirinya”.</p>
<h3>B. Self-motivation (motivasi diri)</h3>
<p>Menurut <b>Weber</b>, motivasi diri dilihat dari tiga hal: <b>self-consistency, self-enhancement, self-control</b>. Modul hanya membahas dua yang pertama (self-control banyak diulas di psikologi klinis).</p>
<h3>1. Self-consistency</h3>
<p>Gambaran diri sulit berubah, baik positif maupun negatif; kita terdorong mempertahankan konsistensi penilaian diri masa lalu dan kini. Bila ditantang, orang menguatkan penilaian dirinya (orang kompetitif yang dibilang tak kompetitif malah bertindak lebih kompetitif). Elemen kognitif (sikap, maksud) <b>seimbang</b> bila harmonis. Contoh: Anda senang dosen, senang sahabat, sahabat senang dosen = seimbang; sahabat tak suka dosen = tak seimbang, Anda mempertimbangkan ulang. Kebutuhan seimbang kadang memotivasi mengubah pikiran (menyukai produk yang direkomendasikan artis idola).</p>
<p><b>Self-justification</b> = mendukung perilaku setelah dilakukan (dirasionalkan); pendorong kuat perubahan sikap. Terjadi pada <b>cognitive dissonance</b> = ketegangan ketika elemen kognisi bertentangan (tahu rokok sebabkan kanker tapi tetap merokok). Festinger: dua keadaan yang menimbulkan kebutuhan pembenaran diri:</p>
${T(`<tr><th>Keadaan</th><th>Contoh</th></tr>
<tr><td>Insufficient justification</td><td>Mengeluarkan banyak uang untuk mobil yang tak disukai orang, lalu beralasan “investasi besar, nilai jual tinggi”</td></tr>
<tr><td>Decision making</td><td>Setelah memilih satu dari dua kuliah penting, melihat kekurangan yang tak dipilih dan manfaat pilihan sendiri</td></tr>`)}
<h3>2. Self-enhancement</h3>
<p>Perlindungan dan pertahanan <b>self-esteem</b>. Termasuk downward comparison dan self-justification, serta dua bentuk lain:</p>
${T(`<tr><th>Bentuk</th><th>Unsur</th><th>Isi</th></tr>
<tr><td rowspan="4">Self-serving processes</td><td>Egocentric bias</td><td>Pengolahan dan pengingatan bias karena pemusatan diri; ingat lebih baik yang relevan bagi diri. Contoh: tiap pasangan merasa kontribusinya terbesar.</td></tr>
<tr><td>False-uniqueness effect</td><td>Berbuat baik → menyimpulkan hanya sedikit orang akan berbuat sama</td></tr>
<tr><td>False-consensus effect</td><td>Berbuat buruk → meyakinkan diri orang lain pasti akan berbuat sama</td></tr>
<tr><td>Beneffectance</td><td>Mengedepankan hal baik dari sukses, menjauhkan kegagalan (bias atribusi, dibahas Modul 5). Pemain bola menyalahkan cuaca.</td></tr>
<tr><td rowspan="3">Self-presentation</td><td>Impression management</td><td>Erving Goffman: orang “tampil” untuk kesan tertentu. Perangkat penampilan = <b>front</b>: <b>panggung (<i>setting</i>)</b> (ruang dan benda, misal ensiklopedi atau foto bersalaman dengan presiden), <b>penampilan (<i>appearance</i>)</b> (petunjuk artifaktual: baju, sepatu, tas), <b>gaya bertingkah laku (<i>manner</i>)</b> (cara berjalan, duduk, bicara, memandang).</td></tr>
<tr><td>Social accounting</td><td>Meyakinkan orang bahwa kita bertindak semestinya: mimik muka (malu, tersenyum, kontak mata) dan <i>excuses</i> (alasan sebenarnya atau dibuat-buat)</td></tr>
<tr><td>Self-monitoring</td><td>Mengawasi tindakan untuk mencapai tujuan. <b>High</b>: memperhatikan orang lain, menyenangkan mereka, mengatakan yang mereka mau dengar. <b>Low</b>: konsisten di situasi apa pun, mempertahankan nilai dan prinsip.</td></tr>`)}
${T(`<tr><th>Strategi presentasi diri (Jones &amp; Pittman, 1982)</th><th>Tujuan</th><th>Menampilkan diri sebagai</th></tr>
<tr><td>Ingratiation</td><td>Disukai</td><td>Orang yang ingin menyenangkan (berlebihan = ABS, Asal Bapak Senang)</td></tr>
<tr><td>Self-promotion</td><td>Dianggap kompeten</td><td>Orang berkelebihan atau berkekuatan</td></tr>
<tr><td>Intimidation</td><td>Ditakuti</td><td>Orang berbahaya dan menakutkan</td></tr>
<tr><td>Supplication</td><td>Dikasihani</td><td>Orang lemah dan tergantung</td></tr>
<tr><td>Exemplification</td><td>Dianggap berintegritas moral tinggi</td><td>Orang yang rela berkorban</td></tr>`)}
${I('Strategi presentasi: <b>I-S-I-S-E</b> (“<b>I</b>ni <b>S</b>aya <b>I</b>ngin <b>S</b>uka <b>E</b>nak”). Front = <b>P-P-G</b>: Panggung, Penampilan, Gaya. False-<b>u</b>niqueness = aku baik, <b>u</b>nik; false-<b>c</b>onsensus = aku buruk, <b>c</b>uma sama saja.')}
</div>
<div class="sec"><h2>🔥 Sering keluar di ujian</h2><ul>
<li>Cooley = <i>looking-glass self</i>. Brooks = persepsi fisik, sosial, psikologis. Sullivan = diterima orang lain → menerima diri.</li>
<li>Komponen kognitif konsep diri = <b>self-image</b>; komponen afektif = <b>harga diri</b>. Jangan tertukar.</li>
<li>Sumber konsep diri: self-esteem dan social evaluation (reflected appraisal, direct feedback). Direct feedback lebih jarang dari reflected appraisal. Significant others bagi direct feedback.</li>
<li>Self-esteem tinggi: puas dan menghargai diri (bukan “kritis” atau “tidak mudah puas”). Harga diri tinggi tak selalu positif (bullying, narsisme, eksibisionisme).</li>
<li>Self-serving bias: sukses karena internal, gagal karena eksternal. Above-average effect: menilai diri di atas rata-rata.</li>
<li>Pembandingan sosial = Festinger (4 prinsip, kelompok rujukan, similarity, related attributes, downward). Persepsi diri = perilaku sebagai petunjuk (self-attribution, overjustification).</li>
<li>Konsep diri menentukan <b>komunikasi interpersonal</b> (nubuat yang dipenuhi sendiri). Konsep diri positif: Brook-Emmert (menerima pujian tanpa malu). Konsep diri negatif: peka kritik, antusias pujian, hiperkritis, merasa tak disenangi.</li>
<li>Mead = significant others, generalized others, role taking. Dewey dan Humber = affective others. Allport = becoming. William James = diri jadi objek pikiran sendiri.</li>
<li>Johari: Luft dan Ingham. Blind self = diketahui orang lain, tidak diri sendiri. Hidden = hanya diri sendiri. Unknown = tak ada yang tahu. Open dikembangkan lewat self-disclosure.</li>
<li>DeVito = 5 cara meningkatkan self-awareness. Deindividuation = self-awareness turun di kerumunan anonim.</li>
<li>Actual vs ideal → depresi, kecewa; actual vs ought → cemas, bersalah. Self-reference effect = informasi relevan diingat lebih baik. Schematic trait vs aschematic trait.</li>
<li>Weber: self-consistency, self-enhancement, self-control (yang tak dibahas). Festinger: insufficient justification dan decision making; cognitive dissonance.</li>
<li>Goffman = impression management; front = panggung, penampilan, manner. Jones dan Pittman = lima strategi. High vs low self-monitoring. Beneffectance = bias atribusi.</li></ul></div>

<tr><td>KB2: kognisi sosial, pengembangan diri</td><td>4.21 – 4.23</td></tr><tr><td>KB2: self-awareness, Johari</td><td>4.24 – 4.27</td></tr><tr><td>KB2: self-schemata</td><td>4.27 – 4.29</td></tr><tr><td>KB2: self-motivation</td><td>4.29 – 4.34</td></tr><tr><td>Rangkuman KB2</td><td>4.35 – 4.36</td></tr>`)}<p class="note">Nomor halaman diperkirakan dari urutan lembar PDF. Petunjuk jawaban latihan di modul menyebut halaman 4.4, 4.5, 4.8–4.10 yang tidak cocok dengan urutan ini, jadi mohon dicek di buku.</p></div>`,

mat:`
<div class="sec"><h2>📘 KB 1: Inferensi Sosial</h2>
<p>Selain memersepsi benda, kita memersepsi orang: <b>persepsi sosial</b>, tujuannya memahami orang lain. Bedanya dengan persepsi benda yang objektif, persepsi sosial <b>sangat subjektif</b>. Sering kita sudah mendengar nama atau gambaran seseorang sebelum bertemu, dan sudah punya kesimpulan darinya. Itulah <b>inferensi sosial</b>.</p>
<h3>A. Persepsi benda vs persepsi sosial (Rakhmat, 2003: persepsi interpersonal)</h3>
${T(`<tr><th>Aspek</th><th>Persepsi benda</th><th>Persepsi sosial (orang)</th></tr>
<tr><td>1. Cara stimuli sampai</td><td>Ditangkap pancaindra lewat benda fisik: gelombang cahaya, suara, temperatur</td><td>Lewat <b>lambang verbal atau grafis yang disampaikan pihak ketiga</b>, yang bisa mengurangi kecermatan (contoh Sophia Latjuba dari TV, majalah, tabloid)</td></tr>
<tr><td>2. Tingkat kesulitan</td><td>Hanya menanggapi sifat luar objek</td><td><b>Jauh lebih sulit</b>: memahami perilaku sekaligus <b>motif</b>, maka perlu atribusi</td></tr>
<tr><td>3. Reaksi</td><td>Objek tidak bereaksi; tak ada reaksi emosional</td><td>Terlibat faktor personal kita, karakteristik orang yang dipersepsi, dan hubungan kita dengannya</td></tr>
<tr><td>4. Sifat objek</td><td>Relatif tetap</td><td>Orang cenderung <b>berubah-ubah</b> (gembira kemarin, sedih hari ini; di tempat ibadah vs pesta)</td></tr>`)}
${I('Empat beda: <b>C-S-R-T</b> = <b>C</b>ara stimuli (pihak ketiga), <b>S</b>ulit (ada motif), <b>R</b>eaksi (hubungan), <b>T</b>etap vs berubah.')}
<h3>B. Inferensi sosial</h3>
<p>Weber (1992): inferensi sosial = mengerti apa yang kita pelajari tentang orang lain. Prosesnya mengumpulkan <b>data sosial</b>: informasi sosial, penampilan fisik, isyarat nonverbal, tindakan orang lain, yang terintegrasi membentuk <b>kesan</b>. Empat sumber: <b>(1) informasi sosial, (2) penampilan, (3) petunjuk nonverbal, (4) implikasi tindakan orang lain</b>. Kontak pertama tak selalu “tangan pertama” (misal kenal lewat telepon atau surat). Psikologi kognitif: manusia adalah <i>information processors</i>.</p>
<h3>1. Informasi sosial (tiga bentuk)</h3>
${T(`<tr><th>Bentuk</th><th>Isi</th></tr>
<tr><td>Trait (sifat, pembawaan)</td><td>Cenderung stabil, mengacu pada pribadi, menjelaskan cara berperilaku dalam situasi tertentu. Generalisasi sikap, kebenarannya tak mutlak (orang bisa berbeda di situasi lain).</td></tr>
<tr><td>Nama</td><td>Nama bisa menarik dan mudah diingat (relatif menurut budaya). <b>Harari dan McDavid (1973)</b>: karangan siswa kelas 5 yang sama, diberi nama pengarang “bagus” (Karen, Lisa, David, Michael) atau “jelek” (Elmer, Hubert, Bertha, Adelle); <b>nama menarik dinilai lebih tinggi</b>. Nama berasosiasi dengan kecerdasan, daya tarik, kekuatan, feminitas. (Tabel 5.1 memuat ranking nama perempuan menurut pria dan wanita; angkanya tak terbaca jelas di berkas.)</td></tr>
<tr><td>Stereotype</td><td>Generalisasi tentang kelompok yang dianggap kebenaran (contoh stereotip suku Batak keras dan tidak sabar). Efek 1: <b>simplifikasi dan <i>social judgment</i></b> (penilaian cepat; pengalaman baru masuk “laci” kategori memori berdasarkan kesamaan dengan masa lalu; contoh perempuan dianggap lebih sabar menjahit). Efek 2: <b>oversimplifikasi dan <i>prejudice</i></b> (generalisasi negatif, meremehkan; prasangka bisa berujung diskriminasi).</td></tr>`)}
<h3>2. Penampilan</h3>
<p>Penampilan fisik adalah hal pertama diperhatikan; dari situ kita menarik data sosial (pekerjaan, usia, status, pendidikan). Hal yang diperhatikan:</p>
<ul><li><b>Daya tarik fisik</b>: dua efek. <b>Halo effect</b>: menilai satu karakteristik penting memengaruhi tafsir informasi lain (suka penampilan → berharap suka hobi, sikap, nilai; cantik → dianggap periang, baik hati). <b><i>Physical attractiveness stereotype</i></b>: menilai seseorang sama seperti penampilannya; yang menarik dikaitkan dengan kesuksesan dan kesempatan lebih baik. Itu stereotip yang belum tentu benar.</li>
<li><b>Stigma</b>: label sosial buruk (negara berkembang = miskin, korup; AIDS dianggap stigma). Sumber prasangka: dari menjauhi sampai diskriminasi.</li></ul>
<h3>3. Petunjuk nonverbal</h3>
${T(`<tr><th>Petunjuk</th><th>Isi</th></tr>
<tr><td>Ekspresi wajah</td><td>Sumber persepsi yang dapat diandalkan; <b>paling penting untuk mengenali perasaan orang</b> (senyum = ramah dan gembira; kening mengerut = marah)</td></tr>
<tr><td>Kontak mata</td><td>Menunjukkan keintiman: dengan orang tak dikenal dihindari, dengan yang disenangi sesering mungkin. Mata terbuka lebar dan berbinar = senang; pupil mengecil = tidak tertarik</td></tr>
<tr><td>Gesture</td><td>Gerakan tangan, jari, lengan, kepala (V = damai atau kemenangan; menggeleng sambil mengangkat bahu = tidak tahu). Sulit dikendalikan sadar; bila bertentangan dengan ucapan, <b>orang lebih percaya gerakan tubuh</b></td></tr>
<tr><td>Suara (<i>paralanguage</i>)</td><td>Cara menggunakan bahasa: volume, logat, dialek, intonasi, kualitas suara, kecepatan bicara. Keras dan tinggi = marah; pelan, ragu, bergetar = gugup atau takut</td></tr>`)}
<h3>4. Tindakan</h3>
<p>Kita memperhatikan cara orang bertindak dan mencari alasannya: proses mencari sebab itu disebut <b>atribusi</b> (dibahas di KB2).</p>
<h3>C. Pembentukan kesan: tiga proses</h3>
<p>(1) pembentukan konsep sosial, (2) pengorganisasian kesan, (3) pengolahan informasi sosial.</p>
<h3>1. Pembentukan konsep sosial</h3>
<p>Konsep sosial = kategori yang membantu kita berpikir tentang orang (kelompok usia, ras, gender, hubungan keluarga; membedakan teman-musuh, lelaki-perempuan). Terbentuk melalui:</p>
<ul><li><b>Pengalaman</b>: membentuk <b>kategori alami (<i>natural categories</i>)</b>; memengaruhi kecermatan persepsi (ibu cepat tahu anaknya bermasalah dari wajah, suara, gerak; ibu lebih berpengalaman daripada bapak).</li>
<li><b>Belajar</b>: lewat <b>asosiasi, peneguhan, pengujian hipotesis</b> (anak memakai konsep orang tuanya; dewasa menebak lalu meneguhkan, contoh dosen berpakaian aneh).</li>
<li><b>Bahasa</b>: membentuk konsep dan makna (“gadis 19 tahun” vs “perempuan 19 tahun”).</li></ul>
<p>Konsep yang terbentuk melahirkan <b>label</b> (<i>labeling</i>) menurut kriteria: <b>kemiripan/kesamaan</b> (label lama dipakai pada orang yang mirip, misal sombong dan egois), <b>motivasi</b> (nilai jelek → dosen tidak adil; tim favorit kalah → lawan curang), <b>konteks</b> (senyum karena lucu vs senyum ramah ke orang baru).</p>
<h3>2. Pengorganisasian kesan</h3>
${T(`<tr><th>Strategi</th><th>Isi</th></tr>
<tr><td>Centrality</td><td>Solomon Asch: sifat “hangat-dingin” menjadi pusat pembentukan kesan; “cerdas” yang hangat beda dari “cerdas” yang dingin. Karakter dibedakan dalam dua dimensi: nilai (baik/buruk) dan orientasi (sosial/intelektual). Karakter sentral memberi konteks tambahan.</td></tr>
<tr><td>Primacy vs recency</td><td><b>Primacy effect</b>: nilai lebih pada informasi pertama, kesan pertama menentukan. <b>Recency effect</b>: informasi terakhir berpengaruh tertunda (menahan penilaian dosen “keras” sampai bertemu langsung).</td></tr>
<tr><td>Salience</td><td>Hal paling terlihat atau menonjol dalam konteks. Kondisi: <b>kejelasan (<i>brightness</i>), keras suara (<i>noisiness</i>), gerakan (<i>motion</i>), kebaruan (<i>novelty</i>)</b>. Yang berbeda dalam konteks sosial lebih dikenal.</td></tr>`)}
<h3>3. Pengolahan informasi sosial</h3>
<p>Dari kesan menuju tindakan, ada dua proses: <b>impression integration</b> dan <b>social judgment</b>.</p>
${T(`<tr><th>Proses</th><th>Unsur</th><th>Isi</th></tr>
<tr><td rowspan="4">Impression integration</td><td>Evaluasi</td><td>Keputusan terpenting: menyukai atau tidak</td></tr>
<tr><td>Averaging</td><td>Kesan berlawanan menyatu lewat pukul rata: tiap kualitas dinilai dan diberi <b>bobot</b>, lalu dirata-rata</td></tr>
<tr><td>Consistency</td><td>Satu kesan menentukan kesan lain; <b>halo effect</b> contohnya</td></tr>
<tr><td>Positivity</td><td>Kecenderungan melihat orang lain secara positif (perpanjangan keinginan akan pengalaman baik)</td></tr>
<tr><td rowspan="2">Social judgment</td><td>Personality</td><td>Tak ada ukuran jelas kepribadian. Model hubungan sosial: penilaian ditentukan oleh <b>Anda, orang yang dinilai, dan hubungan keduanya</b>, jadi tak ada penilaian objektif.</td></tr>
<tr><td>Deception</td><td>Pengamat yang baik bisa membedakan informasi benar dan bohong; tanda lebih terlihat pada <b>gerakan tubuh daripada wajah</b>, dan pada suara</td></tr>`)}
${I('Organisasi kesan: <b>C-P-S</b> (Centrality, Primacy/recency, Salience). Integrasi: <b>E-A-C-P</b> (Evaluasi, Averaging, Consistency, Positivity). Halo effect = consistency.')}
</div>
<div class="sec"><h2>📗 KB 2: Atribusi</h2>
<h3>A. Pengertian atribusi</h3>
<p><b>Atribusi = proses menyimpulkan motif, maksud, dan karakteristik orang lain dengan melihat perilakunya yang tampak</b> (Baron dan Byrne, 1979). Contoh: hampir diserempet motor saat belanja, lalu bertanya mengapa pengendaranya begitu. Menurut Myers (1996), kita beratribusi karena kecenderungan menjelaskan segala sesuatu (<b>sifat ilmuwan</b> pada manusia). Pertanyaan: kapan perilaku mencerminkan <b>disposisi</b> (kepribadian, sikap, suasana hati) dan kapan <b>situasional</b>?</p>
<p><b>Dua prinsip</b> mengetahui seseorang berbuat sesuai isi hatinya: (1) pastikan <b>tidak ada faktor eksternal</b> yang memaksa/mengancam (baru lalu cari atribusi internal); (2) <b>harapan atau dugaan</b> dari informasi yang sudah dimiliki (teman pendukung persamaan hak perempuan mengangguk pada orang tuanya yang konservatif: atribusi baru “mau berkompromi”). <b>Kulik (1983)</b>: atribusi sesuai skema di pikiran. Perilaku sesuai dan konsisten dengan skema → <i>dispositionally caused</i>; berbeda → <i>situationally caused</i>.</p>
<h3>B. Naive psychology (Fritz Heider)</h3>
<p>Heider (tokoh psikologi atribusi): dasar menjelaskan perilaku adalah <b>akal sehat (<i>commonsense</i>)</b>, tanpa analisis psikologi mendalam: <b>naive psychology</b>. Dua golongan penyebab:</p>
${T(`<tr><th>Atribusi</th><th>Asal</th><th>Contoh</th></tr>
<tr><td>Internal</td><td>Dari orang itu</td><td>Suasana hati, kepribadian, kemampuan, kesehatan, keinginan (IP jelek karena malas atau bodoh)</td></tr>
<tr><td>Eksternal</td><td>Lingkungan/luar diri</td><td>Tekanan luar, ancaman, cuaca, kondisi ekonomi, pengaruh lingkungan (masalah di rumah, dosen kurang menarik)</td></tr>`)}
<p>Keduanya bisa sekaligus, tetapi menurut Heider orang cenderung <b>memilih salah satu</b> (ibu: nilai bagus “anak mama pandai”, nilai jelek “pelajarannya terlalu berat”). Dimensi tambahan penyebab:</p>
${T(`<tr><th>Dimensi</th><th>Isi dan contoh</th></tr>
<tr><td>Stabil vs tidak stabil</td><td>Intelegensi = internal stabil; suasana hati = internal tidak stabil. Teman pemarah = internal tetap; teman periang yang tiba-tiba marah = eksternal tidak stabil.</td></tr>
<tr><td>Dapat dikendalikan vs tidak</td><td>Upaya belajar = internal tidak stabil tapi <b>dapat dikendalikan</b>; bakat = internal stabil tapi <b>tidak dapat dikendalikan</b></td></tr>
<tr><td>Spesifik vs umum (global)</td><td>Kurang tidur = efek spesifik; tidak memahami soal ujian = efek global</td></tr>`)}
<h3>C. Teori-teori atribusi</h3>
<h3>1. Correspondent Inference Theory (Edward E. Jones dan Keith Davis, 1965)</h3>
<p>Berfokus pada <b>orang yang dipersepsikan</b>. Kita mengacu pada tujuan atau keinginan yang <b>sesuai</b> dengan sikap atau perilakunya, terutama dengan informasi terbatas (orang kurang dikenal). Perilaku orang adalah sumber informasi yang kaya. Atribusi dilihat <b>stabil dan disposisi internal</b>. Contoh: pemuda sering SMS gadis = perhatian istimewa; wajah murung = sedih; pria marah dan wanita menangis = pria itu memang emosional dan pemarah.</p>
<h3>2. Causal Analysis Theory (Harold H. Kelley)</h3>
<p>Lebih terkenal; dasarnya <b>commonsense</b>, berfokus atribusi internal dan eksternal. Pengamat bertindak seperti <b>ilmuwan yang naif</b>, mengumpulkan informasi dan menganalisis pola. Suatu perilaku bisa menimbulkan perilaku lain sebagai sebab-akibat. <b>Lima pemicu mencari penyebab</b>:</p>
${T(`<tr><th>Pemicu</th><th>Isi</th></tr>
<tr><td>a. Kejadian tak terduga</td><td>Liburan keluarga mendadak batal, kita tanya “mengapa?”</td></tr>
<tr><td>b. Kejadian negatif</td><td>Terkait <b>motivasi hedonik</b> (menghindari rasa sakit, menciptakan kepastian), agar bisa mencegah terulang</td></tr>
<tr><td>c. Kejadian ekstrem</td><td>Bencana, kecelakaan, penyakit berbahaya, korban kejahatan, perpecahan keluarga; pencarian sebab bagian dari penyembuhan</td></tr>
<tr><td>d. Sikap ketergantungan</td><td>Lebih mencari alasan tindakan orang berpengaruh dalam hidup kita (anak pada orang tua, pelajar pada guru)</td></tr>
<tr><td>e. Mempertahankan skemata</td><td>Informasi baru yang mengganggu skema, kita sesuaikan dengan skema lama dan cenderung tak mengubahnya (si B jujur, lalu temanmu bilang ia buruk)</td></tr>`)}
<p><b>Tiga hal</b> untuk menetapkan atribusi internal atau eksternal:</p>
${T(`<tr><th>Kriteria</th><th>Pertanyaan</th><th>Tinggi bila</th></tr>
<tr><td>Konsensus</td><td>Apakah semua orang cenderung melakukannya di situasi sama?</td><td>Makin banyak yang melakukan</td></tr>
<tr><td>Konsistensi</td><td>Apakah pelaku melakukannya di masa lalu dalam situasi sama?</td><td>Ya</td></tr>
<tr><td>Distingsi (kekhasan)</td><td>Apakah pelaku melakukannya di masa lalu dalam <b>situasi berbeda-beda</b>?</td><td>Ya (modul menulis: kalau ya, distingsi tinggi)</td></tr>`)}
<p>Menurut Kelley, bila ketiganya tinggi, atribusi <b>eksternal</b>. Contoh: ibu marah ke pedagang sayur, ibu-ibu lain juga (konsensus tinggi), ibu pernah bertengkar dengannya (konsistensi tinggi), tak pernah dengan pedagang lain (kekhasan tinggi) → ibu marah karena ulah pedagang (eksternal), bukan watak ibu.</p>
${I('Jones-Davis = <b>J</b>ejak perilaku → sifat (<b>c</b>orrespondent). Kelley = <b>K</b>ausal, tiga kriteria <b>K-K-D</b>: Konsensus, Konsistensi, Distingsi. Kelley = “ilmuwan naif”.')}
<h3>D. Bias dalam atribusi</h3>
<h3>1. Bias kognitif</h3>
<p>Teori atribusi mengandaikan manusia rasional, padahal manusia jarang memakai logika. Aspek:</p>
<ul><li><b>Salience</b>: hal menonjol dianggap penyebab dominan (baju merah di antara baju hitam; orang berlari saat ada teriak “copet!” dianggap pencopet).</li>
<li><b>Memberi atribusi lebih pada disposisi</b> (<i>overattributing to dispositions</i>): perilaku dijelaskan lewat disposisi, situasi diabaikan (petugas ketus dianggap dingin, padahal lelah). Ini <b>kesalahan atribusi yang mendasar (<i>fundamental attribution error</i>)</b>.</li>
<li><b>Pelaku vs pengamat (<i>actors vs observers</i>)</b>: kesalahan mendasar biasanya pada <b>pengamat</b>; pelaku menekankan faktor eksternal. Anak (pengamat) menilai orang tua kejam dan otoriter (disposisi), orang tua (pelaku) menjelaskan situasional (menjalankan peran). Saat anak melanggar, peran terbalik: orang tua menganggap anak memberontak; anak menyebut pesta menyenangkan dan aturan terlalu ketat.</li></ul>
<h3>2. Bias motivasi</h3>
<p>Muncul dari usaha memenuhi kepentingan dan motivasi (kasih sayang, percaya diri, harga diri, gengsi, materi). Bias utama: <b>self-serving bias</b>, menekankan ego: sukses karena internal (kemampuan, kerja keras), gagal karena eksternal (tidak beruntung, soal sulit, cuaca).</p>
<h3>E. Atribusi tentang diri (self)</h3>
<p>Kita juga mencari sebab-akibat tindakan sendiri. Bila faktor eksternal jelas mendorong, atribusi eksternal/situasional; bila tidak ada, atribusi disposisi (internal). Memberi pemahaman tentang sikap, motivasi, emosi:</p>
${T(`<tr><th>Hal</th><th>Isi</th></tr>
<tr><td>Sikap</td><td>Orang mengira memikirkan sikap lewat introspeksi, padahal informasi tentang kondisi internal minim dan ambigu. Maka kita menilai sikap dengan <b>mengamati perilaku sendiri</b>. Tanpa tekanan eksternal kuat → atribusi internal; ada tekanan kuat → eksternal (ditunjuk jadi ketua vs tidak ditunjuk tapi tetap bekerja keras).</td></tr>
<tr><td>Motivasi</td><td>Imbalan <b>tinggi</b> → atribusi eksternal (“saya dibayar tinggi”). Imbalan <b>rendah</b> → atribusi internal (“saya memang menikmatinya”). Imbalan minim memperbesar kepentingan intrinsik.</td></tr>
<tr><td>Emosi</td><td><b>Stanley Schachter (1962)</b>: persepsi emosi tergantung (1) derajat rangsangan psikologis dan (2) <b>label kognitif</b> (“marah”, “senang”) yang dipilih setelah memperhatikan perilaku dan situasi. Menekankan ambiguitas keadaan internal.</td></tr>`)}
${I('Atribusi diri = <b>S-M-E</b> (Sikap, Motivasi, Emosi). Bayaran tinggi = eksternal, bayaran rendah = internal. Schachter = rangsangan + label.')}
</div>
<div class="sec"><h2>🔥 Sering keluar di ujian</h2><ul>
<li>Persepsi orang: stimuli lewat <b>pihak ketiga</b> (lambang verbal/grafis). Inferensi sosial = Weber, berkaitan dengan persepsi tentang <b>orang</b>.</li>
<li>Empat sumber inferensi: informasi sosial (trait, nama, stereotype), penampilan (daya tarik fisik, stigma), nonverbal (wajah, mata, gesture, suara), tindakan.</li>
<li>Harari dan McDavid (1973): nama menarik → nilai karangan <b>tinggi</b>. Jangan tertukar dengan Hariri/“nama jelek tinggi”.</li>
<li>Psikologi kognitif: pengalaman baru masuk “laci” kategori berdasarkan <b>kesamaan dengan masa lalu</b>.</li>
<li>Halo effect = consistency / satu sifat memengaruhi tafsir sifat lain. Physical attractiveness stereotype. Stigma = label sosial buruk.</li>
<li>Nonverbal: wajah paling penting untuk perasaan (versi uraian); gesture lebih dipercaya bila bertentangan dengan ucapan; suara = paralanguage.</li>
<li>Primacy (kesan pertama), recency (terakhir), centrality (hangat-dingin, Asch), salience (menonjol: brightness, noisiness, motion, novelty).</li>
<li>Impression integration vs social judgment; <b>personality</b> dan <b>deception</b> adalah dua penerapan social judgment. Catatan: rangkuman modul menulis “impression management”, uraian menulis “impression integration”.</li>
<li>Atribusi = menyimpulkan motif, maksud, karakteristik dari perilaku tampak (Baron &amp; Byrne). Kulik = atribusi sesuai skema. Heider = naive psychology, commonsense.</li>
<li>Internal vs eksternal; stabil/tidak stabil; dapat dikendalikan/tidak; spesifik/global. Bakat = stabil dan tak terkendali.</li>
<li>Jones dan Davis = correspondent inference (disposisi stabil). Kelley = causal analysis (konsensus, konsistensi, distingsi; lima pemicu).</li>
<li>Bias kognitif: salience, overattributing to dispositions (fundamental attribution error), actors vs observers. Bias motivasi: self-serving bias.</li>
<li>Atribusi diri: sikap lewat mengamati perilaku; imbalan tinggi = eksternal; Schachter 1962.</li></ul></div>
<div class="sec"><h2>📘 Glosarium singkat</h2>${T(`<tr><th>Istilah</th><th>Arti</th></tr>
<tr><td>Atribusi</td><td>Proses menyimpulkan motif, maksud, karakteristik orang lain dari perilaku tampak</td></tr>
<tr><td>Halo effect</td><td>Menilai karakteristik seseorang dari informasi (orang lain) yang memengaruhi tanggapan, persepsi, atau harapan kita tentang orang itu</td></tr>
<tr><td>Inferensi sosial</td><td>Mempelajari seseorang berdasarkan data sosial yang diperoleh dari orang lain</td></tr>

<tr><td>Salience</td><td>Segala hal yang menonjol</td></tr>
<tr><td>Stereotype</td><td>Menggeneralisasikan sifat sekelompok orang yang belum tentu 100% benar</td></tr>
<tr><td>Stigma</td><td>Memberi label sosial</td></tr>`)}</div>

{n:6,e:'💬',t:'Sikap dan Perilaku',d:'Sikap, kaitannya dengan perilaku, dan perubahan sikap.',
mat:`
<div class="sec"><h2>📘 KB 1: Sikap</h2>
<p>Sikap mengarahkan perilaku, jadi memengaruhi pola hubungan interpersonal. Objek sikap bisa impersonal, tetapi yang terpenting adalah sikap terhadap orang lain.</p>
<h3>A. Pengertian sikap</h3>
${T(`<tr><th>Tokoh</th><th>Definisi (inti)</th></tr>
<tr><td>Myers (1996)</td><td>Reaksi evaluatif yang menyukai atau tidak menyukai terhadap sesuatu/seseorang, tampak dalam keyakinan, perasaan, atau perilaku yang dimaksudkan</td></tr>
<tr><td>Ajzen (1988)</td><td>Disposisi merespons secara menyukai atau tidak menyukai suatu objek, orang, institusi, atau peristiwa</td></tr>
<tr><td>Eagly &amp; Chaiken (1992)</td><td>Kecenderungan psikologis yang diekspresikan dengan mengevaluasi entitas tertentu dengan derajat suka atau tidak suka</td></tr>
<tr><td>Sukadji (1986)</td><td>Posisi yang diambil dan dihayati seseorang terhadap benda, masalah, atau lembaga. Ada yang abstrak (demokrasi), impersonal (ganja itu jelek), tetapi yang terpenting sikap terhadap orang lain</td></tr>
<tr><td>Weber</td><td>Reaksi evaluatif (suka-tidak suka) terhadap orang, peristiwa, atau aspek lingkungan. <b>Posisi tidak netral</b>: selalu positif atau negatif, <b>tidak pernah netral</b>, dengan intensitas rendah, sedang, atau banyak (gula dalam teh)</td></tr>`)}
<p><b>Ciri khas sikap (Sarwono, 1997):</b> (1) punya <b>objek tertentu</b> (orang, perilaku, konsep, situasi, benda); (2) mengandung <b>penilaian</b> (setuju-tidak setuju, suka-tidak suka). Sikap terbentuk dari kesimpulan pengalaman masa lalu untuk mempermudah pilihan perilaku. Menurut sebagian besar pakar, sikap <b>dipelajari (bukan bawaan)</b>, maka dapat dibentuk, dikembangkan, dipengaruhi, diubah. Ada pakar yang menyatakan bisa bawaan (bayi tak suka sayur).</p>
${T(`<tr><th>Sikap (attitude)</th><th>Sifat (trait) (Ajzen)</th></tr>
<tr><td>Laten</td><td>Laten (tak tampak dari luar)</td></tr>
<tr><td>Mengarahkan perilaku</td><td>Mengarahkan perilaku</td></tr>
<tr><td>Ada unsur penilaian terhadap objek</td><td>Tidak selalu menilai; konsisten di berbagai situasi</td></tr>
<tr><td>Lebih bisa berubah/menyesuaikan</td><td>Menolak perubahan</td></tr>`)}
<h3>B. Model-model yang menjelaskan sikap</h3>
<ul><li><b>Model satu dimensi</b>: paling sederhana, suka atau tidak suka terhadap objek, jelas positif atau negatif (menghindari film kekerasan).</li>
<li><b>Model tiga komponen</b>: lebih luas, tiga dimensi: <b>kognitif</b> (kepercayaan), <b>afektif</b> (emosi), <b>perilaku</b> (pilihan dan tindakan). Contoh rokok: tahu asap berbahaya → tidak nyaman → menghindar. Komponen perilaku penting karena sikap memperkirakan perilaku masa depan.</li></ul>
<h3>C. Aspek-aspek sikap</h3>
<p>Tiga domain: kognitif, afektif, konatif. Myers: <b>“ABC”</b> = <b>A</b>ffective (perasaan), <b>B</b>ehavior (perilaku), <b>C</b>ognitive (kesadaran). Ketiganya terkait erat, sehingga sikap dapat meramalkan perilaku, tetapi tidak selalu (anak benci sekolah tetap bersekolah karena dipaksa atau diancam; suka durian tapi tak makan karena mahal).</p>
<h3>D. Pengukuran sikap</h3>
${T(`<tr><th>Skala</th><th>Tokoh</th><th>Cara</th></tr>
<tr><td>Thurstone</td><td>L.L. Thurstone (1887–1955); pendekatan statistik pertama</td><td>Pernyataan diurutkan numerik dari positif ke negatif (mis. 1 = amat positif, 10 = amat negatif). Responden menandai yang disetujui, poin <b>dirata-rata</b> (contoh skor 2,5 cenderung positif; 8,6 sebaliknya)</td></tr>
<tr><td>Likert</td><td>Rensis Likert (1903–1981); lebih sering dipakai</td><td>Responden memilih angka dari setuju sampai tidak setuju (1–5); <b>jumlah</b> angka menunjukkan sikap dan intensitas</td></tr>
<tr><td>Semantic Differential</td><td>Osgood, Suci, Tannenbaum (1957)</td><td>Dasar: sikap diketahui dari <b>konotasi</b> (arti psikologis) kata yang melambangkan objek. Objek dinilai pada skala berlawanan (baik-buruk, bagus-jelek, jujur-tidak jujur, sehat-tidak sehat), lalu dijumlahkan/dirata-rata</td></tr>`)}
${I('Thurstone = <b>T</b>imbang (rata-rata). Likert = <b>L</b>ima angka (jumlah). Semantic = <b>S</b>epasang kata berlawanan.')}
<h3>E. Pembentukan sikap: tiga pendekatan</h3>
<h3>1. Pendekatan belajar: asosiasi, peneguhan, belajar sosial</h3>
<ul><li><b>Asosiasi</b> (menghubungkan pengalaman yang dekat waktu, ruang, atau keadaan): <b>classical conditioning</b> (respons sama pada stimulus baru yang diasosiasikan; les matematika membosankan, anak tak suka sayur karena pahit lalu tetap tak suka walau sudah diolah) dan <b>more exposure</b> (pengalaman berulang; Robert Zajonc: terpaan berulang menghasilkan perasaan positif, contoh iklan TV).</li>
<li><b>Peneguhan (<i>reinforcement</i>)</b>: konsekuensi pengalaman yang menghasilkan perilaku. Dua faktor: <b>pengaruh keluarga</b> (orang pertama yang meneguhkan; pujian, hadiah, pengakuan; nilai politik, agama, bahkan rasisme) dan <b>peer group</b> serta <b>reference group</b> (penerimaan sosial dan popularitas, bisa berbeda dari orang tua).</li>
<li><b>Belajar sosial (Bandura, 1977)</b>: <b>vicarious learning</b> (mengamati konsekuensi perilaku orang lain; anak 14 tahun melihat “gay” dikucilkan) dan <b>modeling</b> (meniru). Orang yang dikagumi = <b>aspirational reference group</b>.</li></ul>
<h3>2. Pendekatan konsistensi kognitif</h3>
<p>Sarwono (1991): kognisi yang tak sesuai dengan kognisi lain menimbulkan keadaan tak menyenangkan, mendorong bertingkah laku agar tercapai konsistensi (menteri makan di warung tenda). Nama berbeda: Heider = <b>ketidakseimbangan (<i>imbalance</i>)</b>, Newcomb = <b>asimetri</b>, Osgood &amp; Tannenbaum = <b>ketidakselarasan (<i>incongruence</i>)</b> (paling terbatas), Festinger = <b>disonansi</b>.</p>
${T(`<tr><th>Teori</th><th>Isi</th></tr>
<tr><td>Keseimbangan / P-O-X (Fritz Heider)</td><td>Teori pertama dan dasar teori lain. P = orang, O = orang lain, X = hal terkait O (bisa orang). Bila unit sama sifat di semua segi → seimbang. Contoh: P+O, P+X, O+X seimbang; P+O, P−X, O−X juga seimbang. <b>Bilangan ganjil hubungan negatif = tak seimbang</b> (tegang, mendorong mengubah kognisi).</td></tr>
<tr><td>A-B-X (Newcomb)</td><td>Sama dengan Heider, plus <b>komunikasi antarindividu</b> dan hubungan kelompok. <b>Tindak komunikatif</b> = A menyampaikan informasi ke B tentang X. <b>Orientasi</b> = kebiasaan mengaitkan diri dengan orang/objek: <b>atraksi</b> (terhadap orang) dan <b>sikap</b> (terhadap objek). Dua sistem: individual dan kelompok. Komponen: sikap A ke X, atraksi A ke B, sikap B ke X, atraksi B ke A. Sama = <b>simetris</b>; tidak = <b>asimetris</b> (tension, menuju simetri).</td></tr>
<tr><td>Disonansi kognitif (Leon Festinger)</td><td>Paling luas pemakaiannya; hubungan tak konsisten sikap-perilaku. <b>Disonansi</b> = pengalaman tak menyenangkan dari ketidakserasian elemen kognitif (lawannya <b>konsonan</b>), dikurangi dengan mengubah sikap atau perilaku (perempuan yang merasa terbuka tapi tak mau berteman dengan suku lain). Empat sumber: <b>inkonsistensi logis</b>, <b>nilai budaya</b> (makan dengan tangan di pesta Eropa vs warteg), <b>pendapat umum</b> (remaja suka keroncong), <b>pengalaman masa lalu</b> (berdiri di hujan tapi tak basah).</td></tr>`)}
${I('Dasar tiga teori: Heider <b>P-O-X</b>, Newcomb <b>A-B-X</b> (+komunikasi), Festinger <b>disonansi</b> (empat sumber: Logis, Budaya, Pendapat umum, Pengalaman = <b>L-B-P-P</b>).')}
<h3>3. Pendekatan motivasional (insentif; Weber)</h3>
<p>Individu menilai untung-rugi dalam merespons. Dua model: <b>evaluation models</b> dan <b>processing models</b>.</p>
<ul><li><b>Teori respons kognitif</b>: sikap dibentuk dari respons positif/negatif terhadap pernyataan atau keistimewaan objek (membandingkan dua mobil), berdasarkan perasaan subjektif walau alasan kurang masuk akal.</li>
<li><b>Expectancy-value</b>: seperti di atas, plus <b>probabilitas</b> hasil baik atau buruk di masa depan (mobil sporty yang tak menguntungkan tak dibeli).</li>
<li><b>Elaboration vs heuristic</b>: <b>elaborasi</b> (<i>elaboration-likelihood model</i>; model sentral atau proses sistematis) = berpikir cermat atas argumen dalam kondisi ideal, kalau tidak ideal terpengaruh faktor periferal (daya tarik sumber, perasaan saat itu). <b>Heuristic</b> = sikap terbentuk cepat dan mudah tanpa analisis untung rugi, mengandalkan petunjuk sederhana/periferal (saat terganggu, tak dilibatkan, tak diinformasikan). Ikut kegiatan karena pertimbangan sistematis → kesetiaan kuat; karena ajakan teman → longgar.</li></ul>
</div>
<div class="sec"><h2>📗 KB 2: Keterkaitan Sikap dan Perilaku</h2>
<p>Teori tradisional: sikap lebih dulu dan menjadi dasar perilaku. Penelitian terbaru: hubungan <b>tidak langsung, saling memengaruhi</b>.</p>
<h3>A. Kesesuaian antara sikap dan perilaku</h3>
<p>Sikap yang diekspresikan tidak selalu memperkirakan perilaku. <b>Triandis (1982)</b>: ketidaksesuaian karena ada <b>40 faktor</b> lain (selain sikap) yang terpisah-pisah memengaruhi perilaku.</p>
${T(`<tr><th>Studi</th><th>Temuan</th></tr>
<tr><td>Richard LaPiere (1930-an)</td><td>Bepergian di AS dengan pasangan Cina; dilayani di <b>251</b> hotel, restoran, tempat umum, hanya sekali ditolak. Enam bulan kemudian surat bertanya “Mau menerima tamu ras Cina?” dari <b>128</b> yang membalas, <b>90%</b> menjawab “Tidak”.</td></tr>
<tr><td>Dudycha (1936)</td><td>Sikap positif terhadap ketepatan waktu; korelasi <b>sedang</b> hanya antara kegiatan di <b>ruang kemahasiswaan dan rekreasi</b>, sisanya sangat rendah</td></tr>
<tr><td>Minard (1952)</td><td>Tambang batubara: hubungan antarras baik, tetapi di pemukiman <b>60%</b> kulit putih tetap segregasi</td></tr>
<tr><td>Hartshorne &amp; May (1928)</td><td>Curang di satu situasi (menyontek) belum tentu berkorelasi dengan curang di situasi lain</td></tr>
<tr><td>Fishbein &amp; Ajzen (1974)</td><td>Sikap tidak bisa dilihat dari satu perilaku, tetapi dari <b>rata-rata timbulnya perilaku</b> pada peristiwa sejenis dalam kurun waktu tertentu</td></tr>`)}
<p>Sehari-hari pun sikap tak selalu diekspresikan (suka cokelat tapi tak memesan bila teman tak suka; menyembunyikan suka film demi hubungan baik). Meski dikritik, meramalkan perilaku lewat sikap tetap penting karena lebih efisien daripada observasi langsung.</p>
<h3>B. Kapan sikap bisa sesuai dengan perilaku</h3>
<p>Tergantung <b>cara sikap dibentuk, diukur, dan dialami</b>.</p>
${T(`<tr><th>Faktor</th><th>Isi</th></tr>
<tr><td>1. Perilaku spesifik</td><td>Makin spesifik sikap terhadap perilaku, makin baik memperkirakan (menanyakan hadir gotong royong Minggu besok, bukan “lingkungan harus bersih”). Sikap terhadap kontrasepsi (bukan KB) meramalkan pemakaian kontrasepsi (Morrison, 1989); sikap terhadap daur ulang (bukan kebersihan) meramalkan daur ulang (Oskamp, 1991).</td></tr>
<tr><td>2. Potensi sikap</td><td>Makin kuat sikap, makin besar pengaruh. Sikap dari <b>pengalaman pribadi</b> lebih kuat daripada informasi tak langsung. Lebih kuat pada yang <b>berkepentingan</b> (remaja 17 tahun vs usia 25 soal batas usia SIM).</td></tr>
<tr><td>3. Penonjolan sikap (<i>attitude salience</i>)</td><td>Sikap menonjol bila lebih disadari, mudah diingat dan direspons. Dibuat menonjol dengan <b>priming</b> (tanda/pengingat) dan <b>self-awareness</b> (slogan “Orang Tidak Beriman Membuang Sampah Sembarangan”).</td></tr>`)}
<h3>C. Perilaku dapat memengaruhi sikap</h3>
<p>Perilaku adalah pengalaman paling langsung, maka membentuk sikap secara efektif (Sarwono).</p>
<ul><li><b>Zimbardo (1971)</b>: model penjara; mahasiswa sukarelawan dibagi acak jadi narapidana dan penjaga. Penjaga bersikap keras dan kejam (bahkan yang paling lembut), narapidana memberontak atau acuh. <b>Role playing</b> menciptakan sikap yang berhubungan dengan peran (berpura-pura jadi korban kanker paru-paru lebih berhasil berhenti merokok).</li>
<li><b>Atribusi diri (<i>self-attribution</i>)</b>: tersenyum tanpa alasan bisa memperbaiki suasana hati.</li></ul>
${T(`<tr><th>Metode</th><th>Isi</th></tr>
<tr><td>Foot-in-the-door effect</td><td>Orang lebih mau menerima permintaan besar bila sebelumnya setuju permintaan kecil terkait (Rp1.000 lalu Rp5.000). Kesepakatan pertama membentuk sikap yang lebih bisa diterima. Analogi: sebelah kaki sudah di ambang pintu, tinggal dipersilakan masuk.</td></tr>
<tr><td>Low-ball technique</td><td>Turunan foot-in-the-door; strategi penjual (dealer mobil): tawaran harga rendah, di detik terakhir harga naik dengan alasan direksi/kebijakan. Cialdini (1978): pembeli yang “kepalang basah” tetap membeli.</td></tr>`)}
<p><b>Mengapa perilaku memengaruhi sikap (Myers, via Sarwono, 1997): tiga pendekatan.</b></p>
${T(`<tr><th>Teori</th><th>Isi</th></tr>
<tr><td>Pernyataan diri (<i>self presentation</i>)</td><td>Orang lebih ingin menyenangkan orang lain demi menjaga <b>self image</b> daripada apa adanya; menjaga kesesuaian self image dan perilaku. Studi Kolopaking (1992): siswa SMA Islam lebih banyak tak setuju film seks TV daripada siswa SMA Negeri. Supit (1978): responden pergi ke gereja bukan karena sikap religius. <b>Self-monitoring</b> tinggi = seperti bunglon; rendah = acuh, apa adanya.</td></tr>
<tr><td>Disonansi kognitif (Festinger)</td><td>Dua elemen bertentangan → tegang; dihilangkan dengan menyesuaikan salah satu elemen (“Saya bukan satu-satunya yang terlambat”). Perilaku lebih mudah diubah <b>alasannya</b> (menjaga keponakan: “Saya menikmatinya”). Hasilnya sikap baru.</td></tr>
<tr><td>Persepsi diri (Bem, 1972)</td><td>Bila tak bisa dijelaskan atribusi eksternal, kita menjelaskan lewat mengamati perilaku sendiri (sering terlambat ditegur → percaya diri pemalas). Kita sering <b>bertindak dulu, berpikir kemudian</b>.</td></tr>`)}
</div>
<div class="sec"><h2>📙 KB 3: Perubahan Sikap</h2>
<p>Sikap berkembang dan dapat berubah karena pengalaman baru dari orang lain atau media. <b>Carl Hovland</b> (Universitas Yale, setelah PD II): perubahan sikap adalah hasil <b>komunikasi persuasif</b>. Persuasi = bentuk pengaruh sosial yang bertujuan mengubah keyakinan, perasaan, dan perilaku. Efektivitas ditentukan <b>kualitas sumber/komunikator, isi dan penyajian pesan, serta motif dan kemampuan audience</b>.</p>
<h3>A. Komunikasi persuasif</h3>
<h3>1. Sumber</h3>
${T(`<tr><th>Variabel</th><th>Isi</th></tr>
<tr><td><b>Kredibilitas</b>: keahlian</td><td>Ahli lebih persuasif; keahlian bidang tertentu berpengaruh di bidang terkait (pembalap soal mobil). Bicara <b>cepat</b> lebih mengubah sikap (kesan berpengetahuan); lambat = ketidakpastian.</td></tr>
<tr><td><b>Kredibilitas</b>: dapat dipercaya</td><td>Dilihat jujur dan tulus; tanpa keahlian pun bisa kredibel (aktris yang dipercaya)</td></tr>
<tr><td><b>Daya tarik</b></td><td>Makin disukai, makin membujuk. Yang tak disukai bisa menimbulkan <b>efek bumerang</b> (sikap berlawanan). Tiga macam: <b>(1) penampilan fisik</b>; <b>(2) power</b>: <i>reward power</i> (memberi imbalan) atau <i>coercive power</i> (memaksa); dosen lebih membujuk daripada teman sekelas; <b>(3) kesamaan dengan penerima</b> (ras, agama, pendidikan; “Saya sama dengan Anda”).</td></tr>`)}
<h3>2. Pesan: posisi, isi pesan, saluran</h3>
<p><b>a. Posisi.</b> Makin dekat pesan dengan posisi seseorang, makin mudah diterima. <b><i>Latitude of acceptance</i></b> (ruang penerimaan, sikap relevan), <b><i>latitude of noncommitment</i></b> (tanpa komitmen, tak relevan), <b><i>latitude of rejection</i></b> (penolakan). Pesan efektif bila dalam latitude of acceptance. <b>Kredibilitas dan perbedaan (<i>discrepancy</i>)</b>: pesan jauh beda dari audience sebaiknya dibawa komunikator <b>sangat kredibel</b>; komunikator atraktif tapi kurang kredibel sebaiknya membawa pesan dekat dengan sudut pandang audience.</p>
<p><b>b. Isi pesan.</b></p>
${T(`<tr><th>Unsur</th><th>Isi</th></tr>
<tr><td>Kesederhanaan</td><td>Mudah dicerna, diingat, ditindaklanjuti; tapi terbatas (slogan “Katakan Tidak pada Narkoba” tak efektif untuk pengguna lama)</td></tr>
<tr><td>Daya tarik emosional</td><td>Rasa takut paling sering dipakai. <b>Janis dan Feshbach (1953)</b> (menyikat gigi): kelompok 1 foto menakutkan, kelompok 2 kurang dramatis, kelompok 3 tanpa foto. K1 paling terkesan, tetapi seminggu kemudian K3 lebih berubah perilakunya; efek maksimum lewat argumen persuasif tanpa gambar menakutkan. Ketakutan berlebih membuat orang mengabaikan/menolak.</td></tr>
<tr><td>Kepentingan pribadi</td><td>Pesan yang <b>berlawanan dengan kepentingan komunikator</b> lebih persuasif (pemilih yang menyesal memilih presiden X)</td></tr>`)}
<p><b>Penyajian pesan:</b></p>
<ul><li><b>Primacy dan recency</b>: komunikator pertama lebih berpengaruh (primacy); pesan terakhir melekat bila penerima yakin kesan pertama keliru atau ada jeda lama (recency).</li>
<li><b>Sleeper effect</b>: sebagian pesan lebih berpengaruh seminggu atau sebulan kemudian. Kita lupa <b>sumber</b> (<i>discounting cues</i>, petunjuk yang terabaikan) dan hanya ingat pendapatnya. Penjelasan: <b>disosiasi</b> (asosiasi kesimpulan persuasif dengan discounting cues melemah) dan pesan serta sumber hilang pada tingkat berbeda. “Apa” lebih lambat terlupa dibanding “di mana” dan “dari siapa”.</li>
<li><b>Keseimbangan: satu sisi vs dua sisi</b>: penerima yang berpengetahuan atau bertentangan dengan sumber lebih terbujuk <b>dua sisi</b> (tukang kayu dan pengamanan hutan: sebut juga ekonomi daerah dan lapangan kerja).</li></ul>
<p><b>c. Saluran (<i>channel</i>)</b></p>
${T(`<tr><th>Saluran</th><th>Isi</th></tr>
<tr><td>Media massa</td><td>Unggul <b>daya jangkau luas</b>; lemah: pasif, searah, tak interaktif. Cetak: lebih mudah dipahami (rincian, dibaca berulang, membuat kritis). Elektronik: lebih mudah diterima bila singkat dan sederhana. Komunikator yang <b>disukai/atraktif</b> efektif di radio/TV; yang <b>tak disukai</b> atau penuh logika dan tampil biasa efektif di media cetak.</td></tr>
<tr><td>Kontak personal</td><td>Lebih meyakinkan (rekomendasi teman, pemasaran door-to-door; lebih mudah mematikan radio daripada mengusir orang di depan). <b>Direct-mail</b> (junk mail) gabungan jangkauan massa dan surat “pribadi”; lebih efektif dari media pasif, kurang dari tatap muka.</td></tr>
<tr><td>Two-step communication</td><td>Interaksi media massa dan kontak sosial: teman yang dipengaruhi iklan majalah lalu memengaruhi Anda (informasi tangan kedua). Menggabungkan jangkauan media dan pengaruh sosial/kelompok rujukan.</td></tr>`)}
<h3>3. Audience</h3>
<ul><li><b>Attention</b>: (1) <b>selective exposure</b> (memilih informasi yang sesuai sikap, menghindari yang lain); (2) <b>ego involvement</b> (makin terlibat, makin kurang menerima posisi lain): <b>issue involvement</b> (kenaikan biaya kuliah di daerah sendiri) dan <b>komitmen terhadap sikap</b> (janji sulit ditarik; bisa berupa perilaku, atau <b>public contract</b> seperti mengumumkan berhenti merokok). Komitmen efektif bila pilihan bebas tanpa paksaan.</li>
<li><b>Karakteristik personal</b>: <b>umur</b> (<i>impressionable-years hypothesis</i>: anak dan remaja 18–25 tahun sikap kurang stabil; tak ada bukti usia membuat sikap kaku; beda kelompok umur karena <b>generational explanation</b>, selera musik kakek mengikuti generasinya); <b>kebutuhan</b> (pesan sesuai kebutuhan: iklan sampo “rambut rontok dan berketombe?”, mouthwash). Self-esteem rendah lebih mudah dipengaruhi. <b>High need for cognition</b> mencari lebih banyak informasi dan terpengaruh argumen kuat; <b>low need</b> berpikir singkat. Orang dalam <b>good mood</b> kurang kritis.</li></ul>
<h3>4. Efek situasional</h3>
${T(`<tr><th>Efek</th><th>Isi</th></tr>
<tr><td>Message density</td><td>Banyaknya pesan dalam waktu singkat; hanya ingat hal umum, lupa merek; kecaman kompetitor melemahkan; <i>brand loyalties</i> tak tumbuh dari pesan singkat dan pasif</td></tr>
<tr><td>Repetisi</td><td>Zajonc (1968): keakraban dari pengulangan meningkatkan kesukaan</td></tr>
<tr><td>Distraction</td><td>Pengalihan perhatian menghambat <b>counterargument</b> (test drive sambil sales bicara)</td></tr>`)}
<h3>B. Teori-teori perubahan sikap</h3>
${T(`<tr><th>Teori</th><th>Isi</th></tr>
<tr><td>Elaboration-likelihood model (Richard E. Petty dan John T. Cacioppo)</td><td>Perubahan sikap hasil memroses informasi; pesan efektif dengan cara berbeda. <b>Central processing</b> (sistemik): fokus pada argumen (logis? menguasai perhatian?). <b>Peripheral processing</b> (heuristik): bila tak bisa berkonsentrasi, terpengaruh hal di luar pesan (karakteristik komunikator, penyajian, suasana hati).</td></tr>
<tr><td>Self-justification theories</td><td>Kita perlu membenarkan tindakan dan mempertahankan konsistensi sikap-perilaku. Dua proses: <b>dissonance reduction</b> (tindakan tak bisa ditarik, jadi <b>sikap</b> yang diubah; lebih mudah berdasarkan self-esteem dan kepraktisan; menjelaskan mengapa pengalaman baru mengubah pendapat) dan <b>the power of commitment</b> (<i>behaviours lead to attitude</i>: sikap dari pengalaman pribadi lebih kuat; <i>inducements</i>: diskon memicu <i>behavioural commitment</i> lalu sikap menyukai merek baru).</td></tr>`)}
${I('Persuasi = <b>S-P-A</b>: Sumber (kredibilitas + daya tarik), Pesan (posisi, isi, saluran), Audience (attention, personal). Elaboration: <b>pusat = pikir</b>, <b>pinggir = rasa</b>. Self-justification = <b>D-C</b> (Dissonance reduction, Commitment).')}
</div>
<div class="sec"><h2>🔥 Sering keluar di ujian</h2><ul>
<li>Sikap = tidak pernah netral (Weber), karena sikap adalah <b>evaluasi</b>. Sikap terhadap hal abstrak: “setuju musyawarah dan mufakat”.</li>
<li>Model paling sederhana = satu dimensi; model tiga komponen = kognitif, afektif, perilaku. ABC = Affective, Behavior, Cognitive (Myers).</li>
<li>Skala Thurstone: rata-rata; “agak positif tapi tidak negatif” → 5 (menurut kunci). Likert = jumlah. Semantic differential = Osgood, Suci, Tannenbaum.</li>
<li>Asosiasi (classical conditioning, more exposure) beda dengan peneguhan dan belajar sosial. Contoh asosiasi: remaja suka lagu karena tarian pengiringnya.</li>
<li>Disonansi = Festinger (hubungan tak konsisten sikap-perilaku, paling luas). P-O-X = Heider. A-B-X = Newcomb. Respons kognitif dan expectancy-value = motivasional.</li>
<li>Pendekatan motivasional: individu menilai untung-rugi dalam merespons. Elaboration: dalam kondisi ideal, manusia lebih berpikir berdasar argumen.</li>
<li>Triandis = 40 faktor. LaPiere = 251 tempat, 128 balasan, 90% “Tidak”. Dudycha = ruang kemahasiswaan dan rekreasi. Fishbein dan Ajzen = rata-rata perilaku. Zimbardo = penjara, role playing.</li>
<li>Kesesuaian sikap-perilaku tergantung cara sikap dibentuk, diukur, dialami. Spesifik, potensi, penonjolan (priming dan self-awareness; slogan “orang bijak taat pajak”).</li>
<li>Perilaku memengaruhi sikap paling efektif lewat <b>pengalaman sendiri</b>. Foot-in-the-door = “sebelah kaki masuk ambang pintu”. Low-ball = “kepalang basah”.</li>
<li>Self presentation, disonansi, persepsi diri (Bem) adalah tiga pendekatan perilaku→sikap. Persepsi diri = mengamati <b>perilaku sendiri</b>.</li>
<li>Hovland (Yale) = persuasi. Kredibilitas = keahlian + dapat dipercaya; mantan pengguna narkoba sebagai pembicara = <b>dapat dipercaya</b> (menurut kunci). Daya tarik = fisik, power, kesamaan.</li>
<li>Isi pesan: kesederhanaan, daya tarik emosional, kepentingan pribadi. Slogan mudah diingat: “Bebek saja antre”. Media massa unggul <b>daya jangkau luas</b>.</li>
<li>Sleeper effect: lupa sumber (discounting cues). Primacy vs recency. Dua sisi untuk audience berpengetahuan/menentang.</li>
<li>Latitude of acceptance, noncommitment, rejection. Impressionable-years hypothesis; generational explanation. High need for cognition.</li>
<li>Pengalaman baru mengubah pendapat = self-justification, <b>dissonance reduction</b>. Power of commitment = kuatnya komitmen.</li></ul></div>
