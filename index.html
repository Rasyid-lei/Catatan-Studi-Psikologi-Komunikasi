<script>
const T=(h)=>`<div class="tw"><table>${h}</table></div>`;
const I=(h)=>`<div class="ing"><b>💡 Ingat:</b> ${h}</div>`;
const M=[
{n:1,e:'🧠',t:'Pengertian Psikologi dan Psikologi Komunikasi',d:'Apa itu psikologi, sejarahnya, psikologi sosial, dan kaitannya dengan komunikasi.',
mat:`
<div class="sec"><h2>📘 KB 1: Pengertian Psikologi</h2>
<h3>A. Apa itu psikologi?</h3>
<p>Psikologi adalah <b>studi ilmiah mengenai perilaku dan proses mental</b> (<i>psychology is the scientific study of behavior and mental process</i>), menurut Papalia &amp; Olds (1985) dan Weber (1992).</p>
<p>Coba lihat arti katanya. Kata “psikologi” berasal dari bahasa Latin: <b>psyche</b> berarti jiwa (<i>soul</i>) dan <b>logos</b> berarti kata atau wacana (<i>word or discourse</i>). Jadi definisi awalnya: psikologi adalah <b>wacana mengenai jiwa</b>. Belakangan, “jiwa” bergeser menjadi wacana mengenai pikiran (<i>mind</i>).</p>
<p><b>Perilaku (<i>behavior</i>)</b> diartikan luas sebagai tindakan yang dapat diamati, misalnya aktivitas fisik dan berbicara. Tetapi psikologi juga memperhatikan <b>proses mental</b> yang tidak bisa diamati langsung: memersepsi, berpikir, mengingat, dan merasa. Bayangkan seperti gunung es. Perilaku adalah puncak yang kelihatan, proses mental adalah bagian di bawah air.</p>
<h3>Jawaban “apa” dan “mengapa”</h3>
<p>Psikologi memberi gambaran tentang perilaku (jawaban <b>apa</b>) dan menjelaskan penyebab atau akibat perilaku itu (jawaban <b>mengapa</b>). Contohnya: apa yang Anda lakukan kalau acara TV kurang menarik? Mengapa Anda setia pada radio A, bukan B? Apa yang terjadi kalau dosen kurang menarik saat mengajar?</p>
<h3>Empat reaksi dasar manusia terhadap lingkungannya</h3>
${T(`<tr><th>Reaksi</th><th>Isinya</th><th>Contoh</th></tr>
<tr><td>Instrumental</td><td>Tindakan atau gerakan</td><td>Berjalan, makan, berbicara</td></tr>
<tr><td>Kognitif</td><td>Berpikir, membuat rencana, berimajinasi</td><td>Merencanakan liburan di kepala</td></tr>
<tr><td>Afektif</td><td>Perilaku emosional: positif (gembira), negatif (sedih), lembut, atau keras (sangat marah)</td><td>Tertawa, menangis, murka</td></tr>
<tr><td>Persepsi</td><td>Melibatkan satu atau lebih alat indra: penglihatan, penciuman, pendengaran, kepekaan terhadap rasa sakit</td><td>Mencium bau masakan</td></tr>`)}
${I('Empat reaksi dasar = <b>I-K-A-P</b>: <b>I</b>nstrumental, <b>K</b>ognitif, <b>A</b>fektif, <b>P</b>ersepsi. Hafalkan sebagai “Ikan Kakap Asam Pedas”.')}
<h3>Empat tujuan kajian psikologi (Papalia &amp; Olds, 1985)</h3>
${T(`<tr><th>Tujuan</th><th>Artinya</th><th>Contoh dari uraian</th></tr>
<tr><td>1. Deskripsi</td><td>Memberi informasi tentang <b>apa</b> yang sedang terjadi</td><td>Makin tinggi pendidikan seseorang, makin panjang usianya. Kita hanya tahu hubungan itu ada, belum tahu mengapa.</td></tr>
<tr><td>2. Eksplanasi</td><td>Tahap lanjutan: menjawab <b>mengapa</b> sesuatu terjadi</td><td>Orang berpendidikan tinggi hidup lebih baik dan lebih tahu apa yang dikerjakan saat sakit. Atau ada faktor ketiga, misalnya kekayaan, yang dipakai untuk pendidikan dan perawatan kesehatan.</td></tr>
<tr><td>3. Prediksi</td><td>Meramalkan peristiwa masa depan berdasarkan peristiwa sebelumnya</td><td>Tes IQ dipakai untuk memprediksi keberhasilan siswa di sekolah.</td></tr>
<tr><td>4. Modifikasi / kontrol</td><td>Mengubah atau mengontrol perilaku dengan memodifikasi lingkungan agar perilaku yang diantisipasi muncul</td><td>IQ siswa tinggi tetapi prestasi sangat rendah, maka dilakukan terapi tertentu untuk mengoptimalkan fungsi kecerdasannya.</td></tr>`)}
<p>Keempat tujuan ini <b>saling berkaitan</b>. Sebelum mengubah perilaku orang lain, kita perlu deskripsi yang akurat, eksplanasi beserta konsekuensinya, dan dasar untuk memprediksi hasil perubahan itu. Seperti dokter: periksa dulu, cari sebabnya, perkirakan hasil obat, baru obati.</p>
${I('Urutan tujuan = <b>D-E-P-M</b>: Deskripsi → Eksplanasi → Prediksi → Modifikasi. “Apa, mengapa, nanti bagaimana, lalu ubah.”')}
</div>
<div class="sec"><h2>Sejarah Singkat Psikologi</h2>
<h3>1. Dari Yunani dan Romawi Kuno sampai psikologi sebagai ilmu</h3>
<p>Sejarah psikologi bisa dilacak sejak masa kuno, ketika orang mulai bertanya tentang hakikat manusia. Filsuf Yunani dan Romawi membahas apa itu pikiran dan di mana letaknya.</p>
<ul><li><b>Aristoteles</b> memperkenalkan pikiran sebagai <i>tabula rasa</i> (keadaan kosong) yang tetap kosong sampai “ditulis” oleh pengalaman.</li>
<li><b>John Locke</b> (1632–1704), filsuf Inggris, mengadopsi istilah itu sembilan belas abad kemudian. Manusia dilahirkan seperti selembar kertas kosong, dan pengalamanlah yang mencoret-coretnya.</li>
<li><b>René Descartes</b> (1596–1650), filsuf Perancis, berpandangan sebaliknya: kita dilahirkan dengan gagasan dan kemampuan tertentu. Tubuh dan pikiran adalah dua bagian terpisah yang saling memengaruhi.</li></ul>
<p>Semua itu <b>belum psikologi yang sesungguhnya</b> karena didasarkan pada pendapat, bukan kajian ilmiah.</p>
<p>Istilah psikologi pertama kali disebut tahun <b>1530</b> oleh orang Jerman bernama <b>Philipp Melanchton</b>, sebagai judul ceramah akademis tentang jiwa. Ia ingin membedakannya dari <b>pneumatologi</b>, yaitu studi tentang jiwa manusia yang berkaitan dengan malaikat, roh jahat, dan Tuhan.</p>
<p>Tahun <b>1879</b> dianggap kelahiran psikologi sebagai ilmu, ditandai berdirinya laboratorium psikologi pertama di <b>Leipzig, Jerman</b>, oleh <b>Wilhelm Wundt</b> (1832–1920). Wundt orang pertama yang menyebut dirinya ahli psikologi dan menamai laboratoriumnya “laboratorium psikologi”, maka ia dijuluki <b>Bapak Psikologi</b>. Ia menerbitkan jurnal psikologi profesional (1881) dan buku <i>Principles of Physiological Psychology</i> (dua bagian, 1873 dan 1874).</p>
<h3>2. Perkembangan di Amerika</h3>
<p>Awalnya psikologi adalah “perkawinan” filsafat dengan ilmu faal (fisiologi). Minat menjelaskan perilaku, ditambah minat memakai metode ilmu pengetahuan alam, membuat psikologi memisahkan diri menjadi disiplin sendiri.</p>
${T(`<tr><th>Tahun</th><th>Peristiwa</th><th>Tokoh</th></tr>
<tr><td>1875</td><td>Kajian pertama psikologi eksperimental di Harvard University</td><td>William James</td></tr>
<tr><td>1878</td><td>Doktor psikologi pertama di Amerika Serikat</td><td>G. Stanley Hall</td></tr>
<tr><td>1883</td><td>Laboratorium psikologi pertama di AS (Johns Hopkins University)</td><td>G. Stanley Hall</td></tr>
<tr><td>1886</td><td>Buku teks psikologi pertama di AS: <i>Psychology</i></td><td>John Dewey</td></tr>
<tr><td>1887</td><td>Jurnal psikologi</td><td>G. Stanley Hall</td></tr>
<tr><td>1890</td><td><i>The Principles of Psychology</i> (ditulis 12 tahun). Psikologi didefinisikan “ilmu mengenai kehidupan mental”</td><td>William James</td></tr>
<tr><td>1900</td><td><i>The Interpretation of Dreams</i></td><td>Sigmund Freud</td></tr>
<tr><td>1920-an</td><td>Psikologi di bawah pengaruh Watson: objek studi bukan lagi jiwa dan mental, tetapi perilaku yang dapat diamati</td><td>John Watson</td></tr>`)}
<p>Lama-kelamaan banyak pengikut Watson sadar bahwa tidak semua perilaku yang perlu dijelaskan bisa diamati. Manusia punya pikiran dan memakai bahasa berisi konsep dan simbol yang tidak semuanya bisa diamati.</p>
${I('Dua “pertama” di Amerika: <b>Hall</b> = doktor pertama (1878) + lab pertama (1883). <b>Dewey</b> = buku teks pertama (1886). <b>James</b> = kajian eksperimental di Harvard (1875) + buku klasik (1890).')}
<h3>3. Sumbangan ilmu lain dan dorongan zaman</h3>
<ul><li><b>Kedokteran:</b> perilaku abnormal tidak lagi dianggap karena roh jahat, tetapi diklasifikasikan sebagai penyakit jiwa. Lahirlah pelayanan <b>psikiatri</b>, dan perawatan itu memengaruhi berkembangnya <b>psikologi klinis</b> (Sukadji, 1986).</li>
<li><b>Praktik nonilmiah atau pseudo-ilmiah:</b> studi muncul karena peneliti ingin menunjukkan bahwa pernyataan umum itu tidak benar. Namanya canggih: fisiognomi, frenologi, tipologi. Ahli <b>frenologi</b> membuat peta lokasi watak di tengkorak dan mengatakan watak terbaca dari benjolan kepala. Ahli <b>tipologi</b> menyatakan watak berhubungan dengan bentuk tubuh. Semua terbukti tidak akurat, misalnya tidak terbukti orang gemuk selalu periang.</li>
<li><b>Perang Dunia I:</b> AS butuh alat seleksi dan penempatan tenaga manusia, sehingga disusun berbagai tes psikologis dan tes menjadi lapangan penerapan psikologi yang terluas. Berkembang pula psikologi karier dan manajemen personalia, serta pelayanan untuk kasus psikologis akibat perang, terutama <i>shell shock</i> (penyimpangan perilaku karena “luka” psikologis terkena pecahan bom).</li>
<li><b>Perang Dunia II:</b> psikologi makin matang, terutama <b>psikologi sosial</b>. Kebutuhan menonjol: masalah kepemimpinan, propaganda, perang urat syaraf, dan pengumpulan <i>public opinion</i>.</li></ul>
${I('PD I → <b>T</b>es &amp; <b>T</b>rauma (shell shock). PD II → <b>S</b>osial (psikologi sosial). Frenologi = <b>f</b>ront kepala (benjolan), tipologi = <b>t</b>ubuh.')}
</div>
<div class="sec"><h2>C. Psikologi Sosial</h2>
<p>Psikologi sosial adalah <b>kajian ilmiah mengenai perilaku individu dalam konteks sosial</b> (Sears dkk, 1985). Isinya: bagaimana kita memahami orang lain dan situasi sosial, bagaimana kita merespons orang lain dan mereka merespons kita, serta bagaimana kita dipengaruhi situasi sosial.</p>
<ul><li><b>Weber (1992):</b> di antara bidang kajian psikologi, psikologi sosial paling banyak mengadopsi hal eksternal dan <b>lebih menekankan faktor situasional daripada faktor personal</b>. Untuk menjelaskan kognisi sosial dan perilaku individual, ia memakai analisis antarindividu (interpersonal) dan sangat dipengaruhi sosiologi.</li>
<li><b>E. A. Ross</b> menulis buku pertama psikologi sosial, <i>Social Psychology</i>: “ilmu yang berusaha memahami dan menguraikan keseragaman dalam perasaan, kepercayaan atau kemauan juga tindakan yang diakibatkan oleh interaksi sosial” (dicatat Rakhmat, 1992).</li>
<li><b>Kaufmann</b> (definisi mutakhir menurut Rakhmat): usaha memahami, menjelaskan, dan meramalkan bagaimana pikiran, perasaan, dan tindakan individu dipengaruhi oleh apa yang dianggapnya sebagai pikiran, perasaan, dan tindakan orang lain (yang kehadirannya boleh jadi sebenarnya, dibayangkan, atau disiratkan).</li></ul>
<p>Psikologi sosial dimulai dari studi <b>persepsi dan sikap</b>, lalu mencakup semua bentuk interaksi antarindividu: mengingatkan diri, afiliasi, <i>relationship</i>, agresi, konformitas, dan pengaruh.</p>
<h3>Bedanya dengan ilmu lain: tingkat analisis (Sears)</h3>
<p>Sosiologi, antropologi, sosial politik, dan bidang psikologi lain sama-sama tertarik pada perilaku sosial. Yang membedakan hanyalah <b>tingkat analisisnya</b>.</p>
${T(`<tr><th>Siapa</th><th>Tingkat analisis</th><th>Cara menjelaskan perilaku</th></tr>
<tr><td>Ilmuwan ilmu-ilmu sosial</td><td>Masyarakat (<i>societal</i>)</td><td>Faktor societal secara luas</td></tr>
<tr><td>Psikolog klinis / <i>personality psychology</i></td><td>Individu</td><td>Karakteristik individual yang unik</td></tr>
<tr><td>Psikolog sosial</td><td><b>Interpersonal</b> (tengah-tengah)</td><td>Perilaku dalam hubungan dengan situasi sosial atau hubungan antarmanusia</td></tr>`)}
${I('Tiga lantai: <b>atas</b> = masyarakat, <b>bawah</b> = individu, <b>tengah</b> = interpersonal (rumah psikologi sosial). Psikologi sosial = pintu masuk menuju psikologi komunikasi.')}
</div>
<div class="sec"><h2>📗 KB 2: Pengertian Psikologi Komunikasi</h2>
<h3>A. Awal studi komunikasi</h3>
<p>Jejak ilmu komunikasi bisa dilacak sejak Yunani Kuno, tetapi sebagai disiplin ilmu, komunikasi baru berdiri <b>sesudah Perang Dunia II</b>. Riset tahun <b>1930-an sampai 1950-an</b> banyak menyumbang. Riset itu sebenarnya kajian psikologi, politik, dan sosiologi yang kebetulan banyak menyinggung komunikasi. Jadi komunikasi itu seperti anak yang dibesarkan banyak “orang tua”, dan terutama dibesarkan para peneliti psikologi.</p>
<p>Wilbur Schramm (1981) menyebut empat <b>“Bapak Studi Komunikasi”</b>: Paul Lazarsfeld, Kurt Lewin, Harold Lasswell, dan Carl Hovland. Hanya <b>Lasswell yang bukan ahli psikologi</b>, ia ilmuwan politik. Jadi tiga dari empat adalah psikolog.</p>
${T(`<tr><th>Tokoh</th><th>Latar</th><th>Sumbangan</th></tr>
<tr><td>Kurt Lewin (1890–1947)</td><td>Ilmuwan Jerman, pindah ke AS awal 1930-an karena melarikan diri dari rezim Nazi Hitler. Psikolog eksperimental dari Universitas Berlin. Doktornya di bawah Kohler dan Wertheimer (tokoh psikologi Gestalt, yang menekankan kekuatan konteks atau makna keseluruhan).</td><td>Mengawinkan riset psikologi sosial dasar dan terapan. Ahli dinamika kelompok, <b>pionir komunikasi kelompok</b>.</td></tr>
<tr><td>Paul Lazarsfeld (1901–1976)</td><td>Psikolog imigran dari Vienna, banyak dipengaruhi Freud. Ahli matematika, di akhir hidup menyebut diri sosiolog.</td><td><b>Komunikasi massa</b>, khususnya efek media massa. Memimpin Biro Penelitian Sosial Terapan di Columbia University, “organisasi yang paling berpengaruh dalam riset komunikasi di dunia” (Schramm).</td></tr>
<tr><td>Carl Hovland (1912–1961)</td><td>Psikolog eksperimental, salah satu ilmuwan sosial Amerika terpenting dalam riset komunikasi tahun 1930–1940-an.</td><td>Tradisi penelitian tingkat mikro tentang <b>perubahan sikap individu</b>. Kajiannya <b>persuasi</b> (padanan perubahan sikap). Menyumbang pada <b>komunikasi interpersonal</b>.</td></tr>
<tr><td>Harold Lasswell</td><td>Ilmuwan politik (bukan psikolog)</td><td>Salah satu dari empat Bapak Studi Komunikasi</td></tr>`)}
${I('<b>L-L-H-L</b>: <b>L</b>ewin = <b>k</b>elompok, <b>L</b>azarsfeld = <b>m</b>assa (media), <b>H</b>ovland = <b>p</b>ersuasi/antarpribadi. Lasswell = si politikus.')}
<p>Kajian psikologi yang paling banyak menyumbang bagi komunikasi adalah <b>psikologi sosial</b>, yang makin matang pada masa PD II. Riset populer 1930-an: efek film bagi anak-anak, propaganda dan persuasi, serta dinamika kelompok. Walau begitu, <b>komunikasi bukan bagian dari disiplin psikologi</b>. Komunikasi menembus banyak disiplin ilmu dan dipelajari sebagai gejala perilaku oleh sosiologi, psikologi, dan lainnya.</p>
<h3>B. Lingkup psikologi komunikasi: tiga fungsi utama komunikasi</h3>
<p>Setiap pengalaman komunikasi menghasilkan satu atau lebih fungsi. Ada tiga yang utama:</p>
${T(`<tr><th>Fungsi</th><th>Penjelasan</th></tr>
<tr><td>1. Memahami diri sendiri dan orang lain</td><td>Kalau ingin tahu tentang orang lain, kita jadi tahu tentang diri kita. Kalau ingin tahu diri kita, kita belajar bagaimana orang lain memengaruhi kita. Kesadaran diri dibangun lewat komunikasi. Thomas Hora: untuk memahami diri sendiri kita perlu dipahami orang lain, dan agar dipahami orang lain kita perlu memahami mereka. Kita saling butuh <i>feedback</i> (umpan balik). Lewat komunikasi kita belajar mengapa kita percaya atau tidak percaya, apakah pikiran dan perasaan tersampaikan jelas, kapan kita punya kekuatan memengaruhi, dan apakah kita efektif mengambil keputusan atau menyelesaikan konflik.</td></tr>
<tr><td>2. Memapankan hubungan yang bermakna</td><td>Dalam membangun hubungan kita harus mempertimbangkan kebutuhan dan keinginan orang lain. Kebutuhan dasar sosial bertemu dalam hubungan interpersonal, kelompok kecil, dan komunikasi publik. Menurut William Schutz, komunikasi memuaskan kebutuhan akan <b>inklusi, kontrol, dan afeksi</b>.</td></tr>
<tr><td>3. Mengubah sikap dan perilaku</td><td>Dalam interaksi antarpribadi, kelompok kecil, dan komunikasi publik, kita banyak menghabiskan waktu memengaruhi orang lain agar berpikir, bertindak, dan menyukai seperti kita. Kadang berhasil, kadang gagal.</td></tr>`)}
<h3>Kebutuhan menurut William Schutz</h3>
${T(`<tr><th>Kebutuhan</th><th>Artinya</th></tr>
<tr><td>Inklusi</td><td>Kebutuhan bersama orang lain dan mengadakan kontak sosial; senang diterima dan ingin jadi mitra yang utuh</td></tr>
<tr><td>Kontrol</td><td>Kebutuhan merasa mampu bertanggung jawab, bekerja sama, mengelola lingkungan, dan memengaruhi orang lain</td></tr>
<tr><td>Afeksi</td><td>Kebutuhan menyatakan dan menerima cinta atau kasih sayang. Bila komunikasi bermakna, kita tidak merasa tidak dibutuhkan, tidak dicintai, dan tidak mampu</td></tr>`)}
${I('Inklusi = “<b>I</b>kut serta”, Kontrol = “<b>K</b>endali”, Afeksi = “<b>A</b>yang sayang”. Singkatannya <b>IKA</b>.')}
<p>Karena komunikasi yang dibahas adalah komunikasi antarmanusia, ia tak lepas dari aspek psikologis. Kita tak bisa menilai orang dari potongan interaksi sekilas. Suasana hati, suasana lingkungan, dan pengalaman menentukan perilaku. Orang yang tampak religius dan sopan bisa jadi penjahat, dan yang tampak kasar dan seram bisa jadi penolong saat kita butuh.</p>
<h3>C. Hubungan psikologi dengan komunikasi</h3>
<p>Jalaluddin Rakhmat: dalam psikologi, komunikasi bermakna luas, yaitu meliputi segala penyampaian energi, gelombang suara, tanda di antara tempat, sistem, atau organisme. Kata “komunikasi” dipakai sebagai <b>proses, pesan, pengaruh</b>, atau secara khusus sebagai pesan pasien dalam psikoterapi.</p>
<p>Psikologi membantu kita memahami bagaimana orang memahami diri dan orang lain, mengapa interaksi bisa bermakna, dan mengapa kita bisa mengubah sikap seseorang tetapi gagal pada orang lain. Psikologi melihat komunikasi dalam kaitan perilaku manusia dan menyimpulkan proses kesadaran yang menyebabkan perilaku itu, biasanya dalam konteks sosial. Pertemuan keduanya ada di <b>psikologi sosial</b>. Rakhmat: <b>psikologi komunikasi adalah bagian dari psikologi sosial</b>, sehingga pendekatan psikologi sosial adalah pendekatan psikologi komunikasi.</p>
<h3>D. Psikologi komunikasi</h3>
<p>George A. Miller: psikologi komunikasi adalah <b>ilmu yang berusaha menguraikan, meramalkan, dan mengendalikan peristiwa mental dan behavioral (perilaku) dalam komunikasi</b>.</p>
${T(`<tr><th>Kata kunci</th><th>Artinya</th></tr>
<tr><td>Menguraikan</td><td>Menganalisis mengapa tindakan komunikasi terjadi. Apa yang terjadi dalam diri kita sampai tindakan itu muncul?</td></tr>
<tr><td>Meramalkan</td><td>Membuat generalisasi atas perilaku yang dihubungkan dengan kondisi psikologis tertentu, lalu memprediksi perilaku apa yang muncul bila stimulus diberikan kepada orang berkarakter psikologis tertentu</td></tr>
<tr><td>Mengendalikan</td><td>Melakukan campur tangan (memanipulasi) bila menginginkan atau tidak menginginkan efek tertentu dari komunikasi</td></tr>`)}
<p>Kemampuan ini sangat berharga untuk komunikasi yang <b>efektif (berhasil-guna)</b>. Dari fungsi komunikasi, ada tiga tolok ukur efektivitas: (1) pemahaman diri sendiri dan orang lain, (2) mapannya hubungan sosial yang bermakna, (3) perubahan sikap dan perilaku. Psikologi komunikasi dibutuhkan untuk ketiganya.</p>
<h3>Lima tolok ukur efektivitas menurut Tubbs dan Moss (Rakhmat, 1994)</h3>
${T(`<tr><th>No</th><th>Tolok ukur</th><th>Artinya</th></tr>
<tr><td>1</td><td>Pengertian</td><td>Penerimaan cermat isi stimuli seperti yang dimaksudkan komunikator</td></tr>
<tr><td>2</td><td>Kesenangan</td><td>Komunikasi untuk menimbulkan kesenangan, membuat hubungan hangat, akrab, menyenangkan</td></tr>
<tr><td>3</td><td>Pengaruh pada sikap</td><td>Yang paling sering kita lakukan: memengaruhi orang lain (persuasi)</td></tr>
<tr><td>4</td><td>Hubungan yang makin baik</td><td>Menumbuhkan hubungan sosial yang baik</td></tr>
<tr><td>5</td><td>Tindakan</td><td>Terkait persuasi, melahirkan tindakan yang dikehendaki</td></tr>`)}
${I('Lima tolok ukur: <b>P-K-P-H-T</b> = Pengertian, Kesenangan, Pengaruh, Hubungan, Tindakan. Bayangkan “<b>P</b>ak <b>K</b>epala <b>P</b>un <b>H</b>ebat <b>T</b>egas”.')}
<h3>Efek komunikasi</h3>
<p>Efek yang paling diharapkan adalah <b>perubahan sikap dan perilaku</b>. Yang sangat berkepentingan adalah <b>komunikasi politik</b> dan <b>komunikasi bisnis (terutama periklanan)</b>: kampanye politik ingin khalayak memilih calon, kampanye iklan ingin khalayak membeli barang. Dalam banyak studi, perubahan perilaku inilah yang <b>paling sulit dicapai</b>. Banyak pakar sepakat bahwa yang paling bisa dijanjikan adalah perubahan pada tahap <b>pengetahuan (<i>knowledge</i>)</b>. Keinginan mencapai efek perilaku tidak berhenti, maka studi persuasi berkembang dan psikologi komunikasi menjadi penting.</p>
${I('Tangga efek: pengetahuan (paling mudah) → sikap → perilaku (paling sulit).')}
</div>
<div class="sec"><h2>🔥 Sering keluar di ujian</h2><h3>KB 1</h3>
<ul><li><b>Wundt</b> = lab pertama Leipzig 1879, Bapak Psikologi. <b>Hall</b> = lab pertama di Amerika (bukan James, bukan Dewey, dan “John Hopkins” itu nama universitasnya).</li>
<li><b>Melanchton</b> 1530 = pertama menyebut istilah psikologi. <b>Wundt</b> 1879 = kelahiran psikologi sebagai ilmu. Jangan tertukar.</li>
<li>Pneumatologi = jiwa dikaitkan dengan malaikat, roh jahat, Tuhan. Psikologi = kajian ilmiah.</li>
<li>Tabula rasa: Aristoteles memperkenalkan, Locke mengadopsi. Descartes <b>berlawanan</b> (bawaan).</li>
<li>Frenologi/tipologi/fisiognomi = pseudo-ilmiah (jebakan: “abnormal”, “impresif”, “istilah psikiatri”).</li>
<li>Weber = psikologi sosial lebih menekankan faktor <b>situasional</b>. Sears = beda pada <b>tingkat analisis</b> (interpersonal), bukan individu dan bukan masyarakat.</li>
<li>Deskripsi = apa, eksplanasi = mengapa. Modifikasi = ubah lingkungan.</li>
<li>Pilihan “kecuali” bisa menyelipkan reaksi dasar palsu. Yang benar hanya instrumental, kognitif, afektif, persepsi.</li></ul>
<h3>KB 2</h3>
<ul><li>Empat Bapak Studi Komunikasi: Lazarsfeld, Lewin, Lasswell, Hovland. Pilihan “kecuali”: <b>Lasswell</b> bukan psikolog (ilmuwan politik). Jangan masukkan Freud, Watson, atau Wundt.</li>
<li>Pasangan tokoh: Lewin = dinamika/komunikasi <b>kelompok</b>; Lazarsfeld = komunikasi <b>massa</b>, Columbia; Hovland = <b>persuasi</b>, perubahan sikap, interpersonal.</li>
<li>Komunikasi bukan bagian disiplin psikologi karena <b>menembus banyak disiplin ilmu</b> (bukan karena fokus persuasi).</li>
<li>Tiga fungsi komunikasi: memahami diri dan orang lain, memapankan hubungan bermakna, mengubah sikap dan perilaku. Schutz: inklusi, kontrol, afeksi. Jangan tertukar dengan “inklusi, kompetensi, afeksi”.</li>
<li>Miller: <b>menguraikan, meramalkan, mengendalikan</b> peristiwa mental dan behavioral. Kata “mengukur” atau “menyusun alat ukur” jebakan.</li>
<li>Tubbs &amp; Moss = <b>lima</b> tolok ukur. Tiga tolok ukur (pemahaman diri, hubungan bermakna, perubahan sikap) berasal dari uraian fungsi komunikasi.</li>
<li>Efek yang paling mungkin dijanjikan = pengetahuan. Efek paling sulit = perilaku. Bidang paling berkepentingan = komunikasi politik dan bisnis (iklan).</li>
<li>Rakhmat: psikologi komunikasi adalah <b>bagian dari psikologi sosial</b>, bukan sebaliknya.</li></ul></div>

mat:`
<div class="sec"><h2>📘 KB 1: Berbagai Pendekatan Psikologi tentang Perilaku Manusia</h2>
<p>Satu tindakan, misalnya membaca majalah, bisa dijelaskan dari banyak sudut. Dari dalam tubuh: kerja syaraf yang menggerakkan jari dan mata. Dari luar tubuh: tampilan majalah yang mewah membuat kita tertarik. Dari kegunaan: kita ingin informasi terbaru. Psikologi pun punya beberapa “kacamata”, dan karakteristik manusia tampaknya <b>sintesis</b> dari semuanya. Modul tidak mencari mana yang paling kuat.</p>
${T(`<tr><th>Sumber</th><th>Pendekatan utama menurut sumber itu</th></tr>
<tr><td>Sukadji (1986): <b>lima</b></td><td>Neurobiologik, psikoanalisis, perilaku, kognitif, humanistik</td></tr>
<tr><td>Jalaluddin Rakhmat (1994): <b>empat</b></td><td>Perilaku, kognitif, psikoanalisis, humanistik (tanpa neurobiologik)</td></tr>`)}
<h3>A. Pendekatan neurobiologis</h3>
<p>Otak manusia punya sekitar <b>12 miliar sel syaraf</b> dengan jalur tak terhingga, mungkin struktur paling kompleks di jagat raya. Pendekatan ini menghubungkan tindakan dengan kejadian di dalam tubuh, terutama otak dan susunan syaraf, dan mencoba menjelaskan hubungan perilaku yang teramati serta kejadian mental (pikiran, emosi) sebagai proses biologis.</p>
<ul><li>Bukti: aliran listrik lemah di bagian dalam otak dapat memunculkan rasa takut dan marah (pada hewan dan manusia). Di daerah lain dapat memunculkan rasa senang atau sakit, bahkan ingatan jelas masa lalu.</li>
<li>Tindakan paling rumit pun pada akhirnya mungkin diperinci dasar neurobiologisnya, tetapi teori neurobiologis yang lengkap <b>baru harapan</b>.</li>
<li><b>Mengapa kurang memadai?</b> Otak sangat rumit dan otak manusia hidup jarang bisa dipakai untuk penelitian, sehingga banyak “lowongan” pengetahuan fungsi syaraf belum terisi.</li></ul>
${I('Neuro = “<b>otak</b> yang jadi sopir”. Kurang memadai karena otak rumit dan sulit diteliti saat hidup.')}
<h3>B. Pendekatan psikoanalisis</h3>
<p>Cocok untuk menganalisis perkembangan kepribadian, proses sosialisasi, dan perilaku agresi. Tokohnya <b>Sigmund Freud (1856–1939)</b>, orang pertama yang memperkenalkannya. Sebenarnya ia teknik <i>psycho-therapeutic</i>. Dari pengalaman menerapi pasien gangguan jiwa (<i>neurotic</i>) Freud menulis <i>The Interpretation of Dreams</i> (1900). Ia disebut <b>“angkatan pertama”</b> psikologi, lahir di <b>Jerman</b> ketika sains dipuja sebagai juru selamat manusia (Rakhmat, 2003).</p>
<p><b>Anggapan dasar:</b> perilaku ditentukan <b>insting bawaan yang sebagian besar tidak disadari</b>, yaitu pengaruh pikiran, ketakutan, atau keinginan yang tidak disadari orangnya. Impuls masa kanak-kanak diusir dari kesadaran dan terpendam, tetapi tetap memengaruhi perilaku. Perwujudannya: mimpi, keliru ucapan, tindakan kecil berulang tanpa sadar (mata berkedip-kedip, menarik-narik leher baju), gejala penyakit neurotik, atau perilaku yang diterima masyarakat seperti seni, sastra, dan kegiatan ilmiah. Intinya, tindakan punya sebab, tetapi sering berupa <b>motif tak disadari</b>, bukan alasan rasional yang diucapkan orangnya.</p>
<p>Kepribadian = interaksi <b>Id, Ego, Superego</b>, jadi psikoanalisis menekankan totalitas kepribadian, bukan bagian terpisah.</p>
${T(`<tr><th></th><th>Id</th><th>Ego</th><th>Superego</th></tr>
<tr><td>Isi</td><td>Nafsu, dorongan biologis (makan, minum, seks, dll.)</td><td>Kesadaran akan realitas sosial</td><td>Polisi kepribadian, hati nurani; keinginan ideal berupa norma sosial dan kultural</td></tr>
<tr><td>Prinsip</td><td><i>Pleasure principle</i> (kesenangan)</td><td><i>Reality principle</i> (realitas)</td><td>Norma sosial dan moral</td></tr>
<tr><td>Ciri</td><td>Egois, tak peduli orang lain, tak kenal moralitas, “seperti hewan”; hanya menghasilkan keinginan, tidak memenuhinya</td><td>Menjejakkan kita pada kenyataan sosial; yang membuat keinginan terpenuhi</td><td>Memperingatkan apa yang tak boleh dilakukan</td></tr>`)}
<p><b>Dua insting dominan dalam Id:</b> <b>libido (eros)</b> = insting reproduktif yang menyediakan energi dasar untuk tetap hidup, dan <b>thanatos</b> = insting yang merusak menuju kematian. Motif tindakan adalah perpaduan keduanya.</p>
<p><b>Contoh:</b> karyawan ingin memaki atasan yang tidak adil (Id), tetapi tahu posisinya lemah dan teman-teman menasihati agar tidak macam-macam (Ego). Contoh lain: Id ingin rumah mewah dan mobil mutakhir, dorongan korupsi menguat karena orang lain melakukannya, Ego melihat peluang, Superego melarang. Ego jadi bingung dan frustrasi, lalu biasanya melakukan <b>distorsi realitas</b> (“si A yang idealis saja akhirnya korupsi”). Manusia menurut psikoanalisis adalah <b>Homo Volens</b> (manusia yang berkeinginan).</p>
${I('Id = “<b>I</b>ngin”, Ego = “<b>E</b>ksekutor realitas”, Superego = “<b>S</b>atpam moral”. Eros = hidup, Thanatos = <b>t</b>ewas.')}
<h3>C. Pendekatan perilaku (behaviorisme)</h3>
<p>Awal abad ke-20 <b>John B. Watson</b> memprakarsai gagasan bahwa objek utama psikologi adalah <b>perilaku yang dapat diamati</b>, menggeser fokus lama pada pengalaman mental. Metode introspeksi (mengamati dan mencatat persepsi dan perasaan sendiri untuk mengungkap proses mental) diganti: agar diakui sebagai ilmu, data harus dapat diamati dan diukur. Ini <b>“angkatan kedua”</b>, lahir di <b>Amerika</b> ketika metode ilmiah dipercaya sebagai satu-satunya cara yang andal.</p>
<ul><li>Bermanfaat menjelaskan persepsi interpersonal, konsep diri, eksperimen, sosialisasi, kontrol sosial, serta ganjaran dan hukuman.</li>
<li>Dua dasar pemikiran: (1) perilaku hasil <b>proses belajar</b> dari lingkungan, sehingga manusia dapat dipengaruhi lingkungannya; (2) manusia <b>dilahirkan tanpa sifat sosial atau psikologis</b>, perilaku adalah hasil pengalaman dan digerakkan kebutuhan memperbanyak kesenangan atau mengurangi penderitaan (Rakhmat, 1994).</li>
<li>Manusia = <b>Homo Mechanicus</b> (manusia mesin). Kita bisa membentuk seseorang menjadi apa pun asal lingkungannya tepat.</li>
<li>Disebut juga <b>psikologi Stimulus-Response (S-R)</b>. S-R yang ketat tidak mempertimbangkan pengalaman sadar dan tidak mempelajari proses mental di antara stimulus dan respons. Psikolog hanya mencatat laporan verbal sebagai data objektif.</li></ul>
${I('Behaviorisme = “<b>B</b>ukan isi kepala, tapi <b>b</b>ukti yang kelihatan”. Manusia = mesin, dicetak oleh lingkungan.')}
<h3>D. Pendekatan kognitif</h3>
<p>Manusia <b>bukan penerima stimuli yang pasif</b>. Mental mengolah informasi, mengubahnya jadi bentuk baru, dan mengelompokkannya ke kategori. <b>Kognisi</b> = berbagai cara mentransformasikan masukan indrawi, membubuhi kode pada masukan itu, menyimpan kode dalam ingatan, dan mengambilnya kembali bila perlu. Persepsi, pembentukan <i>image</i>, pemecahan masalah, ingatan, dan berpikir adalah fase hipotetik kognisi. Disebut <b>“angkatan ketiga”</b>.</p>
<p>Lahir karena S-R tak bisa menjawab mengapa ada orang berperilaku beda dari lingkungannya (<i>self-motivated</i>) dan karena manusia terlihat terlalu pasif. Behaviorisme berjasa menyadarkan pentingnya objektivitas dan pengukuran, sedangkan kognitif meneliti proses mental secara objektif dan ilmiah. Manusia = <b>Homo Sapiens</b>, makhluk yang selalu berusaha memahami lingkungan dan selalu berpikir. Perilaku harus dilihat dari konteksnya.</p>
${T(`<tr><th>Tokoh</th><th>Gagasan</th></tr>
<tr><td>Kurt Lewin</td><td><b>B = f(P, E)</b>: perilaku (<i>behavior</i>) adalah hasil interaksi seluruh diri (<i>person</i>) dengan lingkungan psikologisnya (<i>environment</i>). Dalam kelompok ada sifat kelompok yang tidak dimiliki individu.</td></tr>
<tr><td>Solomon Asch</td><td>Memperkuat Lewin: penilaian kelompok (<i>group judgement</i>) memengaruhi pembentukan kesan (<i>impression formation</i>)</td></tr>
<tr><td>Leon Festinger dan Fritz Heider</td><td><b>Teori konsistensi kognitif</b>: manusia cenderung mengalami ketegangan (<i>tension</i>) saat kebutuhan psikologis belum terpenuhi, lalu termotivasi menguranginya</td></tr>`)}
<p><b>Contoh perokok A:</b> membaca berita rokok penyebab kematian nomor satu, timbul tension. Pilihan keputusannya: (1) berhenti total, (2) terus merokok karena penelitiannya mungkin salah/tidak valid, (3) terus merokok karena dokter keluarga juga perokok, (4) terus merokok dengan filter.</p>
${I('Lewin = “<b>L</b>ingkungan + pribadi = perilaku”. Festinger-Heider = “<b>t</b>egang lalu cari <b>t</b>enang”.')}
<h3>E. Pendekatan humanistik</h3>
<p><b>“Angkatan keempat”</b> (setelah kognitif), lahir di Amerika ketika <b>kelas menengah menikmati kemakmuran material tetapi menderita kekosongan spiritual</b>. Pendekatan sebelumnya belum mengungkap manusia seutuhnya: kita dipengaruhi lingkungan (behaviorisme) tetapi bisa bertindak beda; kita menunjukkan naluri primitif (psikoanalisis) tetapi juga peduli dan sayang; kita sibuk berpikir (kognitif) tetapi ingin diakui dan mencari yang paling didambakan.</p>
<ul><li>Manusia = <b>Homo Ludens</b> (manusia bermain). Tiap orang hidup dalam pengalaman pribadi yang unik.</li>
<li>Manusia bukan sekadar wayang yang mencari identitas, tetapi mencari <b>makna</b> hidup, makna kehadiran, dan apa yang bisa diberikan. Carl Rogers: kecenderungan batiniah manusia menuju kesehatan dan keutuhan diri; dalam kondisi normal ia rasional dan konstruktif, memilih jalan pengembangan dan <b>aktualisasi diri</b> (mewujudkan diri sesuai potensi).</li>
<li>Menekankan <b>kreativitas, vitalitas emosi, eutentisitas</b>, dan pencarian makna di atas kepuasan materi.</li>
<li>Manusia <b>bebas memilih</b> dan bertanggung jawab; tidak bisa menyalahkan lingkungan, orang tua, atau keadaan. Berakar pada filsuf eksistensialis (Kierkegaard, Nietzsche, Sartre).</li>
<li>Motivasi utama: kecenderungan <b>tumbuh dan mengaktualisasi diri</b>, walau mungkin terhalang hambatan lingkungan dan budaya.</li>
<li>Reaksi terhadap masyarakat teknologi yang cenderung tidak manusiawi. Perhatian utama: pengalaman subjektif perorangan, bahkan persepsi diri dan dunia dianggap lebih penting daripada studi tindakan. Sebagian humanis menolak psikologi ilmiah.</li></ul>
${T(`<tr><th>Tiga pijakan humanistik</th></tr><tr><td>1. Keunikan manusia</td></tr><tr><td>2. Pentingnya nilai dan makna</td></tr><tr><td>3. Kemampuan manusia mengembangkan diri (manusia pemeran yang mengontrol nasib sendiri dan mengubah dunianya)</td></tr>`)}
${T(`<tr><th>Pendekatan</th><th>Angkatan</th><th>Lahir di</th><th>Manusia =</th><th>Kata kunci</th></tr>
<tr><td>Psikoanalisis</td><td>1</td><td>Jerman</td><td>Homo Volens</td><td>Insting tak sadar, Id-Ego-Superego</td></tr>
<tr><td>Behaviorisme</td><td>2</td><td>Amerika</td><td>Homo Mechanicus</td><td>S-R, belajar, lingkungan</td></tr>
<tr><td>Kognitif</td><td>3</td><td>(tidak disebut)</td><td>Homo Sapiens</td><td>Mengolah informasi, B=f(P,E)</td></tr>
<tr><td>Humanistik</td><td>4</td><td>Amerika</td><td>Homo Ludens</td><td>Aktualisasi diri, makna, bebas memilih</td></tr>`)}
${I('Urutan angkatan: <b>P-B-K-H</b> = “<b>P</b>ak <b>B</b>udi <b>K</b>e <b>H</b>utan”. Homo: Volens (v = ingin), Mechanicus (mesin), Sapiens (pikir), Ludens (main).')}
</div>
<div class="sec"><h2>📗 KB 2: Faktor Personal dan Situasional yang Memengaruhi Perilaku</h2>
<p>Di satu kubu: <b>William McDougall</b> (psikolog) berkata faktor <b>personal</b> (dari dalam diri) menentukan interaksi sosial. Manusia punya insting yang mendorongnya bertindak, misalnya berperang karena insting berkelahi, berorganisasi karena insting berkelompok. Di kubu lain: <b>Edward Ross</b> (sosiolog) berkata faktor <b>situasional dan sosial</b> paling menentukan, sejalan dengan behaviorisme. Contoh: kita khusyuk di pengajian masjid, tetapi di rutinitas kerja bisa lupa dan melakukan yang dilarang agama. Keduanya penting.</p>
<h3>A. Faktor personal</h3>
<h3>1. Faktor biologis</h3>
<p><b>E.O. Wilson</b> (dikutip Rakhmat, 1994) mengusung <b>sosiobiologi</b>: perilaku sosial dibimbing aturan yang diprogram secara genetis, disebut <b><i>epigenetic rules</i></b>, dari menghindari <i>incest</i>, memahami ekspresi wajah, sampai persaingan politik. Struktur biologis yang berpengaruh: <b>genetika</b> (kecerdasan, kemampuan sensasi, emosi), <b>sistem syaraf</b> (kerja otak, pengolahan informasi), <b>sistem hormonal</b> (mekanisme biologis dan proses psikologis, misalnya wanita lebih sensitif saat haid).</p>
${T(`<tr><th>Pengaruh biologis</th><th>Isi</th></tr>
<tr><td>Insting (naluri; <i>species-characteristic behavior</i>)</td><td>Perilaku bawaan, bukan karena lingkungan: agresivitas, bercinta, merawat anak; perilaku menarik lawan jenis ternyata universal</td></tr>
<tr><td>Motif biologis</td><td>Kebutuhan makan, minum, istirahat (<i>visceral motives</i>); kebutuhan seksual; kebutuhan mempertahankan diri dari sakit dan bahaya. Contoh: lapar membuat agresif dan menurunkan daya pikir rasional.</td></tr>`)}
<p>Kita bukan sekadar makhluk biologis. Buktinya cara kita memilih pasangan berbeda dari ayah atau kakek kita, jadi ada faktor <b>sosiopsikologis</b>.</p>
<h3>2. Faktor sosiopsikologis: tiga komponen</h3>
${T(`<tr><th>Komponen</th><th>Aspek</th><th>Isinya</th></tr>
<tr><td>Afektif</td><td>Emosional</td><td>Motif sosiogenis, sikap, emosi</td></tr>
<tr><td>Kognitif</td><td>Intelektual (apa yang diketahui)</td><td>Kepercayaan</td></tr>
<tr><td>Konatif</td><td>Volisional</td><td>Kebiasaan dan kemauan</td></tr>`)}
${I('<b>A-K-K</b>: Afektif = rasa (hati), Kognitif = tahu (kepala), Konatif = mau/bertindak (tangan).')}
<h3>a. Komponen afektif</h3>
<p><b>1) Motif sosiogenis</b> (motif sekunder, karena motif biologis dianggap primer) menurut Rakhmat (1994), enam macam:</p>
${T(`<tr><th>Motif</th><th>Penjelasan dan contoh</th></tr>
<tr><td>Ingin tahu</td><td>Tak nyaman bila terlambat atau tidak tahu hal yang dianggap keharusan. Contoh: saat presenter Indra Safera meninggal, radio “diberondong” telepon dan SMS. Rasa ingin tahu bisa jadi sarana menyebar gosip dan isu.</td></tr>
<tr><td>Kompetensi</td><td>Ingin menunjukkan kemampuan dan dihargai; bergantung perkembangan intelektual, sosial, emosional. Sering melahirkan <i>impression management</i>. Contoh: pelamar kerja berpakaian rapi dan berdasi.</td></tr>
<tr><td>Cinta</td><td>Mencintai dan dicintai mendewasakan kepribadian. Contoh: film <i>Leon: The Professional</i>; bunuh diri karena cinta tak sampai atau kesepian; mengekang (<i>overprotected, possessive</i>) atas nama cinta.</td></tr>
<tr><td>Harga diri dan kebutuhan mencari identitas</td><td>Ingin kehadiran diperhitungkan. Cari identitas lewat kelompok eksklusif, gaya busana, aksesori, cara bicara. Kehilangan identitas: mudah tersinggung, gelisah, gampang terpengaruh.</td></tr>
<tr><td>Nilai, kedambaan, makna kehidupan</td><td>Manusia butuh nilai untuk menuntun keputusan dan memberi makna, agar tidak putus asa dan kehilangan pegangan.</td></tr>
<tr><td>Pemenuhan diri</td><td>Setelah hidup bisa dipertahankan, ingin meningkatkan kualitas: mencipta, memperluas pengalaman, hubungan personal hangat dan bermakna, menjadi manusia ideal.</td></tr>`)}
${I('Enam motif: <b>I-K-C-H-N-P</b> = Ingin tahu, Kompetensi, Cinta, Harga diri, Nilai, Pemenuhan diri.')}
<p><b>2) Sikap</b> = kecenderungan bertindak, bepersepsi, berpikir, dan merasa dalam menghadapi objek, ide, situasi, atau nilai (Rakhmat, 1994). Sikap <b>bukan perilaku</b>, tetapi kecenderungan berperilaku, dan tidak berdiri sendiri (selalu ada objeknya: positif terhadap apa/siapa). Ciri-cirinya:</p>
<ul><li><b>Memiliki daya pendorong/motivasi</b>: sikap bukan gudang ingatan, ia menentukan apa yang kita sukai, harapkan, inginkan, setujui.</li>
<li><b>Relatif lebih menetap</b>, apalagi sikap kelompok. Contoh: pendukung Republikan tetap memilih Republik walau kampanye media gencar, begitu pula Demokrat.</li>
<li><b>Mengandung aspek evaluatif</b>: ada rasa senang atau tidak senang.</li>
<li><b>Timbul dari pengalaman</b>: tidak dibawa sejak lahir, bisa berubah dan diperteguh lewat proses belajar sosial (<i>social learning process</i>).</li></ul>
<p><b>3) Emosi</b> = keguncangan organisme yang disertai gejala kesadaran, keperilakuan, dan proses fisiologis (jantung berdetak lebih keras dan cepat, mencengkeram atau memukul). Emosi tidak harus dihilangkan. Manfaatnya: (a) energi terbangkitkan, (b) kita mendapat informasi dari diri sendiri dan orang lain, (c) informasi tentang keberhasilan kita.</p>
${T(`<tr><th>Dilihat dari</th><th>Jenis</th><th>Keterangan</th></tr>
<tr><td rowspan="3">Muatan</td><td>Ringan</td><td>Terpengaruh tetapi masih bisa mengendalikan diri (nonton film melodrama, tidak ikut menangis)</td></tr>
<tr><td>Berat</td><td>Gejala fisiologis kuat: detak jantung, tekanan darah, pernapasan, adrenalin</td></tr>
<tr><td>Disintegratif</td><td>Intensitas memuncak; akibat sakit dan penderitaan berkepanjangan serta menghadapi maut</td></tr>
<tr><td rowspan="2">Jangka waktu</td><td>Singkat</td><td>Emosi sesaat</td></tr>
<tr><td>Lama</td><td><b>Mood</b> = emosi menetap berjam-jam sampai berhari-hari. Bila masuk ke struktur kepribadian disebut <b>temperamen</b> (penyedih, penyabar, ceria). Mood memengaruhi persepsi dan perilaku.</td></tr>`)}
<h3>b. Komponen kognitif: kepercayaan</h3>
<p>Kepercayaan = keyakinan benar atau salah atas sesuatu berdasarkan bukti, sugesti otoritas, pengalaman, atau intuisi. Fungsinya: memberi perspektif dalam mempersepsikan realitas, dasar pengambilan keputusan, dan menentukan sikap. Contoh: percaya orang miskin karena malas, maka kita curiga dan tidak mengasihi. Terbentuk oleh <b>pengetahuan, kebutuhan, dan kepentingan</b> (“tak kenal maka tak sayang”; percaya omongan atasan karena butuh pujiannya).</p>
<h3>c. Komponen konatif: kebiasaan dan kemauan</h3>
<ul><li><b>Kebiasaan</b>: aspek perilaku yang menetap, berlangsung otomatis, tidak direncanakan; hasil pelaziman (<i>conditioning</i>) yang lama dan berulang. Membuat pola perilaku bisa diramalkan.</li>
<li><b>Kemauan</b>: tindakan sebagai usaha mencapai tujuan. Kemauan keras didorong keinginan keras, pengetahuan untuk mencapai tujuan, serta kecerdasan dan energi.</li></ul>
<h3>B. Faktor situasional (delapan)</h3>
<p>Kaum behaviorisme percaya lingkungan sangat memengaruhi perilaku.</p>
${T(`<tr><th>No</th><th>Faktor</th><th>Isi dan contoh</th></tr>
<tr><td>1</td><td>Ekologis</td><td>Kondisi alam (geografis) dan iklim (temperatur). Contoh: AC kantor mati membuat gairah kerja turun dan orang jadi emosional, agresif; orang pantai dianggap bicara keras dan emosional karena udara panas, orang pedalaman lebih lembut dan sabar.</td></tr>
<tr><td>2</td><td>Rancangan dan arsitektural</td><td>Tempat duduk ala kelas memberi kesan yang di depan berkuasa; bila posisi peserta setara disarankan melingkar (<i>circle</i>). Rumah berpagar rendah atau tanpa pagar dianggap penghuninya terbuka; pagar tinggi, rapat, megah seperti istana dianggap kurang mau berinteraksi.</td></tr>
<tr><td>3</td><td>Temporal</td><td>Waktu: <i>jetlag</i> (atlet pulang dari Amerika mengantuk berat siang hari); emosi pagi, siang, malam berbeda. Contoh: sidang larut malam dipakai “menggolkan” keputusan karena konsentrasi lemah.</td></tr>
<tr><td>4</td><td>Suasana perilaku</td><td>Tiap suasana punya pola hubungan yang mengatur perilaku. Contoh: pidato di lapangan terbuka beda dengan ruang tertutup; suara melembut di masjid, gereja, perpustakaan, bioskop; ribut di pasar atau saat nonton bola.</td></tr>
<tr><td>5</td><td>Teknologi</td><td>Jenis teknologi yang diadopsi memengaruhi struktur masyarakat, pola pikir, dan tindakan. Teknologi sederhana (untuk kebutuhan sendiri) beda suasana kejiwaannya dengan teknologi tinggi (untuk eksploitasi).</td></tr>
<tr><td>6</td><td>Faktor sosial</td><td><b>Sistem peran</b> (suami, ayah, dosen, dll. menghasilkan perilaku berbeda), <b>struktur sosial</b>, dan <b>karakteristik sosial individu</b> (usia, kecerdasan, karakter biologis).</td></tr>
<tr><td>7</td><td>Lingkungan psikososial</td><td>Persepsi kita terhadap lingkungan memengaruhi perilaku. Bila lingkungan dipersepsi menyenangkan, kita berperilaku positif.</td></tr>
<tr><td>8</td><td>Stimuli yang mendorong dan memperteguh perilaku</td><td>Situasi yang dianggap membolehkan mendorong kita bertindak, dan bila dibiarkan lama jadi kebiasaan. Contoh: pria berbusana bunga besar warna mencolok kini wajar; pandangan remaja soal seks pranikah bergeser sesuai kadar kebolehan (<i>permisiveness</i>); bila orang tak malu berbuat kriminal, kriminal mudah dilakukan.</td></tr>`)}
<p>Struktur sosial dalam kajian penyebaran inovasi mengklasifikasikan perilaku komunikasi orang:</p>
${T(`<tr><th>Istilah</th><th>Artinya</th></tr><tr><td>Opinion leader</td><td>Pemuka/pemimpin pendapat</td></tr><tr><td>Gatekeeper</td><td>Penyaring pendapat</td></tr><tr><td>Liaison</td><td>Penghubung</td></tr><tr><td>Isolate</td><td>Terlupakan, terisolasi</td></tr><tr><td>Follower</td><td>Pengikut</td></tr>`)}
${I('Delapan faktor situasional: <b>E-R-T-S-T-S-P-S</b> = “<b>E</b>mak <b>R</b>ajin <b>T</b>anam <b>S</b>ayur, <b>T</b>etangga <b>S</b>uka <b>P</b>etik <b>S</b>awi”: Ekologis, Rancangan, Temporal, Suasana, Teknologi, Sosial, Psikososial, Stimuli.')}
</div>
<div class="sec"><h2>🔥 Sering keluar di ujian</h2><ul>
<li>Neurobiologis kurang memadai karena otak rumit dan otak hidup jarang bisa diteliti. Teori lengkapnya baru <b>harapan</b>.</li>
<li>“Perilaku dikendalikan insting tak disadari” = psikoanalisis. “Masa kanak-kanak penting” = psikoanalisis. “Memahami lingkungan, selalu berpikir” = kognitif. “Aktualisasi diri” = humanistik.</li>
<li>Superego = polisi kepribadian, hati nurani, norma sosial-kultural. Id = <i>pleasure principle</i>. Ego = <i>reality principle</i>. Jangan tertukar. Libido = eros (hidup), thanatos = kematian.</li>
<li>Behaviorisme disebut S-R karena tidak mempelajari proses mental di antara stimulus dan respons (jawaban “manusia dapat mempelajari proses mental” itu jebakan).</li>
<li>Festinger dan Heider = konsistensi kognitif (tension). Lewin = B=f(P,E). Asch = penilaian kelompok dan kesan. Carl Rogers = humanistik.</li>
<li>Humanistik lahir saat kelas menengah Amerika <b>makmur materi tetapi hampa spiritual</b> (bukan perang saudara). Filsuf eksistensialis: Kierkegaard, Nietzsche, Sartre.</li>
<li>Angkatan: psikoanalisis 1, behaviorisme 2, kognitif 3, humanistik 4. Behaviorisme dan humanistik di Amerika, psikoanalisis di Jerman.</li>
<li>Rakhmat = empat pendekatan, Sukadji = lima.</li>
<li>Faktor personal = biologis + sosiopsikologis. Sosiopsikologis = afektif, kognitif, konatif. Kepercayaan = kognitif; kebiasaan dan kemauan = konatif; motif sosiogenis, sikap, emosi = afektif.</li>
<li>Motif sosiogenis disebut motif <b>sekunder</b>. McDougall = personal (insting), Ross = situasional. Wilson = sosiobiologi, <i>epigenetic rules</i>.</li>
<li>Mood berlangsung berjam-jam sampai berhari-hari; kalau masuk struktur kepribadian jadi temperamen. Emosi: ringan, berat, disintegratif.</li>
<li>Sikap bukan perilaku. Sikap timbul dari pengalaman (bukan bawaan lahir) dan relatif menetap.</li>
<li>Pilihan “kecuali” faktor situasional: yang bukan termasuk adalah insting dan kepercayaan (personal).</li></ul></div>

mat:`
<div class="sec"><h2>📘 KB 1: Sensasi dan Persepsi</h2>
<p>Setiap saat kita menerima stimulus dari luar, lalu diproses, diolah, disimpan, dan suatu saat dipakai lagi. Urutannya: <b>sensasi → persepsi → menyimpan dan menggunakan kembali</b>.</p>
<h3>A. Proses sensasi</h3>
<p>Sensasi = tahap awal penerimaan pesan. Berasal dari kata <i>sense</i> (alat indra) yang menghubungkan organisme dengan lingkungannya. <b>Sensasi adalah proses menangkap stimuli melalui alat indra.</b> Menurut Solso dkk (2008), sensasi mengacu pada pendeteksian dini energi dari dunia fisik, dan studinya berkaitan dengan struktur dan proses mekanisme sensorik beserta stimuli yang memengaruhinya.</p>
${T(`<tr><th>Indra</th><th>Struktur</th><th>Stimulus</th><th>Reseptor</th></tr>
<tr><td>Penglihatan</td><td>Mata</td><td>Gelombang cahaya</td><td>Sel batang dan sel kerucut</td></tr>
<tr><td>Pendengaran</td><td>Telinga</td><td>Gelombang suara</td><td>Sel-sel rambut</td></tr>
<tr><td>Perasa/pengecap</td><td>Lidah</td><td>Senyawa kimia</td><td>Ujung syaraf perasa</td></tr>
<tr><td>Penciuman</td><td>Hidung</td><td>Senyawa kimia</td><td>Sel-sel rambut</td></tr>
<tr><td>Peraba</td><td>Kulit</td><td>Tekanan</td><td>Sel-sel syaraf</td></tr>`)}
<ul><li>Indra terpenting: <b>penglihatan</b>, lalu pendengaran, lalu peraba (tangan memanipulasi benda) (Sukadji, 1986).</li>
<li>Penglihatan = pendeteksian bagian kecil gelombang elektromagnetik (cahaya). Cahaya masuk lewat <b>kornea dan lensa</b>, citra diarahkan ke <b>retina</b>.</li>
<li>Selain lima indra ada <b>kinestesis</b> (informasi posisi tubuh dan anggota badan, misal bergerak ke kiri mengambil barang) dan <b>vestibular</b> (indra keseimbangan, di bagian dalam telinga, misal naik sepeda atau eskalator).</li>
<li><b>Stimuli</b> = apa saja yang menyentuh alat indra, dari dalam maupun luar.</li>
<li><b>Transduksi</b>: alat indra mengubah informasi menjadi impuls syaraf yang dimengerti otak. Stimulus harus cukup kuat dan melewati batas minimal intensitas (<b><i>sensory threshold</i></b>). Mata: panjang gelombang <b>380–780 nanometer</b>. Telinga: frekuensi <b>20–20.000 Hertz</b>.</li>
<li>Sensasi dipengaruhi <b>faktor situasional</b> (di luar: keras-lembut suara, tajam-lembut bau, terang-buram cahaya) dan <b>faktor personal</b> (kapasitas indra, pengalaman, lingkungan budaya). Contoh Keluarga Amir: Ibu terbangun oleh kran bocor, Bapak tetap tidur; Ina menelan jamu pahit, Ani (kembarannya) memuntahkannya; gado-gado terasa sangat pedas bagi Pak Amir, hanya sedikit pedas bagi Ibu.</li></ul>
${I('Indra tambahan: <b>Kin</b>estesis = <b>kin</b>i posisi tubuh; <b>Vest</b>ibular = <b>vest</b>ibul telinga, seimbang. Mata 380–780, telinga 20–20.000 (dua “ribu” = dua puluh ribu).')}
<h3>B. Proses persepsi</h3>
<p><b>Persepsi adalah proses memberi makna pada sensasi</b>: cara kita menginterpretasi pesan yang diproses sistem indrawi. Persepsi mengubah sensasi menjadi informasi. Sensasi = pendeteksian dini stimuli, persepsi = interpretasi hal yang diindera (Solso dkk, 2008).</p>
${T(`<tr><th>Sensasi</th><th>Persepsi</th></tr>
<tr><td>Melihat seseorang di supermarket</td><td>Menyadari ia teman lama</td></tr>
<tr><td>Telinga menangkap bunyi</td><td>Menyadari bunyi itu panggilan untuk Anda</td></tr>
<tr><td>Hidung mencium wewangian</td><td>Menyadari sama dengan parfum favorit bekas pacar</td></tr>`)}
<p><b>Alur (Gambar 3.1):</b> objek/peristiwa di dunia nyata (1) → diterima alat indra sebagai energi/informasi, disebut stimulus (2) → diubah indra menjadi sinyal (3) → otak mengerti (4) → “komputer otak” membandingkan dengan peristiwa relevan yang tersimpan (5) → pengalaman perseptual. Contoh: kembang sepatu merah dipersepsi agak layu karena dibandingkan dengan yang segar; warna kuning bisa dimaknai warna partai, duka cita (bendera kuning), atau jaket almamater.</p>
<ul><li>Sarwono (1997): persepsi = proses pencarian informasi untuk dipahami; alatnya pengindraan, alat memahaminya kesadaran atau kognisi.</li>
<li>Dalam ilmu komunikasi, <b>persepsi adalah inti komunikasi, penafsiran (interpretasi) adalah inti persepsi</b> (Sobur, 2003). Persepsi tidak akurat berarti komunikasi tidak efektif.</li></ul>
${T(`<tr><th>Teori (Solso dkk)</th><th>Isi</th></tr>
<tr><td>Persepsi konstruktif</td><td>Manusia “mengkonstruksi” persepsi: aktif memilih stimuli dan menggabungkan sensasi dengan memori; membentuk dan menguji hipotesis. Perubahan penampilan rekan (janggut, kacamata) tetap dikenali karena <b>interferensi bawah sadar</b>.</td></tr>
<tr><td>Persepsi langsung</td><td>Persepsi dari perolehan informasi langsung dari lingkungan; stimulus sudah cukup informatif; belajar dan kognisi tidak penting; tak perlu representasi internal.</td></tr>`)}
<p>Solso: kedua teori <b>komplementer</b> (saling melengkapi), bukan bertentangan, berfokus pada tahap proses yang berbeda. Langsung penting karena menekankan stimuli sensorik dan pemrosesan sederhana serta alamiah-ekologis; konstruktif berguna untuk memahami bagaimana kesan sensorik dipahami otak.</p>
${I('<b>Sensasi = “lihat”, persepsi = “ooh itu dia!”</b>. Konstruktif = <b>k</b>ita yang <b>k</b>arang; Langsung = dunia yang <b>l</b>engkap memberi info.')}
<h3>C. Faktor-faktor yang memengaruhi persepsi</h3>
<p>Stimulus yang sama dimaknai berbeda: <b>persepsi selektif (<i>selective perception</i>)</b>. Contoh gambar vas atau dua wajah berhadapan: bagian tertentu dipersepsi sebagai <b>penampilan (figure)</b> (batas jelas, tampak lebih dekat), bagian lain sebagai <b>latar belakang</b> (tak banyak lekuk tepi, meluas di belakang). Bila ciri itu dihilangkan, elemen bergantian jadi penampilan dan latar (Sukadji, 1986). Contoh lain: kubus yang bisa dihitung 3 atau 5, perempuan muda atau wanita tua bersedih, bebek atau kelinci, tengkorak atau perempuan bergaun malam bercermin.</p>
<h3>1. Faktor personal</h3>
<p>Persepsi ditentukan juga oleh karakteristik orang yang merespons. Contoh: siswa lapar lebih sering melihat gambar samar sebagai makanan daripada yang kenyang (kondisi biologis). Krech dan Crutchfield: “<b>persepsi bersifat selektif secara fungsional</b>”, objek yang ditekankan adalah yang memenuhi tujuan individu, dipengaruhi: <b>a) kebutuhan, b) suasana mental, c) suasana emosional, d) latar belakang budaya, e) <i>frame of reference</i></b>. Contoh: orang menggeleng dipersepsi beda oleh orang India dan Indonesia; istilah kedokteran sulit bagi mahasiswa teknik karena tak punya kerangka rujukan.</p>
<h3>2. Faktor struktural</h3>
<p>Berasal dari sifat stimulus fisik dan efek syarafnya. Aliran <b>Gestalt</b> (= keseluruhan/konfigurasi): kita memersepsi sebagai keseluruhan; stimuli dikelompokkan jadi pola paling sederhana yang berarti.</p>
${T(`<tr><th>Prinsip Gestalt</th><th>Isi</th></tr>
<tr><td>Kedekatan (proksimitas)</td><td>Stimuli berdekatan tampak sebagai kelompok (garis berjarak tak sama tampak berkelompok)</td></tr>
<tr><td>Kesamaan (similaritas)</td><td>Stimuli serupa tampak berkelompok; bukan hanya bentuk, juga warna, permukaan, kerumitan</td></tr>
<tr><td>Kelengkapan (<i>closure</i>)</td><td>Cenderung melengkapi bagian kosong, terutama bila kecil dan objek sudah dikenal (garis putus-putus dilihat sebagai segitiga/bujur sangkar)</td></tr>`)}
<p>Implikasi: memaknai pesan atau memahami orang harus dalam kesatuan dan konteksnya (keluarga, lingkungan, masalah, prinsip hidup). Dalam persepsi sosial pengelompokan <b>tidak murni struktural</b>: kerangka rujukan dan budaya berperan. Contoh minimarket–hypermarket–mall–pasar: anak mengeluarkan “pasar” (becek, panas), ibu rumah tangga bisa mengeluarkan “minimarket” (kurang lengkap).</p>
${I('Gestalt = <b>K-S-K</b>: <b>K</b>edekatan, <b>S</b>amaan, <b>K</b>elengkapan. Personal = <b>K-S-E-B-F</b>: Kebutuhan, Suasana mental, Emosi, Budaya, Frame of reference.')}
<h3>D. Perhatian (attention)</h3>
<p>Perhatian = proses mental ketika stimuli menonjol dalam kesadaran saat stimuli lain melemah (<i>state of focused mental activity</i>). James: atensi = pemusatan pikiran terhadap objek, dan <b>pemusatan (<i>focalization</i>) kesadaran adalah intisarinya</b>; ada pengabaian objek lain. Solso dkk: pemusatan upaya mental pada peristiwa sensorik atau mental. Stimuli bersaing mendapat perhatian, maka ada <b>perhatian selektif (<i>selective attention</i>)</b>.</p>
<ul><li>Kita hanya bisa memperhatikan satu stimuli dengan mengorbankan yang lain. Mengemudi sambil mendengar radio bisa (otomatis), tetapi dua stimuli pada <b>modalitas sama</b> (dua suara, dua visual) atau dua tugas konseptual (menghitung patungan sambil menjawab “jam berapa?”) sulit.</li>
<li>Stimuli yang diabaikan kadang tidak dibuang, hanya diberi <b>prioritas sekunder</b> (pesta: tetap menangkap gosip menarik di ujung ruangan; opera dan sepak bola).</li></ul>
${T(`<tr><th>Faktor</th><th>Unsur</th><th>Contoh</th></tr>
<tr><td rowspan="5">Situasional (luar)</td><td>Gerakan</td><td>Neon sign bergerak, lampu sein berkedip</td></tr>
<tr><td>Kontras</td><td>Baju merah di kerumunan baju putih</td></tr>
<tr><td>Intensitas stimuli</td><td>Billboard terbesar, suara ledakan keras</td></tr>
<tr><td>Novelty</td><td>Hal baru dan luar biasa: film dengan efek visual berbeda</td></tr>
<tr><td>Perulangan</td><td>Iklan TV berulang, lagu sering diputar</td></tr>
<tr><td rowspan="2">Internal (diri)</td><td>Biologis</td><td>Lapar, haus: orang lapar memborong makanan, jadi sebaiknya belanja saat kenyang</td></tr>
<tr><td>Sosiopsikologis</td><td>Motif sosiogenis, kebiasaan, sikap, kemauan: pecinta bunga, pecandu bola cari halaman olahraga, calon pembeli rumah/motor</td></tr>`)}
${I('Situasional = <b>G-K-I-N-P</b> (“<b>G</b>ak <b>K</b>enal <b>I</b>kan <b>N</b>ila <b>P</b>anggang”): Gerakan, Kontras, Intensitas, Novelty, Perulangan.')}
</div>
<div class="sec"><h2>📗 KB 2: Memori dan Berpikir</h2>
<h3>A. Memori</h3>
<p><b>Memori = kemampuan merekam, menyimpan, dan memanggil kembali informasi.</b> <b><i>Recall</i></b> = kemampuan memanggil kembali informasi dari memori, unik hanya pada manusia. Memori adalah elemen pokok sebagian besar proses kognitif (Solso dkk, 2008). Schlessinger dan Groves (1976): sistem sangat berstruktur yang membuat organisme merekam fakta tentang dunia dan memakainya membimbing perilaku. Memori berperan dalam persepsi (menyediakan <b>kerangka rujukan</b>) dan berpikir.</p>
${T(`<tr><th>Tahap memori</th><th>Artinya</th></tr>
<tr><td>1. Perekaman (<i>encoding</i>)</td><td>Pencatatan informasi melalui indra penerimaan dan sistem syaraf internal</td></tr>
<tr><td>2. Penyimpanan (<i>storage</i>)</td><td>Menentukan berapa lama informasi bersama kita, bentuknya, dan tempatnya</td></tr>
<tr><td>3. Pemanggilan kembali (<i>retrieval</i>)</td><td>Menggunakan informasi yang disimpan</td></tr>`)}
${T(`<tr><th>Teori mekanisme memori</th><th>Isi</th></tr>
<tr><td>Teori Aus (<i>disuse</i>)</td><td>Memori memudar karena waktu; seperti otot, kuat bila dilatih terus-menerus</td></tr>
<tr><td>Teori Interferensi</td><td>Rekaman berikutnya menghapus atau mengaburkan memori sebelumnya</td></tr>
<tr><td>Teori Pengolahan Informasi</td><td><i>Sensory storage</i> (gudang indrawi) → <i>short-term memory</i> → dilupakan, atau dikoding ke <i>long-term memory</i></td></tr>`)}
<h3>1. Jenis memori</h3>
${T(`<tr><th>Dilihat dari</th><th>Jenis</th><th>Isi</th></tr>
<tr><td rowspan="2">Jangka waktu</td><td>Jangka pendek (STM)</td><td>Pengingatan sangat singkat (nomor telepon dosen yang langsung lupa). Dicatat agar tidak lupa.</td></tr>
<tr><td>Jangka panjang (LTM)</td><td>Diingat lama karena sering dipakai; STM yang diulang jadi LTM. Belajar “SKS” (sistem kerja semalam) hanya jangka pendek.</td></tr>
<tr><td rowspan="2">Jenis informasi</td><td>Semantik</td><td>Pengetahuan umum tentang orang, tempat, hal-hal di dunia</td></tr>
<tr><td>Episodik</td><td>Informasi personal berdasarkan tempat atau waktu khusus; termasuk <i>autobiographical memories</i> (ingatan tentang diri sendiri)</td></tr>`)}
<p>Semantik dan episodik saling berkaitan: pengetahuan semantik berasal dari memori episodik, sementara memori episodik diatur berdasarkan kategori semantik.</p>
<h3>2. Proses seleksi</h3>
<p>Tiga proses seleksi (<i>selective processes</i>): <b>(a) selective attention</b> (= <i>selective exposure</i>: memberi perhatian pada yang menonjol), <b>(b) selective perception</b>, <b>(c) selective memory</b> (= <i>selection retention</i>: hanya mengingat hal tertentu, melupakan yang lain). Perhatian selektif <b>adalah bagian dari</b> persepsi selektif; keduanya tumpang tindih dan sukar dipisahkan. Pengaruh: internal dan eksternal, misalnya budaya, usia, jenis kelamin, keluarga, agama, pendidikan, pengalaman, penampilan objek.</p>
<h3>3. Kelupaan</h3>
${T(`<tr><th>Bentuk</th><th>Penjelasan</th></tr>
<tr><td>Kegagalan penyandian (<i>failure to encode</i>)</td><td>Informasi tak pernah masuk ke LTM (sensorik tak bekerja, atensi tak diarahkan, melamun saat kuliah, lupa nama orang yang baru dikenal). Faktor stres: <b>Hukum Yerkes-Dodson</b>, arousal sangat rendah atau sangat tinggi menghambat kinerja memori; arousal terlalu kuat menyisakan bagian emosional tanpa detail.</td></tr>
<tr><td>Kegagalan konsolidasi (<i>consolidation failure</i>)</td><td>Hilangnya memori karena gangguan organik saat pembentukan jejak memori (<i>memory trace</i>). STM normal, tetapi perpindahan STM ke LTM terganggu.</td></tr>
<tr><td>Amnesia</td><td>Kelupaan akibat problem di otak (penyakit seperti Alzheimer dan sindrom Korsakoff, atau cedera otak traumatik). Tidak semudah di film dan jarang menghilangkan identitas diri.</td></tr>
<tr><td><i>Decay</i></td><td>Memudar seiring waktu atau jarang dipakai; bisa di STM maupun LTM</td></tr>
<tr><td>Interferensi retroaktif</td><td>Memori <b>baru</b> menghambat pengambilan memori <b>lama</b> (nomor mahasiswa baru membuat lupa nomor absen SMU)</td></tr>
<tr><td>Interferensi proaktif</td><td>Memori <b>lama</b> menghambat pengambilan memori <b>baru</b> (menuju tempat parkir lama padahal ada yang baru, dekat)</td></tr>
<tr><td>Kelupaan yang disengaja (<i>motivated forgetting</i>)</td><td>Represi yang <b>disadari</b>, menghindari kenangan traumatik</td></tr>
<tr><td>Represi (Freud)</td><td>Mendorong pikiran, memori, atau perasaan yang mengancam keluar dari kesadaran, dilakukan <b>tidak sadar</b> untuk melindungi ego. Sarana mengungkap: mimpi, hipnosis, asosiasi bebas; dibawa ke kesadaran lewat psikoterapi.</td></tr>`)}
${I('Retro = mundur: baru <b>meng</b>hambat lama. Pro = maju: lama menghambat baru. Represi = tak sadar, kelupaan disengaja = sadar.')}
<h3>4. Mengingat dan mnemonik</h3>
<p>Mengingat dan melupakan sama-sama penting. Sebagian besar dikendalikan proses neural tanpa upaya sadar, tetapi kadang kita mengambil alih (mencatat agenda di ponsel, memotret). <b>Mnemonik</b> = teknik meningkatkan penyimpanan dan pengambilan informasi (Solso dkk, 2008); Richards (2009): khususnya memori verbal dan faktual. Berasal dari <b>Mnemosyne</b>, ibu sembilan <i>muse</i> dalam mitologi Yunani.</p>
${T(`<tr><th>Teknik</th><th>Isi dan contoh</th></tr>
<tr><td>1. Loci</td><td>Mengasosiasikan objek dengan tempat yang dikenal (rumah, mobil). Orator Yunani-Romawi memakainya. Contoh belanja: sampo di bagasi, pasta gigi di jok, mi di kaca spion, keju di setir, kecap di atap. Makin aneh makin mudah.</td></tr>
<tr><td>2. Kata kunci</td><td>Asosiasi verbal dan visual kata berlafal mirip; untuk kata asing dan konsep abstrak. “Patofobia” ← “patok”; “hiperbola” ← kiper tak bisa menangkap bola yang terlalu tinggi.</td></tr>
<tr><td>3. Kata penghubung</td><td>Mengaitkan kata dengan aksi atau gambaran, dengan kata penanda untuk urutan. Nomor 340118: bemo beroda 3, mobil beroda 4, garasi kosong 0, ambulans 118. Hubungan tak harus logis.</td></tr>
<tr><td>4. Akronim</td><td>Satu kata dari huruf pertama rangkaian kata (RI, PSSI, SD); kadang huruf kedua (Jabodetabek), atau gabungan (Menbudpar). Contoh BC-M2K.</td></tr>
<tr><td>5. Akrostik (jembatan keledai)</td><td>Huruf kunci, tak selalu huruf pertama, tak selalu satu kata; bisa kalimat atau frase. Contoh <i>mejikuhibiniu</i> (warna pelangi).</td></tr>`)}
<p>Alat bantu memori lain: catatan pidato, teleprompter, indeks visual, buku referensi, butir tasbih, roda-doa, cerita rakyat lisan yang penuh pencitraan.</p>
${I('Lima teknik mnemonik = <b>L-K-H-A-A</b> (Loci, Kata kunci, Kata penghubung, Akronim, Akrostik). “<b>L</b>ihat <b>K</b>e <b>H</b>alaman, <b>A</b>da <b>A</b>yam”.')}
<h3>B. Berpikir (thinking)</h3>
<p>Berpikir atau lebih luas <b>kognisi</b> = penggunaan persepsi, kombinasi mental, dan penyajian internal tentang simbol, objek, atau konsep (Dworetzky, 1988). Hilgard (1962): setiap perilaku yang menggunakan ide. Sobur (2003): definisi paling umum = <b>perkembangan ide dan konsep</b>. Ciri utama: adanya <b>abstraksi</b> (Purwanto, 1998). Berpikir melibatkan sensasi, persepsi, dan memori; bersifat <b>representasional atau simbolik</b> (konsep dan lambang sebagai pengganti objek dan peristiwa). Anita Taylor dkk: berpikir adalah <b>proses penarikan kesimpulan</b> (<i>inferring process</i>).</p>
<p><b>Fungsi berpikir:</b> membuat keputusan (<i>decision making</i>), memecahkan persoalan (<i>problem solving</i>), menghasilkan yang baru (<i>creativity</i>).</p>
${T(`<tr><th>Jenis berpikir</th><th>Isi</th></tr>
<tr><td>Autistik</td><td>Melamun, berfantasi, mengkhayal; lari dari kenyataan</td></tr>
<tr><td>Realistik (nalar/<i>reasoning</i>)</td><td>Menyesuaikan diri dengan dunia nyata. Menurut Ruch ada tiga: <b>deduktif</b> (umum ke khusus), <b>induktif</b> (khusus ke umum, generalisasi), <b>evaluatif</b> (berpikir kritis, menilai baik-buruk tanpa menambah atau mengurangi gagasan)</td></tr>`)}
<p>Rakhmat (mengutip Hunt): manusia lebih sering berpikir tidak logis; yang lazim adalah <b>berpikir analogis</b> (perbandingan atau kontras), dilakukan awam maupun ahli.</p>
<h3>1. Membuat keputusan</h3>
<p>Asumsi: (a) keputusan hasil berpikir, (b) selalu melibatkan pilihan dari berbagai alternatif, (c) selalu melibatkan tindakan nyata (boleh ditunda atau dilupakan). Terjadi dalam <b><i>information-use environment</i></b>: <b>geografikal</b> (batas fisik: ruangan, kota, negara), <b>interpersonal</b> (kehadiran orang lain tatap muka: wawancara, kencan), <b>grup/organisasional</b> (klub, perusahaan), <b>kultural</b> (budaya, etnik, bangsa yang sama walau tak saling kenal).</p>
<p><b><i>Information-use sequence</i></b>: (1) deskripsi, (2) klasifikasi (bandingkan dengan informasi tersimpan), (3) evaluasi (identifikasi hubungan, tentukan reaksi tepat), (4) tindakan (verbal/nonverbal), lalu menunggu <i>feedback</i> dan mengulang tahap. Faktor personal (Rakhmat, 2003): <b>kognisi</b> (tahu nikotin berbahaya, kurangi merokok), <b>motif</b> (terima kerja bergaji kecil demi pengalaman), <b>sikap</b> (menjauhi teman hipokrit). Ketiganya tak terpisah. Keputusan juga dipengaruhi perilaku orang lain (<i>interacting</i>).</p>
<h3>2. Pemecahan masalah</h3>
<p>Masalah timbul bila pencapaian tujuan terhambat, kebutuhan tak terpenuhi, atau pertanyaan tak terjawab. Faktor: <b>situasional</b> (sifat stimulus: baru-lama, sulit-mudah, sering-jarang) dan <b>personal</b> (biologis dan sosiopsikologis: motivasi, sikap, kebiasaan, emosi). Lima tahap (tak selalu berurutan):</p>
<ol><li>Peristiwa menghambat perilaku biasa, dicoba pemecahan <b>rutin</b> (klakson berulang, starter berulang).</li><li>Cara biasa gagal, <b>menggali memori</b> cara efektif masa lalu (menyalip, menepikan mobil).</li><li>Mencoba berbagai cara, <b>uji coba</b>.</li><li>Memahami situasi, mencari jawaban dan kesimpulan, sering memakai <b>analogi</b>.</li><li>Tiba-tiba terlintas pemecahan: <b><i>insight solution</i></b>.</li></ol>
<h3>3. Berpikir kreatif</h3>
<p><b>Tiga syarat:</b> (a) melibatkan respons atau gagasan baru atau secara statistik sangat jarang; (b) harus dapat memecahkan persoalan secara realistis; (c) usaha mempertahankan insight orisinal, menilai, dan mengembangkannya sebaik mungkin. Guilford: berpikir <b>konvergen</b> = satu jawaban tepat (erat dengan <b>kecerdasan</b>); <b>divergen</b> = banyak kemungkinan jawaban (ciri orang kreatif, erat dengan <b>kreativitas</b>). Orang kreatif berpikir analogis dan melihat hubungan yang tak terlihat orang lain.</p>
${T(`<tr><th>Lima tahap berpikir kreatif (Rakhmat)</th><th>Isi</th></tr>
<tr><td>1. Orientasi</td><td>Masalah dirumuskan, aspek diidentifikasi</td></tr>
<tr><td>2. Preparasi</td><td>Mengumpulkan sebanyak mungkin informasi relevan</td></tr>
<tr><td>3. Inkubasi</td><td>Pikiran beristirahat saat buntu; pemecahan berlangsung terus di bawah sadar</td></tr>
<tr><td>4. Iluminasi</td><td>Ilham, serangkaian insight memecahkan masalah</td></tr>
<tr><td>5. Verifikasi</td><td>Menguji dan menilai kritis pemecahan</td></tr>`)}
<p><b>Ciri orang kreatif (Rakhmat, 2003):</b> (1) kemampuan kognitif (kecerdasan di atas rata-rata, gagasan baru dan berlainan, fleksibilitas kognitif); (2) sikap terbuka (menerima stimuli internal-eksternal, minat luas); (3) sikap bebas, otonom, percaya diri (tak suka diatur, tak terikat konvensi). <i>Berkas terpotong di sini, kemungkinan masih ada butir lanjutan.</i></p>
${I('Tahap kreatif = <b>O-P-I-I-V</b>: Orientasi, Preparasi, Inkubasi, Iluminasi, Verifikasi. Keputusan: <b>D-K-E-T</b> (Deskripsi, Klasifikasi, Evaluasi, Tindakan). Masalah berakhir di <b>insight</b>.')}
</div>
<div class="sec"><h2>🔥 Sering keluar di ujian</h2><ul>
<li>Sensasi = menangkap stimuli lewat indra; persepsi = memberi makna. “Udara panas terasa” = sensasi; menyadari “itu teman lama” = persepsi.</li>
<li>Vestibular = keseimbangan (telinga dalam); kinestesis = posisi tubuh. Berjinjit meraih buku di rak atas = <b>kinestesis</b> (jebakan: vestibular, perabaan).</li>
<li>Transduksi = indra mengubah informasi jadi impuls syaraf yang dimengerti otak. Jangan tertukar dengan <i>sensory threshold</i> (batas minimal intensitas).</li>
<li>Persepsi inti komunikasi; interpretasi inti persepsi. Konstruktif dan langsung = komplementer.</li>
<li>Persepsi: faktor <b>personal</b> dan <b>struktural</b>. Perhatian: faktor <b>situasional</b> dan <b>internal</b>. Jangan tertukar.</li>
<li>Bentuk (figure) sulit dibedakan dari latar bila ciri batas jelas dan kedekatan dihilangkan. Closure dilakukan terutama bila objek <b>sudah dikenal</b> dan bagian yang hilang kecil.</li>
<li>Gestalt = keseluruhan; tiga prinsip: kedekatan, kesamaan, kelengkapan. Dalam persepsi sosial pengelompokan tidak murni struktural.</li>
<li>Krech dan Crutchfield: persepsi selektif secara fungsional.</li>
<li>Faktor situasional perhatian: gerakan, kontras, intensitas, novelty, perulangan. Lapar/haus = biologis (internal).</li>
<li>Memori: encoding, storage, retrieval. Tiga teori: aus, interferensi, pengolahan informasi. Semantik (umum) vs episodik (personal).</li>
<li>Retroaktif vs proaktif; represi (tak sadar) vs kelupaan disengaja (sadar); Yerkes-Dodson (arousal); amnesia (Alzheimer, Korsakoff).</li>
<li>Deduktif umum→khusus, induktif khusus→umum, evaluatif menilai. Konvergen = kecerdasan, divergen = kreativitas. Insight = tahap akhir pemecahan masalah; iluminasi = tahap ke-4 berpikir kreatif.</li>
<li>Information-use environment: geografikal, interpersonal, grup, kultural.</li></ul></div>
<div class="sec"><h2>📖 Letak materi di modul</h2>${T(`<tr><th>Bagian</th><th>Halaman (perkiraan)</th></tr>
<tr><td>Sensasi</td><td>3.5 – 3.7</td></tr><tr><td>Persepsi</td><td>3.7 – 3.10</td></tr><tr><td>Faktor yang memengaruhi persepsi</td><td>3.10 – 3.15</td></tr><tr><td>Perhatian</td><td>3.15 – 3.19</td></tr><tr><td>Tes Formatif 1</td><td>3.21 – 3.22</td></tr>
<tr><td>KB2: memori, jenis, seleksi, kelupaan</td><td>3.24 – 3.31</td></tr><tr><td>KB2: mengingat dan mnemonik</td><td>3.29 – 3.33</td></tr><tr><td>KB2: berpikir</td><td>3.33 – 3.38</td></tr><tr><td>Rangkuman KB2</td><td>3.39</td></tr>`)}<p class="note">Nomor halaman bagian ini diperkirakan dari urutan lembar PDF karena nomor aslinya tidak terbaca pada sebagian halaman. Mohon dicek di buku.</p></div>`,
