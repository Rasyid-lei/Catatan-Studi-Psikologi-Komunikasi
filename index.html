{n:7,e:'💞',t:'Atraksi dan Hubungan Interpersonal',d:'Afiliasi, daya tarik, dan pola hubungan.',
mat:`
<div class="sec"><h2>🌟 Pengantar Modul 7</h2>
<p><b>Atraksi interpersonal</b> = kesukaan pada orang lain, sikap positif, dan daya tarik seseorang. Makin tertarik kita pada seseorang, makin besar kecenderungan berkomunikasi dengannya dan membangun hubungan interpersonal (<i>relationship</i>). Rasa suka (<i>liking</i>) membuat orang itu signifikan bagi kita: ingin menemuinya, menikmati kebersamaan, hidup lebih bahagia. Proses umum atraksi: <b>afiliasi → daya tarik → komunikasi/interaksi</b>.</p>
${I('Alur modul: tertarik dulu (KB1), lalu hubungan terbentuk dan berkembang (KB2). Atraksi = “kenapa aku suka dia?”, hubungan = “lalu bagaimana kami berjalan?”')}</div>
<div class="sec"><h2>📘 KB 1: Atraksi Interpersonal</h2>
<h3>A. Afiliasi</h3>
<p>Afiliasi = kecenderungan berhubungan dengan sejenisnya (berkumpul, berkerumun, berteman). Sebagian karena faktor biologis (manusia butuh kawan, Wright 1986, seperti simpanse dan kera, De Waal 1989), tetapi pada manusia ada faktor lain sehingga antarindividu berbeda (Sarwono, 1997).</p>
<h3>1. Tiga alasan berafiliasi</h3>
${T(`<tr><th>Alasan</th><th>Isi</th></tr>
<tr><td>Imbalan sosial (<i>social rewards</i>)</td><td>Antre di bioskop atau kerumunan restoran memberi “kebenaran” karena berada di tempat yang “tepat”</td></tr>
<tr><td>Mengurangi rasa takut</td><td><i>Misery loves company</i>. <b>Stanley Schachter (1959)</b>: rasa takut meningkatkan keinginan berafiliasi; bersama orang lain mengurangi takut. <b>Hipotesis pengalihan (<i>distraction</i>)</b>: siapa pun yang hangat membantu, entah senasib atau tidak.</td></tr>
<tr><td>Pembandingan sosial (<i>social comparison</i>)</td><td>Membandingkan dengan orang lain untuk <b>validasi</b>. Dilakukan saat <b>ketidakpastian</b> (apa yang normal/wajar/benar; gosip dan rumor saat isu penting tapi informasi lemah) dan saat <b>takut</b>, terutama bersama orang yang <b>juga takut</b> (menunggu dokter gigi bersama pasien lain). Schachter: rasa takut tinggi butuh teman yang sama-sama menderita, jadi hubungan takut-afiliasi lebih dijelaskan pembandingan sosial daripada pengalihan.</td></tr>`)}
<h3>2. Variasi dalam afiliasi</h3>
<ul><li><b>Urutan kelahiran</b>: anak pertama lebih mudah berafiliasi saat takut, sampai dewasa. Penjelasan: anak pertama adalah “percobaan” orang tua, mendapat perhatian dan kasih sayang lebih, belajar mencari kenyamanan dari orang lain; anak berikutnya membangun sendiri kemampuan menenangkan diri.</li>
<li><b>Informasi</b>: saat tidak pasti, memilih orang yang diharapkan memberi informasi terbaik; orang yang tampak <b>jujur dan akurat</b> lebih disukai walau informasinya kritis/tidak menyenangkan.</li>
<li><b><i>Attachment</i></b>: bayi membentuk keinginan kuat akan kontak fisik dan akses sosial pada pemberi kasih sayang utama (ibu); dasar pola afiliasi dan hubungan nanti. Tiga macam: <b>secure</b> (nyaman, percaya akan imbalan; kebanyakan anak) dan dua <b>insecure</b>: <b>anxious/ambivalent</b> (mencari hubungan, takut ditolak, menarik diri) dan <b>avoidant</b> (menghindar). Shaver dan Hazan dkk: pola terbentuk di masa kecil dan menetap sampai dewasa.</li></ul>
${I('Tiga alasan afiliasi: <b>I-T-P</b> (Imbalan, Takut, Pembandingan). Attachment: <b>S</b>ecure, <b>A</b>nxious, <b>A</b>voidant.')}
<h3>B. Daya tarik (atraksi)</h3>
<p>Afiliasi memberi imbalan sosial, tetapi kita memilih orang tertentu: itulah daya tarik. Menurut Weber ada dua model berdasarkan kekuatan imbalan dan satu model tentang proses evaluasi imbalan.</p>
${T(`<tr><th>Model</th><th>Isi</th></tr>
<tr><td>Imbalan Homans (George Homans)</td><td>Setiap interaksi ada pengorbanan. Kita tertarik pada orang bila <b>imbalan/keuntungan melebihi pengorbanan</b>.</td></tr>
<tr><td>Hukum ketertarikan Byrne (Don Byrne)</td><td>Makin kuat usaha memperoleh imbalan dari seseorang, makin tertarik. Menekankan <b>pengusahaan</b>, atraksi adalah proses yang terus berubah (bukan magnet). Hal penting: <b>kesamaan, evaluasi positif, kompatibilitas</b>.</td></tr>
<tr><td>Tahapan Murstein (Bernard Murstein)</td><td>Tiga tahap: <b>stimulus</b> (hal eksternal: usia, latar sosial, daya tarik), <b>nilai</b> (kesamaan sikap dan nilai: agama, ide politik), <b>peran</b> (peran kompatibel dan saling mengisi; dua orang sama-sama dominan akan bersaing).</td></tr>`)}
${I('Murstein = <b>S-N-P</b> (Stimulus → Nilai → Peran). Homans = untung &gt; rugi. Byrne = usaha, kesamaan, evaluasi, kompatibilitas.')}
<h3>Faktor-faktor yang memengaruhi atraksi (Rakhmat)</h3>
<h3>Faktor personal</h3>
${T(`<tr><th>Faktor</th><th>Isi</th></tr>
<tr><td>1. Kesamaan karakteristik personal</td><td>Kesamaan nilai, sikap, keyakinan, status sosial ekonomi, agama, ideologi membuat saling menyukai. Teori <b>cognitive consistency Fritz Heider</b>: ingin sikap sama dengan orang yang disukai agar kognisi konsisten. Kesamaan mendatangkan <b>ganjaran</b>, memperteguh penafsiran realitas, menaikkan percaya diri dan harga diri. Bukan satu-satunya penentu, tetapi bagi komunikator tepat memulai dengan mencari kesamaan.</td></tr>
<tr><td>2. Tekanan emosional</td><td>Cemas dan stres membuat ingin kehadiran orang lain (musibah: senang didatangi kerabat)</td></tr>
<tr><td>3. Harga diri rendah</td><td>Harga diri direndahkan → hasrat afiliasi naik; mudah menerima persahabatan</td></tr>
<tr><td>4. Isolasi sosial</td><td>Narapidana, petugas di rimba, orang terpencil: kehadiran orang lain membahagiakan</td></tr>`)}
<h3>Faktor situasional</h3>
${T(`<tr><th>Faktor</th><th>Isi</th></tr>
<tr><td>1. Daya tarik fisik</td><td>Sering penyebab utama atraksi. Cantik/tampan diasosiasikan baik hati, cerdas, pandai bergaul, sukses, mandiri; lebih mudah memperoleh simpati, lebih efektif memengaruhi, diperlakukan sopan. Bayi pun lebih suka orang dewasa yang menarik (Langlois, Roggman, Reiser-Danner, 1990).</td></tr>
<tr><td>2. Ganjaran (reward)</td><td>Menyukai orang yang memberi bantuan, dukungan moral, pujian, atau hal yang menaikkan harga diri</td></tr>
<tr><td>3. Familiarity</td><td>Sering bertemu → akrab → suka</td></tr>
<tr><td>4. Kedekatan (proximity) dan closeness</td><td>Erat dengan familiarity; orang menyukai yang tinggal berdekatan (tetangga, teman kos). Keduanya benar: saling menyukai → dekat, dekat → saling menyukai. Weber: dekat jarak maupun emosional. Jadi <b>penyaring</b> interaksi awal. Ada <b>kedekatan fungsional</b> (kegiatan spontan dan reguler, buang sampah bersamaan) dan pengaruh arsitektur (lantai dasar, dekat tangga/elevator/pintu keluar membuat lebih populer).</td></tr>
<tr><td>5. Kemampuan (competence)</td><td>Menyukai orang berkemampuan tinggi dan sukses. Orang sangat kompeten lebih disukai bila <b>melakukan kesalahan</b> (“pintar tapi tetap manusia”), sedang yang kurang pintar disebut “pecundang”.</td></tr>`)}
${I('Personal = <b>K-T-H-I</b> (Kesamaan, Tekanan emosional, Harga diri rendah, Isolasi). Situasional = <b>D-G-F-K-K</b> (Daya tarik fisik, Ganjaran, Familiarity, Kedekatan, Kemampuan).')}
<h3>Empat teori <i>liking</i> (dari rangkuman dan latihan modul)</h3>
${T(`<tr><th>Teori</th><th>Isi</th></tr>
<tr><td>Reinforcement</td><td>Menyukai atau tidak menyukai adalah hasil <b>belajar</b>. Tiga unsur: <b>asosiatif</b> (rangsangan diasosiasikan dengan pengalaman menyenangkan), <b>instrumental</b> (menyukai yang memberi imbalan, tak suka yang menghukum), <b>sosial</b> (menyukai yang disukai lingkungan sosialnya)</td></tr>
<tr><td>Equity</td><td>Dalam hubungan, manusia menjaga keseimbangan antara <b>harga (cost)</b> dan <b>ganjaran (reward)</b></td></tr>
<tr><td>Exchange (pertukaran)</td><td>Interaksi sosial seperti transaksi dagang; orang yang mendatangkan keuntungan ekonomis dan psikologis lebih disukai</td></tr>
<tr><td>Gain-loss</td><td>Lebih menyukai orang yang menguntungkan dan kurang tertarik pada yang merugikan</td></tr>`)}
<h3>C. Atraksi interpersonal dan komunikasi</h3>
<ul><li>Atraksi sulit dipisahkan dari interaksi; hubungan dipengaruhi suka-tidaknya kita. Bila suka, kita melihat segala hal terkait dirinya secara <b>positif</b>; bila tidak, negatif.</li>
<li><b>Efek timbal balik</b>: tertarik pada orang yang tertarik pada kita.</li>
<li>Orang yang memiliki daya tarik lebih dapat <b>memengaruhi pendapat dan sikap</b>; penilaian dan penafsiran dipengaruhi sejauh mana ia menarik bagi kita.</li>
<li>Daya tarik memengaruhi <b>suasana komunikasi</b>: saling menyukai → komunikasi efektif, nyaman; tidak suka → tegang, resah, ingin mengakhiri.</li></ul>
</div>
<div class="sec"><h2>📗 KB 2: Hubungan Interpersonal</h2>
<p>Komunikasi efektif ditandai hubungan interpersonal yang baik. Saat berkomunikasi kita menentukan <b>content</b> dan juga <b>relationship</b>. Contoh: “Sebutkan nama kamu!”, “Siapa nama Anda?”, “Bolehkah saya tahu siapa nama Bapak?” memiliki isi sama, tetapi mendefinisikan hubungan berbeda. Aspek hubungan dari pesan ini disebut <b>metakomunikasi</b>. Studi komunikasi interpersonal bergeser dari isi ke <b>aspek relasional</b> (unit analisis). Makin baik hubungan, makin terbuka orang mengungkapkan diri, makin cermat persepsi tentang orang lain dan diri, makin efektif komunikasi. Hubungan terbentuk ketika pengolahan pesan verbal dan nonverbal terjadi <b>timbal balik</b> (komunikasi interpersonal); tumbuh, berkembang, melemah. Muncul <b>kesepakatan aturan berkomunikasi</b>; bila salah satu tak lagi mematuhi, hubungan bisa putus.</p>
<h3>A. Jenis hubungan interpersonal</h3>
${T(`<tr><th>Dasar</th><th>Jenis</th><th>Isi</th></tr>
<tr><td rowspan="2">Jumlah individu</td><td>Diad (2 orang)</td><td>Kontak pertama kita diadik; sampai sekitar usia 6 tahun baru bisa berkontak dengan beberapa orang sekaligus. Ciri (William Wilmot): (a) tiap hubungan <b>tujuan khusus</b> (guru-murid beda dengan suami-istri); (b) individu menampilkan <b>“wajah” berbeda</b> di tiap hubungan; (c) berkembang <b>pola komunikasi unik</b> (kode-kode hanya dimengerti berdua).</td></tr>
<tr><td>Triad (3 orang)</td><td>Dibanding diad: <b>lebih kompleks</b>, <b>keintiman lebih rendah</b>, keputusan berdasarkan <b>voting</b> (diad lewat negosiasi), lebih mungkin timbul ketidakpuasan</td></tr>
<tr><td rowspan="2">Tujuan</td><td>Hubungan tugas (<i>task</i>)</td><td>Menyelesaikan sesuatu yang tak bisa sendirian (paper, sopir taksi-penumpang, terapis-pasien)</td></tr>
<tr><td>Hubungan sosial</td><td>Tanpa tujuan menyelesaikan sesuatu (sahabat, kenalan di kantin); membantu dari keterasingan dan kesepian</td></tr>
<tr><td rowspan="2">Jangka waktu</td><td>Jangka pendek</td><td>Sementara (menyapa di koridor, petugas apotek)</td></tr>
<tr><td>Jangka panjang</td><td>Makin lama makin banyak <b>investasi</b> (emosi, materi, waktu, komitmen) → makin berusaha mempertahankan; perpecahan lebih menyakitkan</td></tr>
<tr><td rowspan="2">Kedalaman</td><td>Hubungan biasa</td><td>Kenalan biasa: pola komunikasi <b>impersonal dan ritual</b> (percakapan basa-basi dua tetangga jauh)</td></tr>
<tr><td>Akrab/intim</td><td>Personal, bebas ritual, ditandai <b>penyingkapan diri (<i>self-disclosure</i>)</b> yang <b>timbal balik</b>; tumbuh pada hubungan jangka panjang dan cenderung dipertahankan</td></tr>`)}
<h3>B. Perkembangan hubungan interpersonal</h3>
${T(`<tr><th>Ruben (6 tahap)</th><th>Isi</th></tr>
<tr><td>1. Inisiasi</td><td>Paling awal; data lewat <b>petunjuk nonverbal</b> (senyum, jabat tangan, pandangan sekilas, gerak tubuh); bahasa berperan melewati kesan pertama</td></tr>
<tr><td>2. Eksplorasi</td><td>Menjajaki potensi dan kemungkinan hubungan; mengumpulkan informasi norma berkomunikasi, citra, sistem nilai, minat</td></tr>
<tr><td>3. Intensifikasi</td><td>Memutuskan (verbal/nonverbal) melanjutkan atau tidak; menyepakati pola komunikasi (norma kerja sama, lambang verbal)</td></tr>
<tr><td>4. Formalisasi</td><td>Diformalkan: simbol, pola komunikasi, kebiasaan (pertunangan/tukar cincin, kontrak kerja, akta jual-beli)</td></tr>
<tr><td>5. Redefinisi</td><td>Perubahan menekan hubungan, perlu didefinisikan ulang (anak menjelang remaja menjauh dari orang tua; karyawan membandingkan gaji). Bila terlalu cepat/drastis → kemunduran.</td></tr>
<tr><td>6. Deteriorasi</td><td>Kemunduran, awalnya tak disadari; tujuan dan orientasi memudar; norma jadi beban; menuju kehancuran</td></tr>`)}
<p>Hubungan tak selalu berurutan: bisa mulai dari eksplorasi, langsung formal, atau gagal dan mulai lagi dari tahap awal.</p>
${T(`<tr><th>Mark Knapp (5 tahap)</th><th>Isi</th></tr>
<tr><td>a. Inisiasi</td><td>Sedikit pembicaraan</td></tr><tr><td>b. Eksperimen</td><td>Mulai mencari informasi lebih banyak</td></tr><tr><td>c. Intensifikasi</td><td>Sama dengan Ruben</td></tr><tr><td>d. Integrasi</td><td>Perasaan bersama; merasa satu kesatuan</td></tr><tr><td>e. Pertalian/ikatan</td><td>Meneguhkan hubungan secara formal</td></tr>`)}
<p>Tahap Knapp tak harus dilalui semuanya (dijodohkan langsung ke tahap 5; jatuh cinta pada pandangan pertama ingin cepat ke tahap 5).</p>
<p><b>Jalaluddin Rakhmat meringkas menjadi tiga tahap:</b></p>
<ul><li><b>Pembentukan hubungan</b> (proses perkenalan, <i>acquaintance process</i>): informasi demografis (usia, pekerjaan, tempat tinggal, pendidikan, keluarga) dan petunjuk nonverbal; kesan pertama menentukan diteguhkan atau diakhiri.</li>
<li><b>Peneguhan hubungan</b>: hubungan tidak statis; butuh tindakan mengembalikan keseimbangan. Empat faktor: <b>keakraban, kontrol</b> (kesepakatan siapa mengontrol siapa dan kapan; konflik bila keduanya ingin berkuasa), <b>respons yang tepat</b> (verbal dan nonverbal), <b>nada/suasana emosional yang serasi</b>.</li>
<li><b>Pemutusan hubungan</b>: kematian atau konflik. Konflik bisa mengakhiri hubungan atau justru meningkatkan kualitasnya. <b>R.D. Nye: lima sumber konflik</b>:</li></ul>
${T(`<tr><th>Sumber</th><th>Isi</th></tr>
<tr><td>Kompetisi</td><td>Satu pihak memperoleh sesuatu dengan mengorbankan yang lain</td></tr>
<tr><td>Dominasi</td><td>Satu pihak mengendalikan yang lain sehingga merasa haknya dilanggar</td></tr>
<tr><td>Kegagalan</td><td>Tujuan bersama tak tercapai, saling menyalahkan</td></tr>
<tr><td>Provokasi</td><td>Terus-menerus berbuat sesuatu yang diketahui menyinggung</td></tr>
<tr><td>Perbedaan nilai</td><td>Tak sepakat tentang nilai yang dianut</td></tr>`)}
${I('Ruben = <b>I-E-I-F-R-D</b> (Inisiasi, Eksplorasi, Intensifikasi, Formalisasi, Redefinisi, Deteriorasi). Knapp = <b>I-E-I-I-P</b> (+ Integrasi, Pertalian). Nye = <b>K-D-K-P-P</b>.')}
<h3>C. Pola-pola relasional</h3>
<p>Pola komunikasi hasil aturan yang dikembangkan partisipan. Yang penting bukan berapa kali berkomunikasi, melainkan <b>bagaimana</b>. Ruben menyebut empat pola:</p>
${T(`<tr><th>Pola</th><th>Isi</th></tr>
<tr><td>1. Suportif dan defensif</td><td>Jack R. Gibb, enam perilaku (lihat tabel di bawah)</td></tr>
<tr><td>2. Dependen dan independen</td><td>Dependen: satu pihak sangat tergantung (dukungan, uang, pekerjaan, kepemimpinan, petunjuk; bayi-orang tua, pasien-terapis). Independen: bebas menyatakan ketidaksepakatan dan penolakan.</td></tr>
<tr><td>3. Progresif dan regresif</td><td>Progresif: menimbulkan keputusan dan harmoni (iklim positif). Regresif: berkembang tapi menimbulkan ketidakpuasan dan ketidakharmonisan</td></tr>
<tr><td>4. Self-fulfilling dan self-defeating prophecies</td><td>Harapan memengaruhi yang terjadi. Sangat ingin pekerjaan → tampil bagus saat wawancara; tak begitu ingin → tampil buruk</td></tr>`)}
${T(`<tr><th>Suportif</th><th>Defensif</th></tr>
<tr><td>Deskripsi: tidak menilai</td><td>Evaluasi: menilai perilaku orang</td></tr>
<tr><td>Orientasi masalah: bersama menetapkan tujuan, tanpa mengarahkan</td><td>Kontrol: mengarahkan/mengatur orang</td></tr>
<tr><td>Spontan: tanpa strategi atau taktik</td><td>Strategi: merencanakan teknik</td></tr>
<tr><td>Empati: menempatkan diri pada pandangan orang</td><td>Netralitas: menjauh dari perasaan/perhatian orang</td></tr>
<tr><td>Persamaan: memandang orang setara</td><td>Superioritas: merasa lebih tinggi</td></tr>
<tr><td>Provisionalisme: bersedia meninjau pendapat, tak dogmatis</td><td>Certainty: bertindak atas keyakinan sendiri tanpa mau berubah</td></tr>`)}
${I('Gibb: <b>D-O-S-E-P-P</b> (Deskripsi, Orientasi masalah, Spontan, Empati, Persamaan, Provisionalisme) lawannya <b>E-K-S-N-S-C</b>.')}
<h3>D. Faktor yang memengaruhi pola hubungan (Ruben)</h3>
<ul><li><b>Tingkat hubungan dan konteks</b>: baru kenal (inisiasi) tak mungkin defensif; mall beda dengan taman sepi atau kelas.</li>
<li><b>Kebutuhan interpersonal dan gaya komunikasi</b>: butuh mengontrol → defensif atau membuat orang tergantung; butuh kasih sayang → suportif/progresif. Gaya “senapan mesin” cenderung menguasai, yang pasif cenderung dikuasai.</li>
<li><b>Kekuasaan</b>: lebih berkuasa → hubungan <b>asimetris</b> (pasien-dokter, murid-dosen, magang-supervisor); sejajar → <b>simetris</b> (dua teman dekat, teman sekamar).</li>
<li><b>Konflik</b>: bisa memperbaiki atau menghancurkan. Konflik → ketidakpuasan → iklim <b>regresif</b>; tanpa konflik atau terselesaikan → kepuasan → <b>progresif</b>.</li></ul>
<h3>Tiga faktor penumbuh hubungan (Rakhmat)</h3>
${T(`<tr><th>Faktor</th><th>Isi</th></tr>
<tr><td>1. Percaya (<i>trust</i>) (paling penting)</td><td>Mengandalkan perilaku orang untuk mencapai tujuan yang pencapaiannya tak pasti dan berisiko. Membuka saluran komunikasi, memperjelas kirim-terima informasi, memperluas peluang mencapai maksud; menimbulkan <b>pengertian</b>. Dipengaruhi: <b>harga diri positif</b>, karakteristik dan maksud orang lain (mampu, maksud sama, jujur), hubungan kekuasaan, sifat dan kualitas komunikasi (terbuka). Tumbuh lewat <b>menerima, empati, jujur</b>.</td></tr>
<tr><td>2. Sikap suportif</td><td>Sudah dibahas (Gibb)</td></tr>
<tr><td>3. Sikap terbuka</td><td>Enam ciri: (1) menilai pesan objektif; (2) membedakan dan melihat nuansa; (3) berorientasi pada isi pesan, bukan sumber; (4) mencari informasi dari berbagai sumber; (5) provisional, bersedia mengubah kepercayaan; (6) mencari pengertian pesan yang tak sesuai kepercayaannya</td></tr>`)}
</div>
<div class="sec"><h2>🔥 Sering keluar di ujian</h2><ul>
<li>Atraksi = kesukaan, sikap positif, daya tarik. Proses: afiliasi, daya tarik, komunikasi.</li>
<li>Tiga alasan afiliasi: imbalan sosial, mengurangi takut, pembandingan sosial. Schachter (1959): takut → ingin afiliasi, butuh teman <b>yang sama-sama takut</b> (bukan sekadar pengalihan).</li>
<li>Anak pertama lebih mudah berafiliasi saat takut. Secure, anxious/ambivalent, avoidant (dua terakhir insecure). Shaver dan Hazan.</li>
<li>Homans = imbalan melebihi pengorbanan; Byrne = usaha; Murstein = stimulus, nilai, peran.</li>
<li>Faktor <b>personal</b>: kesamaan karakteristik, tekanan emosional, harga diri rendah, isolasi sosial. Jebakan “kecuali”: <b>kesetiakawanan</b> bukan faktor personal.</li>
<li>Situasional: daya tarik fisik, ganjaran, familiarity, kedekatan, kemampuan. Heider (cognitive consistency) dipakai untuk kesamaan, contoh perkumpulan berdasar hobi.</li>
<li>Empat teori liking: reinforcement (belajar; asosiatif, instrumental, sosial), equity (cost vs reward), exchange (transaksi dagang), gain-loss.</li>
<li>Metakomunikasi = aspek relasional. Diad: tujuan khusus, “wajah” berbeda, pola unik; <b>“hanya dapat diterapkan dalam pengambilan keputusan” bukan ciri diad</b>. Triad: kompleks, kurang intim, voting.</li>
<li>Hubungan tugas vs sosial; jangka pendek vs panjang (investasi); biasa (ritual) vs intim (self-disclosure).</li>
<li>Ruben 6 tahap; Knapp 5 tahap; Rakhmat 3 tahap (pembentukan, peneguhan, pemutusan). Inisiasi = petunjuk nonverbal.</li>
<li>Peneguhan: keakraban, kontrol, respons tepat, nada emosional tepat. Nye: kompetisi, dominasi, kegagalan, provokasi, perbedaan nilai.</li>
<li>Pola relasional (Ruben): suportif/defensif (Gibb, 6 perilaku), dependen/independen, progresif/regresif, self-fulfilling/self-defeating. Catatan: rangkuman modul keliru menulis “kegagalan, provokasi, perbedaan nilai” sebagai pola; itu sumber konflik Nye.</li>
<li>Faktor pola (Ruben): tingkat dan konteks, kebutuhan dan gaya, kekuasaan (asimetris/simetris), konflik. Rakhmat: percaya, sikap suportif, sikap terbuka (rangkuman menulis “percaya diri”, uraian menulis “percaya”).</li>
<li>Percaya = faktor paling penting; menimbulkan pengertian dan meningkatkan komunikasi.</li></ul></div>

{n:8,e:'👥',t:'Pengaruh Sosial dan Perilaku Kelompok',d:'Bentuk pengaruh, kekuasaan, kelompok, dan kepemimpinan.',
mat:`
<div class="sec"><h2>🌟 Pengantar Modul 8</h2>
<p>Manusia makhluk sosial. Dalam interaksi, sikap dan perilaku kita bisa berubah karena orang lain. Inti sebagian besar pembahasan psikologi sosial adalah <b>pengaruh</b>. Keanggotaan kelompok memberi manfaat pribadi dan memungkinkan tujuan yang tak tercapai sendirian. Modul ini membahas sifat psikologis kelompok, dinamika kinerja kelompok, dan kepemimpinan.</p></div>
<div class="sec"><h2>📘 KB 1: Pengaruh Sosial</h2>
<p><b>Pengaruh sosial</b> = perubahan sikap atau perilaku sebagai hasil interaksi dengan orang lain.</p>
<h3>A. Tingkatan pengaruh sosial</h3>
${T(`<tr><th>Tingkat</th><th>Bentuk</th><th>Isi dan contoh</th></tr>
<tr><td rowspan="2"><b>Acceptance</b> (penerimaan penuh; perubahan di dalam batin)</td><td>Identification (identifikasi)</td><td>Menerima karena mengidentifikasi atau memihak kelompok/individu; menjaga hubungan personal. <b>Isi perubahan kurang penting dibanding hasilnya</b>. Contoh: menerima aturan lembaga sosial yang dibela walau belum tahu semuanya.</td></tr>
<tr><td>Internalization (internalisasi)</td><td>Bentuk <b>paling dalam</b>: yakin mempercayai perubahan sikap, menerima makna dan bentuk sosial. Contoh: bergabung karena setuju dengan standar lembaga.</td></tr>
<tr><td rowspan="2"><b>Compliance</b> (perubahan parsial; perilaku/ekspresi berubah tetapi tidak menerima utuh)</td><td>Conformity (konformitas)</td><td>Paling banyak diteliti: perubahan akibat <b>tekanan kelompok</b></td></tr>
<tr><td>Obedience (kepatuhan)</td><td>Bentuk paling menarik: hasil <b>permintaan langsung atau perintah</b></td></tr>`)}
<p>Peneliti lebih banyak membahas compliance karena mengubah perilaku yang dapat diamati dan diukur; acceptance hanya diketahui lewat <i>self-report</i> jujur.</p>
${I('Acceptance = <b>I-I</b> (Identifikasi, Internalisasi). Compliance = <b>K-K</b> (Konformitas, Kepatuhan). Internalisasi paling dalam.')}
<h3>B. Mengapa kita menerima pengaruh orang lain</h3>
${T(`<tr><th>Pengaruh</th><th>Isi</th></tr>
<tr><td>Normatif</td><td>Dari teori pembandingan sosial: memvalidasi keyakinan dengan perilaku orang lain; pengamatan menjadi pedoman (norma) lalu ditiru. “Orang-orang itu tidak mungkin salah.” Bergantung pada isyarat sosial (ukuran kelompok, status pemberi pengaruh). Contoh: memilih kursus berdasar saran teman.</td></tr>
<tr><td>Informasional</td><td>Mengubah pikiran dan tindakan karena orang lain menunjukkan cara yang lebih baik atau informasi berguna. Menghasilkan <b>compliance dan acceptance</b>. Contoh: rekan menyarankan prosedur analisis data yang lebih efisien.</td></tr>`)}
<p>Banyak bentuk konformitas melibatkan keduanya.</p>
<h3>C. Tiga bentuk pengaruh sosial: konformitas, kepatuhan, kekuasaan</h3>
<h3>1. Konformitas</h3>
<p>Dua proses klasik: <b>pembentukan norma</b> dan <b>tekanan kelompok</b>.</p>
<ul><li><b>Pembentukan norma</b>: norma = pedoman berperilaku yang juga hasil interaksi sosial (populer, modern, “normal”), sehingga bisa berubah. <b>Muzafer Sherif (1930-an)</b>: walau tak saling kenal, orang bersandar pada persepsi orang lain menentukan norma lalu menyesuaikan penilaiannya; norma memengaruhi penilaian berikutnya dan <b>bertahan walau kelompok diganti</b> (menjelaskan tradisi antargenerasi). Dijelaskan oleh pembandingan sosial.</li>
<li><b>Penularan sosial (<i>social contagion</i>)</b>: norma menyebar cepat, sebagai penyebaran pola perilaku ke banyak orang (rumor, lelucon; pekerja pabrik dengan “penyakit” imajiner yang gejalanya menular ke rekan).</li>
<li><b>Tekanan kelompok</b>: kelompok bisa hadir fisik atau imajiner (bioskop gelap). <b>Solomon Asch (1940–1950-an)</b>: walau di antara orang tak dikenal, individu terpengaruh mengikuti norma bahkan saat melihat sendiri realitasnya. <b>Crutchfield</b> melanjutkan: walau orang lain hadir tak langsung (tidak tatap muka), kecenderungan kelompok tetap menciptakan tekanan.</li></ul>
${T(`<tr><th>Faktor situasi (Asch dan lainnya)</th><th>Isi</th></tr>
<tr><td>1. Ukuran kelompok</td><td>3 → 5 orang konformitas naik; di atas 5 pengaruhnya kecil</td></tr>
<tr><td>2. Kebulatan suara (<i>unanimity</i>)</td><td>Kelompok sepakat → konformitas lebih besar; satu penyimpang memudahkan yang lain tidak menyesuaikan</td></tr>
<tr><td>3. Kohesi kelompok</td><td>Loyalitas, kekuatan yang membuat anggota bertahan; “semangat kelompok”; saling menyukai membuat sulit berbeda</td></tr>
<tr><td>4. Komitmen publik</td><td>Konformitas lebih tinggi bila pilihan dibuat di depan umum (angkat tangan) daripada rahasia</td></tr>`)}
${T(`<tr><th>Perbedaan individual</th><th>Isi</th></tr>
<tr><td>1. Status</td><td>Status rendah lebih mudah menyesuaikan; orang berpenampilan menarik lebih mudah ditiru bahkan saat memberi contoh buruk; pekerjaan status rendah mencari panduan atasan</td></tr>
<tr><td>2. Gender</td><td>Kebanyakan studi tak menunjukkan beda; dalam kondisi tertentu perempuan lebih konformis, atau hanya lebih berorientasi sosial; bisa jadi bentuk pengaruh status (laki-laki umumnya berkuasa sosial lebih)</td></tr>
<tr><td>3. Kepribadian</td><td>Kesimpulan lemah; kebutuhan persetujuan sosial kuat → mudah menyesuaikan; situasi “kuat” → perbedaan kepribadian kecil, situasi “lemah” → kepribadian berperan</td></tr>
<tr><td>4. Budaya</td><td>Perbedaan budaya dan bangsa → nilai dan tujuan berbeda → konformitas berbeda</td></tr>`)}
${I('Faktor situasi = <b>U-K-K-K</b> (Ukuran, Kebulatan, Kohesi, Komitmen publik). Individual = <b>S-G-K-B</b> (Status, Gender, Kepribadian, Budaya).')}
<h3>2. Kepatuhan (<i>obedience</i>)</h3>
<p>Setelah PD II banyak orang Amerika yakin yang terjadi di Jerman (Nazi) tak mungkin di Amerika. <b>Stanley Milgram</b> (Universitas Yale) membuat eksperimen kontroversial tentang sejauh mana orang mematuhi perintah orang tak dikenal yang berwenang. Kesimpulan: <b>situasi sosial sangat berkuasa</b>. Konsep <b><i>experimental realism</i></b>: individu menafsirkan situasi sebagai sangat kuat sehingga sulit melawan. Pertanyaan yang lebih bermanfaat bukan “orang seperti apa yang patuh?” tetapi “aspek situasi apa yang membuat sulit tak patuh?”. Faktor:</p>
<ul><li><b>Sosok berwenang</b>: makin dekat dengan sosok berwenang, makin patuh; wewenang dinilai dari seragam, tanda pangkat, bahasa, gelar.</li>
<li><b>Dukungan kelompok</b>: makin banyak anggota patuh, makin besar individu lain patuh, dan sebaliknya.</li></ul>
<h3>3. Kekuasaan sosial (<i>social power</i>)</h3>
<p>Tekanan konformitas datang dari power kelompok sosial; tekanan kepatuhan dari power orang berwenang. <b>Power</b> = kekuatan pemberi pengaruh untuk mengubah sikap dan perilaku. <b>Bertram Raven dkk.</b>: enam tipe.</p>
${T(`<tr><th>Tipe</th><th>Isi</th><th>Catatan</th></tr>
<tr><td>Reward</td><td>Berdasar kepemilikan; memberi yang diinginkan (pujian, persetujuan, uang) atau mengambil yang tidak disukai</td><td>Kelemahan: pemberi pengaruh harus mengamati perilaku sasaran</td></tr>
<tr><td>Coercive</td><td>Power menghukum; mengancam mengambil sesuatu (uang, kasih sayang) atau membuat menderita</td><td>Perlu pengawasan; menumbuhkan kebencian dan melemahkan semangat; ketaatan tanpa <i>acceptance</i></td></tr>
<tr><td>Legitimate</td><td>Diakui berhak karena wewenang, status, kedudukan (dosen menentukan tenggat tugas)</td><td>Dibatasi peran (dosen tak boleh menyuruh mahasiswa jadi suruhan)</td></tr>
<tr><td>Referent</td><td>Sasaran mengidentifikasi atau berharap sama dengan pemberi pengaruh; bisa dimiliki teman/keluarga</td><td>Rapuh: kebencian dan tak hormat memutus kendali</td></tr>
<tr><td>Expert</td><td>Keyakinan pemberi pengaruh berpengetahuan tinggi (dokter vs petugas kebersihan soal berat badan)</td><td>-</td></tr>
<tr><td>Informational</td><td>Bahkan orang tak ahli punya pengaruh bila memiliki informasi yang mendukung perubahan (sahabat menyebut penilaian rendah majalah atas mobil)</td><td>-</td></tr>`)}
<p>Semua tipe <b>bergantung secara sosial</b> pada kualitas, strategi, atau modal pemberi pengaruh. Bila tak bisa memberi imbalan/hukuman, tak disukai atau dihormati, dan tak punya keahlian/informasi relevan, orang tak punya power cukup.</p>
${I('Raven = <b>R-C-L-R-E-I</b>: “<b>R</b>aja <b>C</b>erdik <b>L</b>ihai <b>R</b>ayu <b>E</b>ngkau <b>I</b>ni”. Reward, Coercive, Legitimate, Referent, Expert, Informational.')}
<h3>D. Dampak kekuasaan</h3>
${T(`<tr><th>Terhadap</th><th>Isi</th></tr>
<tr><td>Powerless (tak berdaya)</td><td>Dipengaruhi teratur → <b>compliance</b>, tetapi program ketaatan perilaku dari waktu ke waktu dapat menghasilkan <b>acceptance</b> (contoh menyatakan janji/ikrar). Dua proses: <b>momentum of compliance</b> (demonstrasi dukungan → kecenderungan kuat bersandar pada pengaruh) dan <b><i>behavioral commitment</i></b> (tindakan tak bisa ditarik tetapi sikap bisa diubah, mengurangi <i>dissonance</i>). Dampak lain: <b><i>learned-helplessness</i></b> (ketidakberdayaan yang dipelajari; pasien rumah sakit, tahanan), dikaitkan kesehatan buruk, self-esteem rendah, enggan berubah. Banyak orang bergantian powerful dan powerless (supervisor di kantor, di rumah di bawah kendali orang tua/pasangan).</td></tr>
<tr><td>Powerful (berkuasa)</td><td><b>Korupsi kekuasaan</b> (<i>power corrupt</i>): akses power meningkatkan kesempatan memakainya, mengontrol dan merendahkan sasaran, rasa berkuasa jadi penting bagi self-esteem; bisa jadi candu dan kebiasaan merusak</td></tr>`)}
</div>
<div class="sec"><h2>📗 KB 2: Perilaku Kelompok</h2>
<h3>A. Klasifikasi dan peran kelompok</h3>
<p>Kelompok didefinisikan secara psikologis lewat <b>kualitas fungsional</b>, bukan sifat fisik: <b>dua orang atau lebih yang berinteraksi, berkomunikasi, dan memengaruhi satu sama lain selama beberapa waktu</b>. Anggota berbagi keadaan, <b>persepsi, dan tujuan</b>, sadar akan keberadaan satu sama lain, dan bertukar pesan. Orang dalam lift tidak membentuk kelompok, tetapi bila lift berhenti mendadak, mereka dapat cepat menjadi kelompok. Yang tak berinteraksi disebut <b>non-group</b> atau <b>aggregates</b>.</p>
<p><b>Dua alasan bergabung:</b> (1) pencapaian tujuan (pindah rumah dibantu teman) dan (2) pemuasan kebutuhan (persetujuan, rasa memiliki, persahabatan, cinta).</p>
<h3>1. Pengaruh kelompok bagi individu</h3>
${T(`<tr><th>Peran</th><th>Isi</th></tr>
<tr><td>Identitas</td><td>Keanggotaan = kategorisasi sosial, aspek identitas sosial. <b>Kelompok rujukan</b> penting bagi identitas dan aspirasi. Individu membandingkan <b>in-groups</b> dengan <b>out-groups</b>.</td></tr>
<tr><td>Penyimpangan (<i>deviance</i>)</td><td>Melanggar norma kelompok demi kebutuhan pribadi. Menurut pembandingan sosial, penyimpang mengancam validasi dengan <b>merusak atau mengurangi konsensus</b>. Urutan: anggota berkomunikasi dengan penyimpang untuk memulihkan konsensus → bila gagal menolak → akhirnya penyimpang disingkirkan, konsensus tercapai.</td></tr>
<tr><td>Dampak sosial (<i>social impact</i>)</td><td>Pengaruh lebih besar bila kelompok <b>kuat</b> (penting bagi anggota), <b>dekat</b> (sering bertemu, rumah berdekatan), dan <b>besar jumlahnya</b></td></tr>`)}
<h3>2. Struktur dan fungsi kelompok</h3>
<p><b>Robert Bales</b> (Harvard): dua fungsi, <b>agenda tugas</b> (pekerjaan, pemecahan masalah, keputusan) dan <b>agenda sosial</b> (kebutuhan emosional dan peran sosial). Dipertemukan lewat tiga struktur/proses: <b>norma, peran, kohesi</b>.</p>
<ul><li><b>Norma</b>: aturan atau pedoman perilaku yang diharapkan dan diterima, berkembang bahkan tanpa sadar. <b>Eksplisit</b> (bisa dijelaskan ke anggota baru) atau <b>implisit</b> (halus, taken for granted, terlihat saat ada yang menyimpang). Cara membuat keputusan pun punya norma (menuruti yang punya kendaraan; voting).</li>
<li><b>Peran</b>: seperangkat norma yang menentukan perilaku pantas bagi posisi sosial. Membedakan fungsi dan kontribusi; berdasar bakat; sumber <i>reward</i> sekaligus masalah. Ada <b>spesialis tugas</b> dan <b>spesialis sosioemosional</b>. Peran berbeda nilai: yang berkaitan kehormatan/gengsi = <b>status tinggi</b>; bos bisa membuka komunikasi dengan bawahan, tidak sebaliknya. Status = reward tetapi ada cost (kebencian, persaingan).
<br><b>Konflik peran:</b> <i>person-role conflict</i> (sulit melakukan peran, mis. anggota komite harus mengkritik tetapi tak nyaman) dan <i>inter-role conflict</i> (keanggotaan kelompok berbeda bersaing, mis. rapat tahunan perusahaan bersamaan dengan workshop lembaga sosial). Juga <b>ambiguitas peran</b>: tanggung jawab tak jelas, terutama anggota baru atau perubahan tugas (juru tulis dokumen saat beralih ke komputer).</li>
<li><b>Kohesi</b>: rasa tertarik dan setia yang memotivasi anggota bertahan; ilustrasi <i>Three Musketeers</i>: “All for one and one for all”. Diukur dari: (1) ketertarikan interpersonal antaranggota, (2) ketertarikan pada kegiatan dan fungsi kelompok, (3) kelompok sebagai alat memuaskan kebutuhan pribadi.</li></ul>
${T(`<tr><th>Arti penting kohesi</th><th>Kelompok kurang/terlalu kohesif</th></tr>
<tr><td>1) Erat dengan <b>kepuasan</b><br>2) Mendorong <b>produktivitas</b> (kooperatif, beban seimbang, efisien)<br>3) Mendorong <b>semangat</b><br>4) Mendorong <b>komunikasi efektif dan efisien</b> (semua saluran terbuka)</td><td>Tidak kohesif: tak ada rasa terlibat dan antusiasme. Terlalu kohesif: <b>group think syndrome</b>, kecenderungan selalu setuju dengan kelompok; pendapat beda diabaikan karena menekankan loyalitas.</td></tr>`)}
<h3>3. Proses dalam kelompok</h3>
${T(`<tr><th>Proses</th><th>Isi</th></tr>
<tr><td>Deindividuasi (dampak terhadap kesadaran diri)</td><td>Keterlibatan kelompok besar mengurangi <i>self-awareness</i>; kurang berpikir mendalam, berperilaku sesuai kata hati; tindakan tak konsisten dengan sikap dan menyerap norma kelompok. Contoh: urban vandalism, crowd violence, mentalitas lynch-mob; penggemar pemalu di konser rock ikut protes. Tak perlu berinteraksi: cukup kehadiran orang banyak.</td></tr>
<tr><td>Fasilitasi sosial (dampak terhadap kinerja)</td><td>Kehadiran orang lain bisa mendorong (senam berkelompok) atau mengganggu (mengetik dilihat dari dekat). Bergantung <b>kompleksitas tugas</b>: mendorong tugas <b>sederhana</b>, mengganggu tugas <b>rumit</b>.</td></tr>
<tr><td>Sosialisasi kelompok</td><td>Tahap: <b>investigasi → sosialisasi → pemeliharaan</b>, kadang <b>resosialisasi</b> dan <b>kenangan</b>. Investigasi saling menyelidiki keuntungan; sosialisasi mempelajari norma, nilai, metode (bisa inisiasi formal, meningkatkan kesetiaan); pemeliharaan; ketertarikan bisa hilang, resosialisasi mengajak kembali; bila gagal keluar dan tinggal kenangan.</td></tr>`)}
<h3>4. Pembuatan keputusan</h3>
<p>Perhatian dasar: apakah kelompok lebih baik daripada individu dalam membuat keputusan. <b>Lima faktor kualitas keputusan kelompok:</b></p>
${T(`<tr><th>Faktor</th><th>Isi</th></tr>
<tr><td>a. Tujuan sama</td><td>Lebih baik bila semua menerima tujuan yang sama</td></tr>
<tr><td>b. Pembagian tugas</td><td>Tugas mudah dibagi → delegasi dan hasil lebih baik (liburan); sulit dibagi (komite konstitusi)</td></tr>
<tr><td>c. Status dan komunikasi</td><td>Status tinggi bicara lebih banyak dan berpengaruh; status rendah tunduk</td></tr>
<tr><td>d. Ukuran kelompok</td><td>Makin kecil makin efisien; kelompok besar mewakili lebih banyak pendapat tetapi kontribusi tiap anggota kurang. Kelompok kecil (5 orang) mengendalikan dominasi.</td></tr>
<tr><td>e. Heterogenitas</td><td>Homogen lebih cepat tetapi mungkin kualitas rendah; heterogen lebih baik hanya jika perbedaan tidak memecah-belah atau direduksi jadi stereotip</td></tr>`)}
<p><b>Tiga sumber bias:</b> (a) <b>predisposisi anggota</b> (kecenderungan masing-masing), (b) <b>solusi terendah</b> (sulit menerima kritik, anggota menyimpan informasi, mendukung solusi terendah yang bisa diterima untuk mengakhiri konflik; <i>self-justification</i>: setelah keputusan, lebih mudah merasionalkan daripada mengkritik), (c) <b>pergeseran pilihan</b> (pertimbangan dibangun di atas <i>pre-existing leanings</i>, mis. “pro-pantai”, mengabaikan alternatif dan masalah praktis) yang dikenal sebagai <b>polarisasi kelompok</b>.</p>
<h3>5. Polarisasi kelompok</h3>
<ul><li>Anggapan lama: dalam kelompok orang kurang berani, kurang kreatif, menghindari risiko. <b>Stoner</b>: justru lebih berani, disebut <b><i>the risky shift</i></b> (geseran risiko). Belakangan terbukti tak selalu; sering lebih konservatif. Yang terjadi sebenarnya <b>geseran menuju polarisasi</b>: sikap agak mendukung → setelah diskusi lebih kuat mendukung; agak menentang → lebih keras menentang. Cenderung ke posisi <b>ekstrem</b>.</li>
<li><b>Dua implikasi negatif (Rakhmat):</b> (1) ekstremisme membuat anggota jauh dari dunia nyata, peluang salah besar, produktivitas turun = <b>groupthink syndrome</b> (pengambilan keputusan dalam kelompok sangat kohesif yang berusaha mempertahankan konsensus sehingga kemampuan kritis tidak efektif); (2) ekstremisme dalam kelompok gerakan sosial/politik: pandangan sama dipertegas, muncul <b><i>self-righteousness</i></b> dan menyalahkan kelompok lain; kelompok saingan mengalami hal sama.</li></ul>
${I('Polarisasi = <b>kecenderungan awal diperkuat</b>. Risky shift = geseran risiko (Stoner). Groupthink = kohesif + takut beda.')}
<h3>B. Kepemimpinan (<i>leadership</i>)</h3>
<p>Faktor paling menentukan keefektifan komunikasi kelompok. Pemimpin ditunjuk atau muncul lewat komunikasi. <b>Pemimpin</b> = anggota berpengaruh yang menuntun, mengarahkan, memotivasi. Kepemimpinan = fungsi empat faktor: <b>kualitas pemimpin, sifat kelompok, keadaan kelompok, penghargaan kelompok terhadap pemimpin</b>.</p>
<h3>1. Perilaku kepemimpinan</h3>
<ul><li>Dua perilaku utama: <b>berorientasi tugas</b> dan <b>sosioemosional</b>. <b>Spesialis</b>: sebagian kompeten di keduanya; sebagian unggul di satu (spesialis tugas; <b><i>maintenance specialist</i></b> unggul sosioemosional).</li>
<li><b>Kepemimpinan unggul</b>: memperhatikan anggota (sosioemosional) dan produksi (tugas), mensinergikan dua agenda.</li></ul>
<h3>2. Lima fungsi pemimpin</h3>
${T(`<tr><th>Fungsi</th><th>Isi</th></tr>
<tr><td>Pencapaian tujuan</td><td>Menetapkan tujuan, memformulasikan rencana</td></tr>
<tr><td>Pemeliharaan kelompok</td><td>Mengawasi interaksi dan struktur, mereduksi konflik, mengembangkan harmoni</td></tr>
<tr><td>Identitas simbolik</td><td>Kelompok dikenali lewat pemimpin; memberi simbol dan kesatuan</td></tr>
<tr><td>Perwakilan kelompok</td><td>Mewakili harapan dan kebutuhan saat bernegosiasi dengan pihak luar</td></tr>
<tr><td>Perubahan kelompok</td><td>Membuat anggota mengembangkan peran, membangun pengaruh dan kepemimpinan, membuat kelompok tumbuh</td></tr>`)}
<h3>3. Tiga cara pandang siapa pantas memimpin</h3>
${T(`<tr><th>Pendekatan</th><th>Isi</th></tr>
<tr><td>Pemimpin dilahirkan</td><td>Pandangan tradisional: kecakapan memimpin bawaan/diwariskan; tidak diciptakan</td></tr>
<tr><td>Soal gaya (White dan Lippit)</td><td><b>Otoriter</b>: seperti diktator, membuat tujuan dan kebijakan, membentuk tim dan tugas, menjaga jarak; agresi anggota tinggi; produktivitas turun bila pemimpin absen. <b>Demokratis</b>: memberi pedoman tetapi anggota membuat kebijakan, tujuan, tugas dan tim; agresi sedikit; produktivitas konstan walau pemimpin tidak ada. <b><i>Laissez-faire</i></b> (“membiarkan”): kebebasan penuh, partisipasi pemimpin minimal.</td></tr>
<tr><td>Kontekstual</td><td>Hasil totalitas kemampuan individu (diwariskan + dipelajari), tujuan kelompok, tekanan dari luar, dan cara anggota berbicara, bekerja, dan berhubungan</td></tr>`)}
</div>
<div class="sec"><h2>🔥 Sering keluar di ujian</h2><ul>
<li>Acceptance = menerima penuh (identifikasi, internalisasi). Compliance = parsial (konformitas, kepatuhan). Contoh pengaruh <b>informasional</b>: ganti cara karena informasi/bukti (bukan ikut iklan, bukan cuci otak, bukan empati).</li>
<li>Konformitas = menyesuaikan dengan perilaku <b>kelompok</b> (tekanan kelompok). Faktor situasi: ukuran, kebulatan suara, kohesi, komitmen publik. Jebakan: “loyalitas kelompok, anggota saling terikat” = kohesi.</li>
<li>Sherif = norma (1930-an). Asch = tekanan kelompok (1940–50-an). Crutchfield = kehadiran tak langsung. Milgram = kepatuhan, experimental realism. Faktor Milgram: sosok berwenang dan dukungan kelompok (bom bunuh diri = sosok wewenang).</li>
<li>Power = kekuatan pemberi pengaruh untuk <b>mengubah sikap dan perilaku</b> (bukan hanya hukuman atau imbalan). Enam tipe Raven. Dampak bagi yang berkuasa = <b>korupsi kekuasaan</b>.</li>
<li>Jebakan “kecuali” modal power: “tidak pemalu” bukan modal; yang benar berani memberi hukuman/imbalan, disukai dan dihormati, berkeahlian.</li>
<li>Kelompok = interaksi, persepsi dan tujuan bersama; lift yang berhenti mendadak atau bis kota mogok bisa menjadi kelompok; yang biasa saja = aggregates.</li>
<li>Deviance menurut pembandingan sosial: penyimpang <b>merusak atau mengurangi konsensus</b>. Kohesi: saling menyukai dan mendukung tujuan.</li>
<li>Deindividuasi = berkurangnya kesadaran diri. Fasilitasi sosial: tugas sederhana didorong, rumit terganggu.</li>
<li>Bales = agenda tugas dan sosial. Struktur kunci: norma, peran, kohesi. Konflik peran: person-role dan inter-role.</li>
<li>Lima faktor keputusan: tujuan, pembagian tugas, status-komunikasi, ukuran, heterogenitas. Tiga bias: predisposisi, solusi terendah, pergeseran pilihan. Heterogenitas lebih lambat karena <b>banyak perbedaan</b> (bukan karena kategori sosial tak dipertimbangkan; itu masalah homogen).</li>
<li>Solusi terendah (self-justification): setelah keputusan lebih mudah <b>merasionalisasi daripada mengkritik</b>.</li>
<li>Groupthink = kelompok <b>sangat kohesif</b> mempertahankan konsensus sehingga tidak kritis (bukan “heterogen” atau “homogen”).</li>
<li>Kepemimpinan: gaya White dan Lippit (otoriter, demokratis, laissez-faire); lima fungsi; tiga cara pandang; empat faktor kepemimpinan.</li></ul></div>

{n:9,e:'📺',t:'Komunikasi Massa dan Efek terhadap Individu',d:'Sistem komunikasi massa, khalayak, dan efek media.',
mat:`
<div class="sec"><h2>🌟 Pengantar Modul 9</h2>
<p><b>Komunikasi massa</b> = komunikasi dengan media massa kepada sejumlah besar orang. Bagi kebanyakan orang media hanya hiburan, tetapi ilmuwan komunikasi melihat masyarakat makin bergantung pada media, secara <b>sosial</b> (politik, ekonomi, budaya, agama) dan <b>personal</b>. Modul ini fokus pengaruh di tingkat personal. <b>James Potter</b>: manusia kini hidup di dua dunia, <b>dunia nyata dan dunia media</b>. Maka perlu <b>melek media (<i>media literacy</i>)</b>: kemampuan menafsirkan secara cermat makna positif dan negatif serta efek pesan media, tanpa menerima citra begitu saja (Gamble &amp; Gamble).</p>
<p><b>Tujuan:</b> sistem komunikasi massa; perbedaan komunikasi massa dan tatap muka; khalayak; efek media pada individu; media sebagai agen sosialisasi.</p></div>
<div class="sec"><h2>📘 KB 1: Sistem Komunikasi Massa dan Khalayak</h2>
<h3>A. Sistem komunikasi massa</h3>
<p><b>DeFleur dan Dennis: komunikasi massa adalah proses, lima tahap:</b></p>
<ol><li>Pesan diformulasikan oleh <b>komunikator profesional</b>.</li><li>Dikirim lewat cara yang <b>relatif cepat dan berkelanjutan</b> memakai media.</li><li>Mencapai khalayak <b>besar dan beragam</b> yang memilih media secara <b>selektif</b>.</li><li>Anggota khalayak secara individual menafsirkan pesan sehingga memahami makna kurang lebih sejajar dengan maksud komunikator.</li><li>Dari pengalaman memberi makna itu, anggota khalayak <b>dipengaruhi</b> dengan cara tertentu.</li></ol>
<p><b>Komunikator profesional</b>: wartawan, editor, produser, sutradara, pemusik, dll. di industri komunikasi; tidak mengenal khalayak satu per satu; sebagian merancang pesan untuk bisnis. Contoh: penyuluhan lewat media mengubah kepercayaan salah bahwa AIDS mudah menular.</p>
${T(`<tr><th>Tokoh</th><th>Definisi / karakteristik</th></tr>
<tr><td>Gamble &amp; Gamble: 7 karakteristik</td><td>1) mencapai khalayak banyak yang tak dikenal personal oleh pengirim; 2) khalayak <b>heterogen</b>; 3) memakai <b>medium</b>; 4) pesan bersifat <b>publik</b>; 5) pengirim <b>organisasi formal</b> (bukan perorangan); 6) dikontrol banyak <b>gatekeepers</b> (editor/redaktur menyeleksi dan mengolah isi); 7) <b>feedback terbatas</b></td></tr>
<tr><td>Gamble &amp; Gamble (definisi)</td><td>Proses mengirim pesan yang dapat diproses gatekeepers sebelum dikirim ke khalayak besar lewat saluran difusi luas (cetak, audio, visual)</td></tr>
<tr><td>Joseph R. Dominick</td><td>Proses ketika organisasi kompleks dengan bantuan satu atau lebih mesin memproduksi dan mengirim pesan kepada khalayak <b>besar, heterogen, tersebar</b></td></tr>
<tr><td>Jalaluddin Rakhmat</td><td>Komunikasi kepada khalayak <b>tersebar, heterogen, anonim</b> lewat media cetak/elektronik sehingga pesan sama diterima <b>serentak dan sesaat</b></td></tr>`)}
${I('Lima tahap DeFleur: <b>P-K-K-T-P</b> (Profesional, Kirim cepat, Khalayak selektif, Tafsir, Pengaruh). Karakter Gamble: ingat <b>7</b>, kunci: gatekeeper dan feedback terbatas.')}
<h3>B. Perbedaan komunikasi massa dan tatap muka (DeFleur dan Dennis)</h3>
<p>Tiga aspek: konsekuensi memakai media, khalayak luas dan beragam, serta pengaruh sosial dan kultural.</p>
<ul><li><b>1. Konsekuensi menggunakan media</b>: lewat telepon umpan balik kurang kaya daripada tatap muka (tak melihat ekspresi, alis, senyum, cibiran); keterbatasan umpan balik menurunkan keefektifan atau keakuratan, masalah teknis menimbulkan <i>incongruence</i>. Tetapi <b>telepon tetap komunikasi antarpribadi</b> (proses serupa dengan tatap muka, ada mediator, ada umpan balik langsung). Pada media massa umpan balik langsung <b>hilang</b>; acara telepon/SMS ke penyiar hanya <b>umpan balik tertunda</b> (<i>delayed feedback</i>). Komunikasi massa pada dasarnya <b>satu arah</b>. Ada kesulitan mekanik (salah cetak, separasi warna buruk, siaran terganggu cuaca), sehingga lebih kurang akurat daripada tatap muka.</li>
<li><b>2. Khalayak luas dan beragam</b>: pada dasarnya komunikasi massa bentuk khusus komunikasi antarpribadi. Tetapi tanpa umpan balik dan khalayak tak dikenal, komunikator berasumsi khalayak <b>berkapasitas intelektual terbatas, senang dihibur, ketertarikan rendah</b>, sehingga pesan tak menuntut intelektual tinggi dan isi hiburan tinggi.</li>
<li><b>3. Pengaruh sosial dan kultural</b>: aturan jauh lebih beragam dan rumit (pemilik, pengiklan, aturan pemerintah, arus antarnegara). Bila khalayak tersinggung, komunikator tak segera tahu; kekesalan dapat berujung <b>pemboikotan, demonstrasi, perusakan media</b>.</li></ul>
<p><b>Elizabeth Noelle-Neumann: empat tanda pokok komunikasi massa</b> yang tak ada pada interpersonal: bersifat <b>tidak langsung</b> (lewat media teknis), <b>searah</b>, <b>terbuka</b> (publik tak terbatas dan anonim), publik <b>tersebar secara geografis</b>.</p>
<p>Perbedaan teknis menimbulkan karakteristik psikologis khas dalam empat hal: <b>(a) pengendalian arus informasi</b> (bila hanya dikendalikan komunikator, situasi menunjang <b>persuasi efektif</b>; bila khalayak mengatur, mendorong <b>belajar efektif</b>; komunikator sukar menyesuaikan pesan dengan reaksi komunikan); <b>(b) umpan balik</b> (interpersonal tak terbatas, verbal dan nonverbal; massa hampir tidak ada); <b>(c) stimulasi alat indra</b> (tergantung media: koran hanya melihat, radio hanya mendengar); <b>(d) proporsi unsur isi dengan unsur hubungan</b> (hanya disebut, tak diuraikan di modul).</p>
<h3>C. Khalayak</h3>
<p>Prinsip dasar ketiga beroperasinya media massa. McLuhan membagi sejarah manusia berdasarkan penggunaan media (modul menguraikan tiga bagian: situasi konsumsi, pola penggunaan oleh individu, reaksi khalayak).</p>
<h3>1. Situasi konsumsi media (Jeffres)</h3>
${T(`<tr><th>Tipe</th><th>Isi</th></tr>
<tr><td><i>Media seeking</i></td><td>Menggunakan media karena <b>tindakan konsumsi</b> (membaca, menonton, mendengar) lebih penting daripada isi (menyalakan TV saat kesepian atau bosan). Membaca koran dari halaman satu sampai terakhir secara teratur, waktu lebih lama.</td></tr>
<tr><td><i>Content seeking</i></td><td>Memakai media karena <b>isinya</b> (mengikuti lanjutan telenovela)</td></tr>
<tr><td><i>Information seeking</i></td><td>Content seeking yang dicari khusus; isi benar-benar terseleksi; membaca hanya berita yang dicari</td></tr>`)}
<h3>2. Pola penggunaan media oleh individu</h3>
<p>Jawabannya ada pada individu: kebutuhan dasar, motif, perbedaan individual. Jeffres: dua pendekatan.</p>
<ul><li><b>Pendekatan kategori sosial</b>: pendidikan, pendapatan, pekerjaan, jenis kelamin, status perkawinan, ras dan etnik, agama memengaruhi total media, pilihan media, dan preferensi isi.</li>
<li><b>Pendekatan <i>uses and gratifications</i></b> (<b>Elihu Katz, Jay G. Blumler, Michael Gurevitch, 1974</b>). Lima asumsi: (1) khalayak <b>aktif</b>; (2) inisiatif mengaitkan pemuasan kebutuhan dengan pilihan media ada pada <b>anggota khalayak</b>; (3) media bersaing dengan sumber lain memuaskan kebutuhan; (4) tujuan pemilih media disimpulkan dari data anggota khalayak (orang cukup mengerti melaporkan motifnya); (5) penilaian <b>anti-kultural</b> media ditangguhkan sebelum orientasi khalayak diteliti. Model memandang individu <b>suprarasional dan sangat selektif</b>; fokus proses penerimaan pesan; perbedaan motif → reaksi berbeda → efek berbeda.</li></ul>
${T(`<tr><th>Katz, Gurevitch, Haas (1973): 5 kelompok kebutuhan</th></tr>
<tr><td>1) Kognitif (mengerti)</td></tr><tr><td>2) Afektif (memperkuat pengalaman emosional)</td></tr><tr><td>3) Integratif (memperkuat kepercayaan diri, kredibilitas, stabilitas diri)</td></tr><tr><td>4) Memperkuat kontak dengan keluarga, teman, dunia luar</td></tr><tr><td>5) Melepaskan ketegangan</td></tr>`)}
<p><b>William McGuire (1974): 16 motif</b>, dikelompokkan motif <b>kognitif</b> (pengetahuan) dan <b>afektif</b> (perasaan).</p>
${T(`<tr><th>Kelompok</th><th>Teori (4 + 4 per kelompok)</th></tr>
<tr><td>Kognitif, <b>memelihara keseimbangan</b> (stabilitas psikologis)</td><td>(a) <b>Konsistensi</b>: memelihara orientasi eksternal pada lingkungan; (b) <b>Atribusi</b>: memahami sebab peristiwa; (c) <b>Kategorisasi</b>: memberi makna dunia lewat kategori internal; (d) <b>Objektifikasi</b>: memberi makna lewat hal-hal eksternal</td></tr>
<tr><td>Kognitif, <b>mengembangkan kondisi kognitif</b></td><td>(e) <b>Otonomi</b>: aktualisasi diri, identitas otonom; (f) <b>Stimulasi</b>: stimuli sebanyak-banyaknya memperkaya pikiran; (g) <b>Teleologis</b>: mencocokkan persepsi situasi sekarang dengan representasi internal kondisi yang dikehendaki; (h) <b>Utilitarian</b>: situasi sebagai peluang memperoleh informasi menghadapi tantangan hidup</td></tr>
<tr><td>Afektif, <b>memelihara stabilitas</b></td><td>(a) <b>Reduksi tegangan</b>: kepuasan pada pengurangan ketegangan; (b) <b>Ekspresif</b>: kepuasan mengungkapkan eksistensi lewat perasaan dan keyakinan; (c) <b>Egodefensif</b>: hidup dalam citra diri tertentu yang sesuai; (d) <b>Peneguhan</b>: bertingkah laku yang membawa ganjaran</td></tr>
<tr><td>Afektif, <b>mengembangkan kondisi psikologis</b></td><td>(e) <b>Penonjolan</b>: mengembangkan potensi demi penghargaan diri dan orang lain; (f) <b>Afiliasi</b>: mencari kasih sayang dan penerimaan; (g) <b>Identifikasi</b>: pemain peran yang memuaskan ego dengan menambah peran yang memuaskan konsep diri; (h) <b>Peniruan</b>: mengembangkan kemampuan afektif</td></tr>`)}
${I('McGuire 16 = 2 × 2 × 4. Kognitif stabil: <b>K-A-K-O</b> (Konsistensi, Atribusi, Kategorisasi, Objektifikasi). Kognitif berkembang: <b>O-S-T-U</b> (Otonomi, Stimulasi, Teleologis, Utilitarian). Afektif stabil: <b>R-E-E-P</b>. Afektif berkembang: <b>P-A-I-P</b>.')}
<h3>3. Reaksi khalayak terhadap media (Melvin DeFleur dan Sandra Ball-Rokeach)</h3>
${T(`<tr><th>Perspektif</th><th>Isi</th></tr>
<tr><td>Perbedaan individual</td><td>Sikap dan organisasi personal-psikologis menentukan stimuli yang dipilih dan maknanya; faktor: potensi biologis, sikap, nilai, kepercayaan, pengalaman</td></tr>
<tr><td>Kategori sosial</td><td>Kelompok sosial bereaksi cenderung lama pada stimuli tertentu; anggota kategori memilih isi dan merespons hampir sama</td></tr>
<tr><td>Hubungan sosial</td><td>Hubungan <b>informal</b> memengaruhi reaksi; hubungan interpersonal memengaruhi penerimaan, pengelolaan, penyampaian informasi dari media</td></tr>`)}
</div>
<div class="sec"><h2>📗 KB 2: Efek Media terhadap Individu</h2>
<p><b>Steven Chaffee</b>: tiga pendekatan melihat efek: (1) efek <b>pesan maupun media itu sendiri</b>; (2) jenis perubahan pada khalayak: <b>kognitif, afektif, behavioral</b>; (3) satuan observasi: individu, kelompok, organisasi, masyarakat/bangsa. Jadi ada <b>satu dikotomi</b> (media fisik / pesan) dan <b>dua trikotomi</b> (kognitif-afektif-behavioral; individual-interpersonal-sistem): matriks <b>2 × 3 × 3 = 18 ruang</b>.</p>
${T(`<tr><th rowspan="2">Sasaran</th><th colspan="3">Media fisik</th><th colspan="3">Pesan</th></tr>
<tr><th>Kognitif</th><th>Afektif</th><th>Behavioral</th><th>Kognitif</th><th>Afektif</th><th>Behavioral</th></tr>
<tr><td>Individual</td><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td><td>6</td></tr>
<tr><td>Interpersonal</td><td>7</td><td>8</td><td>9</td><td>10</td><td>11</td><td>12</td></tr>
<tr><td>Sistem</td><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td></tr>`)}
<h3>A. Efek kehadiran media massa secara fisik (5 efek)</h3>
${T(`<tr><th>Efek</th><th>Isi dan contoh</th></tr>
<tr><td>1. Ekonomis</td><td>Menggerakkan usaha (produksi, distribusi, konsumsi jasa): pabrik kertas koran, jurnalis, periklanan; rumah produksi, juru kamera, sutradara, penulis naskah, artis; pengiklan, <i>dubber</i>, penyiar</td></tr>
<tr><td>2. Sosial</td><td>Perubahan struktur atau interaksi sosial (radio dan TV menaikkan status sosial pemiliknya di pedesaan; TV di kelurahan membentuk jaringan interaksi baru)</td></tr>
<tr><td>3. Penjadwalan kembali kegiatan sehari-hari</td><td>Koran sore → baca sore; telenovela → ibu menunda masak dan arisan; kartun → anak menggeser waktu belajar</td></tr>
<tr><td>4. Penyaluran/penghilangan perasaan tertentu</td><td>Marah, kecewa, kesepian; media dipakai tanpa peduli isi (radio saat sedih; TV untuk “teman”)</td></tr>
<tr><td>5. Perasaan terhadap media</td><td>Percaya dan menyukai media tertentu, tidak pada yang lain, berdasar pengalaman sebelumnya</td></tr>`)}
${I('Lima efek fisik: <b>E-S-P-P-P</b> (Ekonomis, Sosial, Penjadwalan, Penyaluran perasaan, Perasaan terhadap media).')}
<h3>B. Efek pesan media massa</h3>
<h3>1. Efek kognitif</h3>
<ul><li>Komunikasi massa tidak langsung menimbulkan perilaku, tetapi memengaruhi cara kita mengorganisasikan <b>citra</b> tentang lingkungan; citra memengaruhi perilaku. Realitas yang ditampilkan media sudah diseleksi: <b>“realitas tangan kedua” (<i>second hand reality</i>)</b> (Marshall McLuhan). Contoh: Jakarta dianggap tak aman karena berita kriminal banyak, padahal di daerah juga ada tetapi tak diberitakan. Penyebabnya <b>proses gatekeeping</b>.</li>
<li><b>Stereotype</b>: gambaran umum tentang individu/kelompok yang tidak berubah-ubah, sering timpang dan tidak benar (telenovela menggambarkan orang kulit hitam miskin, jahat, pembantu, licik).</li>
<li><b>Teori agenda setting</b>: media menyaring berita; gatekeeper menentukan yang pantas diberitakan; tiap isu diberi <b>bobot</b> (ruang penempatan, waktu tayang) dan <b>penonjolan</b> (ukuran judul, frekuensi). <b>Agenda media</b> memengaruhi <b>agenda publik</b> (apa yang dianggap penting; headline kecelakaan kereta api).</li>
<li><b>Efek prososial</b>: media menyampaikan pengetahuan, keterampilan, nilai baik. Contoh <i>Sesame Street</i>: anak penonton punya pengetahuan lebih baik.</li></ul>
<h3>2. Efek afektif</h3>
<ul><li>Perubahan sikap akibat media masih diperdebatkan. <b>Charles K. Atkin</b>: media memengaruhi orientasi afektif, tetapi tidak sebesar orientasi kognitif. Beberapa studi komunikasi politik membuktikan pengaruh.</li></ul>
${T(`<tr><th>Joseph Klapper: 5 prinsip pembentukan dan perubahan sikap</th></tr>
<tr><td>1. Pengaruh diantarai predisposisi personal, proses selektif, keanggotaan kelompok (faktor personal)</td></tr>
<tr><td>2. Karenanya komunikasi massa lebih <b>memperkokoh</b> sikap dan pendapat yang ada, selain sebagai pengubah</td></tr>
<tr><td>3. Bila mengubah, perubahan <b>kecil pada intensitas</b> lebih umum daripada “konversi” total</td></tr>
<tr><td>4. Cukup efektif mengubah sikap pada bidang <b>pendapat orang lemah</b> (iklan komersial)</td></tr>
<tr><td>5. Cukup efektif menciptakan pendapat tentang <b>masalah baru</b> bila tak ada predisposisi yang harus diperteguh</td></tr>`)}
<p>Media menimbulkan <b>rangsangan emosional</b> (menangis di film sedih, tertawa di komedi). <b>Lima faktor intensitas rangsangan emosional:</b></p>
${T(`<tr><th>Faktor</th><th>Isi</th></tr>
<tr><td>1. Suasana emosional (<i>mood</i>)</td><td>Kondisi psikologis saat mengonsumsi media</td></tr>
<tr><td>2. Skema kognitif</td><td>Gambaran dalam pikiran sendiri yang menjelaskan peristiwa di media</td></tr>
<tr><td>3. Suasana terpaan (<i>setting exposure</i>)</td><td>Emosi yang “ditularkan” individu lain/objek saat kita mengonsumsi media</td></tr>
<tr><td>4. Predisposisi individual</td><td>Karakteristik khas individu</td></tr>
<tr><td>5. Tingkat identifikasi khalayak</td><td>Sejauh mana merasa terlibat dengan tokoh di media</td></tr>`)}
<p><b>Pornografi</b> (<i>sexually explicit materials</i>): dari bahasa Yunani <i>porne</i> (pelacur) dan <i>graphe</i> (tulisan/gambar); kini: materi di media yang dapat/ditujukan membangkitkan hasrat seksual atau mengeksploitasi seks. Makin banyak pengalaman seksual, makin mudah terangsang. <b>Victor B. Kline</b> (psikiater): empat tahap efek jangka panjang:</p>
${T(`<tr><th>Tahap</th><th>Isi</th></tr>
<tr><td>1. <i>Addiction</i></td><td>Kecanduan/ketagihan; tanpa konsumsi timbul kegelisahan; bisa pada pria berpendidikan atau taat agama</td></tr>
<tr><td>2. Eskalasi</td><td>Butuh materi lebih eksplisit, sensasional, “menyimpang”</td></tr>
<tr><td>3. <i>Desensitization</i></td><td>Materi tabu/imoral menjadi biasa; tidak sensitif terhadap korban kekerasan seksual</td></tr>
<tr><td>4. <i>Act out</i></td><td>Meniru atau menerapkan perilaku seks yang ditonton</td></tr>`)}
${I('Kline = <b>A-E-D-A</b> (Addiction, Eskalasi, Desensitisasi, Act out). Klapper = <b>5</b> prinsip. Emosi = <b>5</b> faktor.')}
<h3>3. Efek behavioral</h3>
<p>Perilaku tampak sehari-hari: pola tindakan, kegiatan, kebiasaan. Fokus: <b>agresif (antisosial)</b> dan <b>prososial</b>.</p>
<ul><li><b>Agresi</b> = perilaku yang diarahkan untuk menyakiti/melukai orang lain yang menghindari perlakuan itu. Film kekerasan mengajarkan agresi, mengurangi kendali moral, menumpulkan perasaan. Kelompok studi ini = <b>Teori Stimulasi</b>.</li>
<li><b>Albert Bandura (1960-an)</b>: anak prasekolah menonton film model memperlakukan kasar boneka karet <b>“Bobo”</b>; saat sendirian dengan boneka, mereka bersikap sama agresif; anak yang tak menonton tidak. Studi lanjutan (badut sungguhan) konsisten.</li>
<li><b>Teori Katarsis (Feshbach, 1955)</b>: menonton kekerasan menyalurkan perasaan agresif sehingga kembali normal dan puas. Namun studi lebih mendukung <b>Teori Stimulasi</b> (media merangsang potensi agresi, bukan menciptakan dorongan).</li>
<li><b>Desensitisasi</b>: budaya kekerasan membuat khalayak tak peka. <b>Sissela Bok (1998)</b>: kebal terhadap kesakitan orang lain = <b><i>compassion fatigue</i></b> (keletihan yang membuat tak sanggup lagi terharu atau berbelas kasihan).</li></ul>
<p><b>Efek prososial</b>: media (TV, radio, film) dipakai sebagai media pendidikan, ada keberhasilan dan kegagalan. Teori psikologi: <b>Teori Belajar Sosial Bandura</b>: belajar bukan hanya dari pengalaman langsung tetapi dari <b>peniruan/peneladanan (<i>modeling</i>)</b>; perilaku hasil faktor kognitif dan lingkungan. <b>Empat proses:</b> <b>perhatian</b> (belum cukup), <b>pengingatan</b> (menyimpan dan memanggil kembali), <b>reproduksi motoris</b> (menghasilkan kembali perilaku), <b>motivasional</b> (dorongan dari diri: puas, senang, citra diri ideal).</p>
${T(`<tr><th>3 wilayah prososial (Joseph R. Dominick)</th><th>Isi</th></tr>
<tr><td>a. Efek terapik</td><td>Membantu anak mengatasi fobia (takut anjing, dokter gigi); film “tak perlu takut dokter gigi” membuat lebih berani</td></tr>
<tr><td>b. Pengembangan kendali diri</td><td>Eksperimen anak lima tahun: ruang berisi mainan dan kamus, dilarang main mainan. Tiga kelompok: <b>tanpa film</b>; <b>model berhadiah</b> (anak bermain dan ditemani ibu); <b>model berhukum</b> (anak bermain lalu dihukum ibu). Hasil: model berhukuman paling lama menahan diri; model berhadiah paling cepat bermain.</td></tr>
<tr><td>c. Kerja sama, membagi, membantu</td><td>Episode <i>The Waltons</i> membuat anak lebih bersedia saling membantu dalam bermain peran</td></tr>`)}
<p>Studi ini berbasis <b>eksperimen laboratorium</b>, bukan kehidupan nyata. <b>Dominick</b>: hubungan menonton dan perilaku prososial <b>lebih lemah</b> daripada dengan perilaku agresif, karena perilaku agresif di TV <b>jelas, mudah dilihat, fisik</b>, sedangkan prososial <b>tersamar, rumit, melibatkan tindakan verbal</b>; anak lebih mudah belajar dari penyajian sederhana, langsung, aktif. Pengaruh media tidak langsung pada kebanyakan individu; anak diasumsikan lebih “murni”, makin dewasa makin banyak variabel.</p>
<h3>C. Media sebagai agen sosialisasi</h3>
<p>Terpaan media makin besar (jam menonton anak berlipat) → media makin berperan sebagai <b>agen sosialisasi</b> (menanamkan pengetahuan, sikap, nilai). Paling berperan: <b>televisi</b> (makin banyak dimiliki, mudah diterima tanpa kecakapan membaca, visual atraktif bagi muda). <b>Milton Chen</b>: TV adalah medium anak-anak, bisa “menggenggam” anak. Sosialisasi proses kompleks: teman, orang tua, saudara, sekolah, pengalaman langsung, media. Belajar melalui <b>observasi</b> (orang lain nyata maupun tokoh fiksi media).</p>
<p><b>Media kuat membentuk sikap, persepsi, kepercayaan, nilai bila:</b> (1) gagasan, orang, atau perilaku sama muncul <b>konsisten dari program ke program</b> secara <b>stereotipikal</b>; (2) khalayak <b>terekspos berat</b>; (3) khalayak punya <b>interaksi terbatas dengan orang tua/agen sosialisasi lain</b> dan tak punya kepercayaan alternatif sebagai standar menilai kebenaran isi media (contoh remaja menonton TV 5 jam sehari dengan film kekerasan, orang tua jarang bicara, bolos, tak ke tempat ibadah).</p>
<p><b>George Gerbner: Analisis Kultivasi (<i>Cultivation Analysis</i>)</b>: menonton TV dalam jumlah besar <b>mengkultivasi (menanam)</b> persepsi realitas yang konsisten dengan dunia di TV. Penonton dewasa berat memersepsikan tingkat kekerasan dunia jauh lebih tinggi daripada kenyataan. Stereotip (pembantu bodoh, orang gemuk diolok) memengaruhi cara memandang. Media juga membentuk sikap positif (<i>Sesame Street</i>: pengetahuan dan sikap prososial lebih baik). Hubungan media dan perilaku bersifat <b>resiprokal (timbal balik)</b>: yang agresif memilih tontonan agresif lalu makin agresif; anak pintar prososial menonton <i>Sesame Street</i> lalu makin pintar dan bersahabat.</p>
${I('Agen sosialisasi = TV. Kultivasi = Gerbner (“menanam” persepsi). Tiga syarat media kuat: <b>K-B-I</b> = Konsisten-stereotipikal, Berat terpaan, Interaksi terbatas.')}
</div>
<div class="sec"><h2>🔥 Sering keluar di ujian</h2><ul>
<li>Media dekat dengan kehidupan → memengaruhi <b>perilaku sosial</b>. Media massa bagus untuk penyuluhan karena <b>menjangkau khalayak beragam</b>.</li>
<li>Isi media lebih dapat dipertanggungjawabkan karena <b>dikontrol banyak gatekeepers</b> (Gamble &amp; Gamble).</li>
<li>Telepon tetap antarpribadi karena <b>dapat memberi umpan balik langsung</b>; prosesnya serupa tatap muka. Media massa: umpan balik <b>tertunda</b>, satu arah.</li>
<li>Noelle-Neumann: tidak langsung, searah, terbuka, publik tersebar. Jebakan “tidak mengenal perbedaan sosial budaya” dan “mudah dipahami dan diulang” (salah).</li>
<li>Media seeking (konsumsi lebih penting dari isi; baca dari halaman pertama sampai akhir) vs content seeking vs information seeking.</li>
<li>Uses and gratifications = Katz, Blumler, Gurevitch (1974); khalayak aktif, “suprarasional dan sangat selektif”. Kategori sosial = pendidikan, pendapatan, dst.</li>
<li>Teori kognitif McGuire: <b>utilitarian</b> = situasi sebagai peluang informasi menghadapi tantangan hidup; teleologis = mencocokkan persepsi dengan representasi kondisi dikehendaki. Jangan tertukar dengan atribusi dan konsistensi.</li>
<li>Chaffee: <b>satu dikotomi dan dua trikotomi</b> = 18 ruang. Dikotomi = efek media fisik dan efek pesan.</li>
<li>Lima efek fisik; efek kehadiran fisik memberi lapangan kerja (juru kamera) = efek ekonomis.</li>
<li>Realitas tangan kedua = McLuhan; gatekeeping; stereotype; agenda setting (agenda media → agenda publik). Artis sering main komedi dinilai lucu = realitas tangan kedua dan gatekeeping.</li>
<li>Klapper 5 prinsip; lima faktor emosional: <b>skema kognitif</b>, mood, setting exposure, predisposisi individual, identifikasi (jebakan: proses selektif dan keanggotaan kelompok itu faktor personal Klapper, bukan lima faktor emosional).</li>
<li>Teori Stimulasi (didukung studi) vs Katarsis (Feshbach 1955). Bandura: Bobo, belajar sosial (4 proses). Sissela Bok: compassion fatigue.</li>
<li>Dominick: tiga wilayah prososial: terapi, kendali diri, kerja sama-membagi-membantu. Hubungan prososial lebih lemah karena perilakunya tersamar dan verbal.</li>
<li>Gerbner = kultivasi. Faktor media kuat: stereotipikal konsisten, terpaan berat, interaksi terbatas/tak ada standar alternatif. Hubungan media-perilaku = resiprokal.</li></ul></div>

const app=document.getElementById('app');let tab=0;
function home(){app.innerHTML='<p class="note">Pilih modul untuk mulai belajar. Modul yang belum berisi akan ditulis bertahap.</p><div class="grid">'+M.map(m=>`<a class="mc ${m.mat?'':'soon'}" href="#modul-${m.n}"><span class="em">${m.e}</span><br><span class="no">Modul ${m.n}</span><b>${m.t}</b><small>${m.d}${m.mat?'':' (segera hadir)'}</small></a>`).join('')+'</div>'}
function quiz(s){let h=`<p class="note">${s.note||''}</p>`;if(!s.q.length)return h;const keyed=s.q.some(x=>x.k!=null);if(keyed)h+=`<div class="sc" id="sc">Skor: 0/${s.q.length}</div>`;
s.q.forEach((x,i)=>{h+=`<div class="q" data-i="${i}"><b>${i+1}. ${x.q}</b>`+x.o.map((o,j)=>`<button class="o" data-j="${j}">${'ABCD'[j]}. ${o}</button>`).join('')+'</div>'});return h}
function bind(s){let sc=0;document.querySelectorAll('.q').forEach(qe=>{const x=s.q[qe.dataset.i];qe.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;qe.querySelectorAll('.o').forEach(o=>o.disabled=true);if(x.k==null){b.classList.add('sel');return}
qe.querySelectorAll('.o')[x.k].classList.add('ok');if(j===x.k)sc++;else b.classList.add('no');document.getElementById('sc').textContent='Skor: '+sc+'/'+s.q.length})})}
function mod(n){const m=M.find(x=>x.n==n);if(!m){home();return}
const tabs=['Materi',...(m.tf||[]).map(t=>t.name)];
app.innerHTML=`<a class="back" href="#">← Semua modul</a><h2>${m.e} Modul ${m.n}: ${m.t}</h2><div class="tabs">${tabs.map((t,i)=>`<button class="tab ${i==tab?'on':''}" data-i="${i}">${t}</button>`).join('')}</div><div id="bd"></div>`;
const bd=document.getElementById('bd');
if(tab==0)bd.innerHTML=m.mat||'<div class="sec"><p>Materi modul ini belum ditulis. Ketik “lanjut” di chat untuk tahap berikutnya.</p></div>';else{const s=m.tf[tab-1];bd.innerHTML=quiz(s);bind(s)}
app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=+b.dataset.i;mod(n);scrollTo(0,0)})}
